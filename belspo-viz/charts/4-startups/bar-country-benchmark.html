<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Startup investment per capita — all funding vs AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
html, body { height: 100%; }
body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Helvetica, Arial, sans-serif;
    background-color: white;
}
.viz-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 56px;
    height: 100vh;
    width: 100vw;
}
#container1 { grid-column: 1 / span 2; grid-row: 1; min-height: 0; position: relative; }
#container2 { grid-column: 1 / span 2; display: flex; align-items: center; justify-content: center; gap: 26px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #334155; }
.legend-swatch { width: 14px; height: 14px; border-radius: 3px; }
.chart-title { font-size: 15px; font-weight: 600; color: #0f172a; margin: 14px 0 0 18px; }
.chart-sub { font-size: 12px; color: #64748b; margin: 3px 0 0 18px; }
svg { display: block; }
.axis text { font-size: 12px; fill: #475569; }
.axis-country text { font-size: 12.5px; fill: #0f172a; }
.axis path, .axis line { stroke: #cbd5e1; }
.grid line { stroke: #e2e8f0; stroke-dasharray: 2 3; }
.grid path { stroke: none; }
.share-label { font-size: 11px; fill: #475569; }
.tooltip {
    position: absolute;
    pointer-events: none;
    background: #0f172a;
    color: #f8fafc;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.45;
    opacity: 0;
    transition: opacity .12s;
    box-shadow: 0 4px 14px rgba(15,23,42,.25);
    z-index: 10;
}
.tooltip b { color: #fff; }
  </style>
</head>
<body>
  <div class="viz-grid">
    <div id="container1">
      <div class="chart-title" id="title"></div>
      <div class="chart-sub" id="subtitle"></div>
      <div id="chart"></div>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div id="container2">
      <div class="legend-item"><span class="legend-swatch" style="background:#cbd5e1"></span><span>All startup investment</span></div>
      <div class="legend-item"><span class="legend-swatch" style="background:#2756d3"></span><span>AI subset — Belgium</span></div>
      <div class="legend-item"><span class="legend-swatch" style="background:#f59e0b"></span><span>AI subset — EU27</span></div>
      <div class="legend-item"><span class="legend-swatch" style="background:#64748b"></span><span>AI subset — peer economies</span></div>
      <div class="legend-item" style="color:#64748b">% = AI share of all funding</div>
    </div>
  </div>
<script>
const COLOR_ALL     = "#cbd5e1";  // all startup funding, every geo
const COLOR_AI_BE   = "#2756d3";  // Belgium — same blue as bar-country-comparison.html
const COLOR_AI_EU   = "#f59e0b";  // EU27 — same amber as bar-country-comparison.html
const COLOR_AI_PEER = "#64748b";  // peer economies

const RAW = JSON.parse(document.getElementById('chart-data').textContent);
const ALL_YEARS = Object.keys(RAW.years).map(Number).sort((a, b) => a - b);

// ─── v2 URL contract: ?years=2025 | 2021-2025 | 2021,2023,2025 ───────────────
function selectedYears() {
  const p = new URLSearchParams(window.location.search).get('years');
  if (!p) return ALL_YEARS.slice();
  const out = new Set();
  p.split(',').forEach(tok => {
    const t = tok.trim();
    const m = t.match(/^(\d{4})-(\d{4})$/);
    if (m) {
      for (let y = +m[1]; y <= +m[2]; y++) if (RAW.years[y]) out.add(y);
    } else if (/^\d{4}$/.test(t) && RAW.years[t]) {
      out.add(+t);
    }
  });
  return out.size ? [...out].sort((a, b) => a - b) : ALL_YEARS.slice();
}

const YEARS = selectedYears();

function yearLabel(ys) {
  if (ys.length === 1) return String(ys[0]);
  const contiguous = ys[ys.length - 1] - ys[0] + 1 === ys.length;
  return contiguous ? `${ys[0]}–${ys[ys.length - 1]}` : ys.join(', ');
}

// ─── Pool the selected years ─────────────────────────────────────────────────
const pooled = new Map();
YEARS.forEach(y => {
  RAW.years[y].forEach(r => {
    const cur = pooled.get(r.geo) || { geo: r.geo, ai_usd: 0, all_usd: 0, pop_m: r.pop_m };
    cur.ai_usd  += r.ai_usd;
    cur.all_usd += r.all_usd;
    pooled.set(r.geo, cur);
  });
});

const DATA = [...pooled.values()]
  .map(r => ({
    geo:    r.geo,
    name:   RAW.names[r.geo] || r.geo,
    ai_pc:  r.ai_usd  / (r.pop_m * 1e6),
    all_pc: r.all_usd / (r.pop_m * 1e6),
    ai_usd: r.ai_usd,
    all_usd: r.all_usd,
    pop:    r.pop_m,
    share:  r.all_usd > 0 ? r.ai_usd / r.all_usd : NaN
  }))
  .sort((a, b) => b.all_pc - a.all_pc);

document.getElementById('title').textContent =
  `Startup investment raised per capita — all funding vs the AI subset, ${yearLabel(YEARS)}`;
document.getElementById('subtitle').textContent =
  `USD per inhabitant, companies headquartered in each geography. Crunchbase, dump of 2026-07-31.`;

function fmtPC(v) {
  if (!isFinite(v)) return "N/A";
  if (Math.abs(v) >= 100) return "$" + d3.format(",.0f")(v);
  if (Math.abs(v) >= 10)  return "$" + d3.format(",.1f")(v);
  return "$" + d3.format(",.2f")(v);
}
function fmtUSD(v) {
  if (!isFinite(v)) return "N/A";
  if (Math.abs(v) >= 1e9) return "$" + d3.format(",.2f")(v / 1e9) + "B";
  if (Math.abs(v) >= 1e6) return "$" + d3.format(",.1f")(v / 1e6) + "M";
  return "$" + d3.format(",.0f")(v);
}

const tooltip = d3.select('#tooltip');

function render() {
  const host = document.getElementById('container1');
  const wrap = document.getElementById('chart');
  wrap.innerHTML = '';

  const headerH = 56;
  const width  = host.clientWidth;
  const height = Math.max(220, host.clientHeight - headerH);
  const margin = { top: 22, right: 24, bottom: 34, left: 132 };
  const iw = Math.max(120, width  - margin.left - margin.right);
  const ih = Math.max(120, height - margin.top  - margin.bottom);

  const svg = d3.select(wrap).append('svg')
    .attr('width', width).attr('height', height)
    .append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const y = d3.scaleBand()
    .domain(DATA.map(d => d.geo))
    .range([0, ih]).padding(0.28);

  const ySub = d3.scaleBand()
    .domain(['all', 'ai'])
    .range([0, y.bandwidth()]).padding(0.12);

  const x = d3.scaleLinear()
    .domain([0, d3.max(DATA, d => d.all_pc) * 1.14])
    .range([0, iw]).nice();

  svg.append('g')
    .attr('class', 'grid')
    .attr('transform', `translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(6).tickSize(-ih).tickFormat(''));

  svg.append('g')
    .attr('class', 'axis')
    .attr('transform', `translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(6).tickFormat(v => "$" + d3.format(",")(v)));

  svg.append('g')
    .attr('class', 'axis axis-country')
    .call(d3.axisLeft(y).tickFormat(g => (RAW.names[g] || g)).tickSize(0))
    .call(g => g.select('.domain').remove());

  const groups = svg.selectAll('.grp')
    .data(DATA).join('g')
    .attr('class', 'grp')
    .attr('transform', d => `translate(0,${y(d.geo)})`);

  function barColor(d, series) {
    if (series === 'all') return COLOR_ALL;
    if (d.geo === 'BE')   return COLOR_AI_BE;
    if (d.geo === 'EU27') return COLOR_AI_EU;
    return COLOR_AI_PEER;
  }

  ['all', 'ai'].forEach(series => {
    groups.append('rect')
      .attr('x', 0)
      .attr('y', ySub(series))
      .attr('height', ySub.bandwidth())
      .attr('width', d => Math.max(0, x(series === 'all' ? d.all_pc : d.ai_pc)))
      .attr('fill', d => barColor(d, series))
      .attr('rx', 2)
      .on('mousemove', function (event, d) {
        tooltip
          .style('opacity', 1)
          .style('left', (event.offsetX + 16) + 'px')
          .style('top',  (event.offsetY + 12) + 'px')
          .html(
            `<b>${d.name}</b> &middot; ${yearLabel(YEARS)}<br>` +
            `All startup funding: <b>${fmtPC(d.all_pc)}</b> per capita (${fmtUSD(d.all_usd)})<br>` +
            `AI subset: <b>${fmtPC(d.ai_pc)}</b> per capita (${fmtUSD(d.ai_usd)})<br>` +
            `AI share of all funding: <b>${isFinite(d.share) ? d3.format('.1%')(d.share) : 'N/A'}</b><br>` +
            `Population: ${d3.format(',.1f')(d.pop)}m`
          );
      })
      .on('mouseleave', () => tooltip.style('opacity', 0));
  });

  groups.append('text')
    .attr('class', 'share-label')
    .attr('x', d => x(d.all_pc) + 8)
    .attr('y', y.bandwidth() / 2)
    .attr('dy', '0.35em')
    .text(d => isFinite(d.share) ? d3.format('.0%')(d.share) + ' AI' : '');
}

render();
window.addEventListener('resize', render);
</script>
</body>
</html>
