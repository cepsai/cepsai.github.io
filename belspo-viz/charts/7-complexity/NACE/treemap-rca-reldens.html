(function hydrateFromUrl() {
  var q = new URLSearchParams(window.location.search);
  function want(name) { return (q.get(name) || "").trim(); }

  var v = want("view").toLowerCase();
  if (v === "domains" || v === "countries") view = v;

  var m = want("metric").toLowerCase();
  if (m === "rca" || m === "reldens") metric = m;

  // cube and source are the two independent halves of the cube key, so either
  // can be set on its own.
  var current = CUBE_BY_KEY[cubeKey] || CUBES[0];
  var wantCube = want("cube").toLowerCase();
  var wantSource = want("source").toLowerCase();
  var cubeName = CUBE_NAMES.indexOf(wantCube) >= 0 ? wantCube : current.cube;
  var srcName = SOURCE_NAMES.indexOf(wantSource) >= 0 ? wantSource : current.source;
  if (CUBE_BY_KEY[cubeName + "|" + srcName]) cubeKey = cubeName + "|" + srcName;

  var c = want("country").toUpperCase();
  if (COUNTRY_BY_CODE[c]) country = c;

  var pk = want("preset").toLowerCase();
  for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].key === pk) presetKey = pk;

  // The domain travels as its NACE division code, never as an index: the cubes
  // hold 72–79 divisions each, so the same index is a different sector in each.
  var dom = want("domain");
  if (dom) {
    var doms = (CUBE_BY_KEY[cubeKey] || CUBES[0]).domains;
    for (var j = 0; j < doms.length; j++) {
      if (String(doms[j].code) === dom) { domainIdx = j; break; }
    }
  }

  // ?sectors=J,MN,BE — A*10 group keys, comma-separated.
  var sectors = want("sectors");
  if (sectors) {
    var wanted = sectors.split(",").map(function (s) { return s.trim().toUpperCase(); });
    var picked = new Set();
    GROUPS.forEach(function (g) {
      if (wanted.indexOf(String(g.key).toUpperCase()) >= 0) picked.add(g.name);
    });
    if (picked.size) activeGroups = picked;
  }
})();

function cube()   { return CUBE_BY_KEY[cubeKey] || CUBES[0]; }
function preset() {
  for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].key === presetKey) return PRESETS[i];
  return PRESETS[0];
}

// ── Colour scales ────────────────────────────────────────────────────────
// RCA: symmetric in log2 space around the parity point rca = 1, clamped at
// [1/CAP, CAP]. Red = under-represented, green = over-represented.
var LOG_CAP = Math.log(RCA_CAP) / Math.LN2;
var RCA_SCALE = d3.scaleLinear()
  .domain([-1, -0.5, 0, 0.5, 1])
  .range(["#a50026", "#f46d43", "#fee08b", "#66bd63", "#006837"])
  .clamp(true);
// Relatedness density: sequential, absolute 0–100 (never auto-fitted to the
// visible rows — the scale has to mean the same thing across every country,
// domain and cube). Viridis because these values cluster in a narrow band and
// a pale-to-mid ramp collapses that band into one apparent colour.
var RELDENS_SCALE = (typeof d3.interpolateViridis === "function")
  ? function (t) { return d3.interpolateViridis(Math.max(0, Math.min(1, t))); }
  : d3.scaleLinear().domain([0, 0.5, 1])
      .range(["#f7fbff", "#4292c6", "#08306b"]).clamp(true);
var NO_RCA_COLOR = "#d4d4d8";

function rcaColor(d) {
  var r = +d.rca;
  if (!(r > 0)) {
    // rca is stored rounded to 3dp, so a very small but non-zero advantage can
    // land on 0.000 while count > 0. Such a tile is far under-represented, not
    // absent — recover it from the unrounded ratio instead of greying it out.
    if (d.share > 0 && d.share_d > 0) r = d.share / d.share_d;
    else return NO_RCA_COLOR;
  }
  return RCA_SCALE((Math.log(r) / Math.LN2) / LOG_CAP);
}
function metricColor(d) {
  if (metric === "rca") return rcaColor(d);
  return RELDENS_SCALE((+d.reldens || 0) / 100);
}
function textOn(bg) {
  var c = d3.rgb(bg);
  var lum = (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) / 255;
  return lum > 0.62 ? "#0f172a" : "#ffffff";
}

// ── Formatting ───────────────────────────────────────────────────────────
function fmtCount(v) {
  if (!isFinite(v)) return "n/a";
  if (Math.abs(v) >= 1e6) return d3.format(".2f")(v / 1e6) + "M";
  if (Math.abs(v) >= 1e4) return d3.format(",")(Math.round(v));
  if (Math.abs(v) >= 100) return d3.format(",.0f")(v);
  return d3.format(",.2f")(v).replace(/\.00$/, "");
}
function fmtPct(frac) {
  var v = +frac;
  if (!isFinite(v)) return "n/a";
  if (v === 0) return "0%";
  if (v < 0.01) return d3.format(".3f")(v) + "%";
  return d3.format(".2f")(v) + "%";
}
function fmtRca(v) {
  if (!(v > 0)) return "0 (no activity)";
  return d3.format(v < 10 ? ".2f" : ".1f")(v);
}

// ── Row assembly ─────────────────────────────────────────────────────────
// Packed row layout: [domainIndex, count, rca, share, reldens]
function rowsFor(iso) { return (cube().rows || {})[iso] || []; }
function rowAt(iso, di) {
  var rows = rowsFor(iso);
  var probe = rows[di];
  if (probe && probe[0] === di) return probe;          // full grid, common case
  for (var i = 0; i < rows.length; i++) if (rows[i][0] === di) return rows[i];
  return null;
}


function itemsForDomainsView() {
  var c = cube();
  var out = [];
  var rows = rowsFor(country);
  rows.forEach(function (r) {
    var dom = c.domains[r[0]];
    if (!dom) return;
    if (!activeGroups.has(dom.parent)) return;
    // a zero count has zero area, so the tile cannot be drawn at all
    if (!(r[1] > 0)) return;
    out.push({
      name: dom.name, parent: dom.parent, iso: country,
      value: r[1], rca: r[2], share: r[3], reldens: r[4],
      share_d: dom.share_d
    });
  });
  out.sort(function (a, b) { return b.value - a.value; });
  return out;
}

function itemsForCountriesView() {
  var c = cube();
  var dom = c.domains[domainIdx];
  var out = [];
  var codes = preset().codes || [];
  if (!dom) return out;
  codes.forEach(function (iso) {
    var meta = COUNTRY_BY_CODE[iso];
    if (!meta) return;
    var r = rowAt(iso, domainIdx);
    if (!r) return;
    if (!(r[1] > 0)) return;
    out.push({
      name: meta.name, parent: meta.region, iso: iso,
      value: r[1], rca: r[2], share: r[3], reldens: r[4],
      share_d: dom.share_d
    });
  });
  out.sort(function (a, b) { return b.value - a.value; });
  return out;
}

function getDataForRender() {
  return view === "domains" ? itemsForDomainsView() : itemsForCountriesView();
}

// ── Legend ───────────────────────────────────────────────────────────────
function legendGradient(scale, stops) {
  var parts = [];
  for (var i = 0; i <= stops; i++) {
    var t = i / stops;
    parts.push(scale(t) + " " + (t * 100).toFixed(1) + "%");
  }
  return "linear-gradient(to right, " + parts.join(", ") + ")";
}
function updateLegend() {
  var title = document.getElementById("legend-title");
  var bar   = document.getElementById("legend-bar");
  var ticks = document.getElementById("legend-ticks");
  if (metric === "rca") {
    title.textContent = "RCA (share ÷ world share)";
    // t in [0,1] over the display bar maps to [-1,1] in the scale's domain.
    bar.style.background = legendGradient(function (t) { return RCA_SCALE(t * 2 - 1); }, 40);
    var lo = 1 / RCA_CAP;
    ticks.innerHTML =
      "<span>≤" + d3.format(lo < 1 ? ".2f" : ".0f")(lo) + "</span>" +
      "<span>" + d3.format(".1f")(Math.sqrt(lo)) + "</span>" +
      "<span>1</span>" +
      "<span>" + d3.format(".1f")(Math.sqrt(RCA_CAP)) + "</span>" +
      "<span>≥" + d3.format(".0f")(RCA_CAP) + "</span>";
  } else {
    title.textContent = "Relatedness density";
    bar.style.background = legendGradient(RELDENS_SCALE, 40);
    ticks.innerHTML = "<span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>";
  }
}


// ── Dropdown plumbing ────────────────────────────────────────────────────
var openDropdown = null;
function closeDropdown() {
  if (openDropdown) {
    openDropdown.el.classList.remove("open");
    openDropdown.btn.setAttribute("aria-expanded", "false");
    openDropdown = null;
  }
}
function wireDropdown(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var btn = el.querySelector(".dropdown-button");
  btn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    var wasOpen = el.classList.contains("open");
    closeDropdown();
    if (!wasOpen) {
      el.classList.add("open");
      btn.setAttribute("aria-expanded", "true");
      openDropdown = { el: el, btn: btn };
    }
  });
  el.querySelector(".dropdown-panel").addEventListener("click", function (ev) {
    ev.stopPropagation();
  });
}
document.addEventListener("click", closeDropdown);
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") closeDropdown();
});

function fillDropdown(panelId, valueId, options, isActive, onPick) {
  var panel = document.getElementById(panelId);
  panel.innerHTML = "";
  options.forEach(function (opt) {
    var row = document.createElement("div");
    row.className = "dropdown-option" + (isActive(opt) ? " active" : "");
    row.setAttribute("role", "option");
    if (opt.color) {
      var sq = document.createElement("span");
      sq.className = "opt-square";
      sq.style.background = opt.color;
      row.appendChild(sq);
    }
    var txt = document.createElement("span");
    txt.textContent = opt.label;
    row.appendChild(txt);
    row.addEventListener("click", function () {
      closeDropdown();
      onPick(opt);
    });
    panel.appendChild(row);
  });
  var active = null;
  options.forEach(function (o) { if (isActive(o)) active = o; });
  document.getElementById(valueId).textContent =
    active ? (active.short || active.label) : "—";
}

function shorten(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

function buildCubeDropdown() {
  fillDropdown("cube-panel", "cube-value",
    CUBE_NAMES.map(function (n) { return { key: n, label: cubeLabel(n), short: n }; }),
    function (o) { return o.key === cube().cube; },
    function (o) { switchCube(o.key, cube().source); });
}
function buildSourceDropdown() {
  fillDropdown("source-panel", "source-value",
    SOURCE_NAMES.map(function (n) {
      return { key: n, label: sourceLabel(n), short: shorten(sourceLabel(n), 22) };
    }),
    function (o) { return o.key === cube().source; },
    function (o) { switchCube(cube().cube, o.key); });
}
function buildCountryDropdown() {
  fillDropdown("country-panel", "country-value",
    COUNTRIES.map(function (c) {
      return { key: c.code, label: c.name + " (" + c.code + ")", short: c.name,
               color: getGroupColor(c.region) };
    }),
    function (o) { return o.key === country; },
    function (o) { country = o.key; buildCountryDropdown(); refresh(); });
}
function buildDomainDropdown() {
  var doms = cube().domains || [];
  fillDropdown("domain-panel", "domain-value",
    doms.map(function (d, i) {
      return { key: i, label: d.name, short: shorten(d.name, 26),
               color: getGroupColor(d.parent) };
    }),
    function (o) { return o.key === domainIdx; },
    function (o) { domainIdx = o.key; buildDomainDropdown(); refresh(); });
}
function buildPresetDropdown() {
  fillDropdown("preset-panel", "preset-value",
    PRESETS.map(function (p) {
      return { key: p.key, label: p.label + " (" + p.codes.length + ")",
               short: shorten(p.label, 22) };
    }),
    function (o) { return o.key === presetKey; },
    function (o) { presetKey = o.key; buildPresetDropdown(); refresh(); });
}

// Sector filter is multi-select, so it does not use fillDropdown.
function buildSectorDropdown() {
  var panel = document.getElementById("sector-panel");
  panel.innerHTML = "";
  GROUPS.forEach(function (g) {
    var row = document.createElement("div");
    row.className = "dropdown-option" + (activeGroups.has(g.name) ? " checked" : "");
    row.setAttribute("role", "option");
    var chk = document.createElement("span");
    chk.className = "opt-check";
    var sq = document.createElement("span");
    sq.className = "opt-square";
    sq.style.background = g.color;
    var txt = document.createElement("span");
    txt.textContent = g.name;
    row.appendChild(chk); row.appendChild(sq); row.appendChild(txt);
    row.addEventListener("click", function () {
      if (activeGroups.has(g.name)) activeGroups.delete(g.name);
      else activeGroups.add(g.name);
      if (activeGroups.size === 0) activeGroups.add(g.name);   // never empty
      buildSectorDropdown();
      refresh();
    });
    panel.appendChild(row);
  });
  var actions = document.createElement("div");
  actions.className = "dropdown-actions";
  var allBtn = document.createElement("button");
  allBtn.className = "dropdown-action"; allBtn.type = "button";
  allBtn.textContent = "All";
  allBtn.addEventListener("click", function () {
    activeGroups = new Set(GROUPS.map(function (g) { return g.name; }));
    buildSectorDropdown(); refresh();
  });
  actions.appendChild(allBtn);
  panel.appendChild(actions);
  updateSectorButtonLabel();
}
function updateSectorButtonLabel() {
  var n = activeGroups.size, total = GROUPS.length;
  var val;
  if (n === total) val = "All " + total;
  else if (n === 1) val = shorten(Array.from(activeGroups)[0] || "", 24);
  else val = n + " of " + total;
  document.getElementById("sector-value").textContent = val;
}

function switchCube(cubeName, sourceName) {
  var key = cubeName + "|" + sourceName;
  if (!CUBE_BY_KEY[key]) return;
  var prevCode = (cube().domains[domainIdx] || {}).code;
  cubeKey = key;
  // Domain lists differ per cube (72–79 divisions) — follow the NACE code,
  // not the index, or the selection silently jumps to another sector.
  var doms = cube().domains;
  domainIdx = 0;
  for (var i = 0; i < doms.length; i++) if (doms[i].code === prevCode) { domainIdx = i; break; }
  buildCubeDropdown(); buildSourceDropdown(); buildDomainDropdown();
  refresh();
}

// ── Toggles ──────────────────────────────────────────────────────────────
function wireSegmented(id, attr, apply) {
  var box = document.getElementById(id);
  if (!box) return;
  box.querySelectorAll(".seg-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      apply(btn.getAttribute(attr));
      syncSegmented(id, attr);
      refresh();
    });
  });
}
function syncSegmented(id, attr) {
  var current = attr === "data-view" ? view : metric;
  document.getElementById(id).querySelectorAll(".seg-btn").forEach(function (btn) {
    btn.setAttribute("aria-pressed", btn.getAttribute(attr) === current ? "true" : "false");
  });
}

function updateControlVisibility() {
  var inDomains = view === "domains";
  document.getElementById("domain-dropdown").classList.toggle("hidden", inDomains);
  document.getElementById("preset-dropdown").classList.toggle("hidden", inDomains);
  document.getElementById("sector-dropdown").classList.toggle("hidden", !inDomains);
  // The country dropdown stays in both views: it picks the subject in the
  // domains view and the highlighted country in the countries view.
}

// ── Treemap ──────────────────────────────────────────────────────────────
var vizContainer = document.getElementById("viz");
var treemapData = [];
var treemapInstance = null;

function tooltipBody(d) {
  var c = cube();
  var lines = [];
  lines.push("<strong>Group:</strong> " + (d.parent || ""));
  lines.push("<strong>" + c.metric + ":</strong> " + fmtCount(d.value || 0));
  lines.push("<strong>RCA:</strong> " + fmtRca(d.rca));
  lines.push("<strong>Share of country:</strong> " + fmtPct(d.share));
  lines.push("<strong>World share of domain:</strong> " + fmtPct(d.share_d));
  lines.push("<strong>Relatedness density:</strong> " + d3.format(".1f")(+d.reldens || 0));
  return lines.join("<br>");
}

function ensureTreemapInstance(width, height) {
  if (!vizContainer) return null;
  if (!treemapInstance) {
    treemapInstance = new d3plus.Treemap()
      .select("#viz")
      .data(treemapData)
      .groupBy(["parent", "name"])
      .tooltip(true)
      .tooltipConfig({ title: function (d) { return d.name; }, body: tooltipBody })
      .sum("value")
      .layoutPadding(2)
      .legend(false)
      // Transitions off. Every control swaps the whole dataset, so tweening
      // between unrelated tile sets buys nothing — and a second render landing
      // mid-transition makes d3-transition throw "too late; already running"
      // (reproducible in the older charts in this repo under a resize storm).
      .duration(0)
      .color(function (d) {
        // Group nodes (depth 0) carry no metric; keep them out of the scale.
        return (typeof d.rca === "number") ? metricColor(d) : "#f1f5f9";
      })
      .shapeConfig({
        rx: 0, ry: 0,
        labelConfig: {
          fontColor: function (d) {
            return (typeof d.rca === "number") ? textOn(metricColor(d)) : "#334155";
          }
        },
        stroke: function (d) {
          if (d.depth === 0) return getGroupColor(d.id);
          if (view === "countries" && d.iso === country) return "#0f172a";
          return "rgba(255,255,255,0.75)";
        },
        strokeWidth: function (d) {
          if (d.depth === 0) return 3;
          if (view === "countries" && d.iso === country) return 3.5;
          return 0.5;
        }
      })
      .config({
        // d3plus draws its own second line — the tile's share of the total,
        // which is exactly the `share` column — so only the colour-encoded
        // metric needs adding here. An array return would be comma-joined into
        // one line rather than split across two, hence the plain string.
        label: function (d) {
          if (typeof d.rca !== "number") return d.name;
          return d.name + "  ·  " + (metric === "rca"
            ? "rca " + fmtRca(d.rca)
            : "reldens " + d3.format(".0f")(+d.reldens || 0));
        }
      });
  }
  if (typeof treemapInstance.width === "function" && width) treemapInstance.width(width);
  if (typeof treemapInstance.height === "function" && height) treemapInstance.height(height);
  return treemapInstance;
}

function updateVisualization(width, height) {
  treemapData = getDataForRender();
  var inst = ensureTreemapInstance(width, height);
  if (!inst) return;
  inst.data(treemapData).render();
}
function renderVisualizationForContainer() {
  if (!vizContainer) return;
  var rect = vizContainer.getBoundingClientRect();
  updateVisualization(rect.width, rect.height);
}

// One render per animation frame. FIT_JS dispatches a resize, the ResizeObserver
// fires, and a control click can all land in the same frame.
var renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function () {
    renderQueued = false;
    renderVisualizationForContainer();
  });
}

function refresh() {
  updateControlVisibility();
  updateLegend();
  scheduleRender();
}

// ── Bootstrap ────────────────────────────────────────────────────────────
["cube-dropdown", "source-dropdown", "country-dropdown",
 "domain-dropdown", "preset-dropdown", "sector-dropdown"].forEach(wireDropdown);

buildCubeDropdown();
buildSourceDropdown();
buildCountryDropdown();
buildDomainDropdown();
buildPresetDropdown();
buildSectorDropdown();

wireSegmented("view-toggle", "data-view", function (v) { view = v; });
wireSegmented("metric-toggle", "data-metric", function (m) { metric = m; });
syncSegmented("view-toggle", "data-view");
syncSegmented("metric-toggle", "data-metric");

var resizeTimer;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(scheduleRender, 120);
});
if (typeof ResizeObserver !== "undefined" && vizContainer) {
  new ResizeObserver(scheduleRender).observe(vizContainer);
}
refresh();
</script>

<script>
/* ══ pin the chart element to the grid cell's real pixels ═══════════════════════
   Safari/WebKit sizes `#viz { height: 100% }` from the *grid container* until the
   flexible row is resolved, which happens after the first render. The chart draws
   itself taller than its cell and `overflow: hidden` cuts the bottom row of tiles
   off. Measuring the cell and writing those pixels back breaks the circular
   sizing; the dispatched `resize` makes the chart redraw at the corrected size.
   Same fix as v2/build_v2.py FIT_JS — verify in WebKit, not only Chromium. ══════ */
(function () {
  var cell = document.getElementById("container1");
  var viz = document.getElementById("viz");
  if (!cell || !viz) return;
  var lastW = 0, lastH = 0, redraws = 0;
  function pin() {
    var w = Math.round(cell.clientWidth), h = Math.round(cell.clientHeight);
    if (!w || !h) return;
    if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
    lastW = w; lastH = h;
    viz.style.width = w + "px";
    viz.style.height = h + "px";
    if (redraws++ < 40) window.dispatchEvent(new Event("resize"));
  }
  pin();
  requestAnimationFrame(pin);
  window.addEventListener("load", function () { requestAnimationFrame(pin); });
  window.addEventListener("resize", pin);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(pin).observe(cell);
})();
</script>
</body>
</html>
