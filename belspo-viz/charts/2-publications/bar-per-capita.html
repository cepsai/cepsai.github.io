<script>

   so hidden controls never flash. `?controls=1` keeps them. */

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const SHOW_CONTAINER_2 = 1;  // legend
const SHOW_CONTAINER_3 = 0;  // source (off per project pref)
const SHOW_CONTAINER_4 = 0;  // logo (off per project pref)
const SHOW_CONTAINER_5 = 0;  // footnote

const SHOW_TOOLTIP = 1;

const COLOR_BE   = "#2756d3";
const COLOR_EU   = "#f59e0b";
const COLOR_PEER = "#94a3b8";

// ─── Grid visibility ─────────────────────────────────────────────────────────
(function applyContainerVisibility() {
  const vizGrid = document.querySelector('.viz-grid');
  const c2 = document.getElementById('container2');
  const c3 = document.getElementById('container3');
  const c4 = document.getElementById('container4');
  const c5 = document.getElementById('container5');

  if (!SHOW_CONTAINER_2 && c2) c2.style.display = 'none';
  if (!SHOW_CONTAINER_3 && c3) c3.style.display = 'none';
  if (!SHOW_CONTAINER_4 && c4) c4.style.display = 'none';
  if (c5 && !SHOW_CONTAINER_5) c5.style.display = 'none';

  const row2Visible = SHOW_CONTAINER_5;
  const row3Visible = SHOW_CONTAINER_2;
  const row4Visible = SHOW_CONTAINER_3 || SHOW_CONTAINER_4;

  let gridRows = [];
  let currentRow = 1;
  const chartHeight = 20 - (row2Visible ? 1 : 0) - (row3Visible ? 1 : 0) - (row4Visible ? 1 : 0);
  gridRows.push(`${chartHeight}fr`);

  if (row2Visible) { gridRows.push('1fr'); currentRow++; if (c5) c5.style.gridRow = String(currentRow); }
  if (row3Visible) { gridRows.push('1fr'); currentRow++; if (c2) c2.style.gridRow = String(currentRow); }
  if (row4Visible) {
    gridRows.push('1fr'); currentRow++;
    if (SHOW_CONTAINER_3 && c3) c3.style.gridRow = String(currentRow);
    if (SHOW_CONTAINER_4 && c4) c4.style.gridRow = String(currentRow);
    if (row4Visible && SHOW_CONTAINER_3 && !SHOW_CONTAINER_4 && c3) c3.style.gridColumn = '1 / span 2';
    if (row4Visible && !SHOW_CONTAINER_3 && SHOW_CONTAINER_4 && c4) c4.style.gridColumn = '1 / span 2';
  }

  vizGrid.style.gridTemplateRows = gridRows.join(' ');
  document.getElementById('container1').style.gridRow = '1';
})();

// ─── Data ────────────────────────────────────────────────────────────────────
const RAW = JSON.parse(document.getElementById('chart-data').textContent);


    /* ══ v2: year selection from the URL ════════════════════════════════════
       ?years=2023 | ?years=2021-2025 | ?years=2021,2023 | absent = all years  */
    function v2ParseYears(all) {
      all = (all || []).map(Number);
      var q = new URLSearchParams(window.location.search);
      var raw = (q.get("years") || q.get("year") || "").trim();
      var want = [];
      if (raw) {
        raw.split(",").forEach(function (part) {
          part = part.trim();
          var m = part.match(/^(\d{4})\s*(?:-|\u2013|\u2014|\.\.)\s*(\d{4})$/);
          if (m) {
            var a = +m[1], b = +m[2];
            if (a > b) { var t = a; a = b; b = t; }
            for (var y = a; y <= b; y++) want.push(y);
          } else if (/^\d{4}$/.test(part)) {
            want.push(+part);
          }
        });
      }
      var wanted = new Set(want);
      var sel = all.filter(function (y) { return wanted.has(y); });
      if (!sel.length) sel = all.slice();          /* unparseable / no overlap */
      var state = {
        controls: q.get("controls") === "1",
        has: function (y) { return this.years.indexOf(+y) >= 0; },
        /* the in-chart controls, when shown, drive the selection again */
        setYears: function (list) {
          this.years = list.slice();
          this.idx = this.years.map(function (y) { return all.indexOf(y); });
          this.single = this.years.length === 1;
          this.n = this.years.length;
          this.all = this.years.length === all.length;
          this.label = v2Label(this.years);
        }
      };
      state.setYears(sel);
      return state;
    }
    function v2Label(sel) {
      if (!sel.length) return "";
      if (sel.length === 1) return String(sel[0]);
      var contiguous = sel.length === (sel[sel.length - 1] - sel[0] + 1);
      return contiguous ? sel[0] + "\u2013" + sel[sel.length - 1] : sel.join(", ");
    }
    function v2CompactNum(v) {
      var a = Math.abs(v);
      function trim(x) { return String(+x.toFixed(1)).replace(/\.0$/, ""); }
      if (a >= 1e9) return trim(v / 1e9) + "B";
      if (a >= 1e6) return trim(v / 1e6) + "M";
      if (a >= 1e3) return trim(v / 1e3) + "k";
      return trim(v);
    }
    function v2ScaleBreaks(breaks, n) {
      return breaks.map(function (b) { return b * n; });
    }
    function v2BreakLabels(breaks, prefix) {
      var p = prefix || "";
      function n(v) { return p + v2CompactNum(v); }
      var out = ["< " + n(breaks[0])];
      for (var i = 1; i < breaks.length; i++) {
        out.push(n(breaks[i - 1]) + "\u2013" + n(breaks[i]));
      }
      out.push("\u2265 " + n(breaks[breaks.length - 1]));
      return out;
    }
    /* keep a currency marker if the chart's own labels carried one */
    function v2LabelPrefix(labels) {
      return (labels || []).join("").indexOf("$") >= 0 ? "$" : "";
    }
    /* ══════════════════════════════════════════════════════════════════════ */

    const YEARS = RAW.years;
    const V2 = v2ParseYears(YEARS);
    function v2Sum(by) {
      let s = 0;
      for (const i of V2.idx) s += (by[i] || 0);
      return s;
    }

    const DATA = RAW.countries
  .map(c => ({
    geo:   c.geo,
    name:  c.name,
    value: v2Sum(c.by_year) / c.pop_m,
    count: v2Sum(c.by_year),
    pop:   c.pop_m
  }))
  .sort((a, b) => b.value - a.value);

function colorFor(geo) {
  if (geo === "BE") return COLOR_BE;
  if (geo === "EU") return COLOR_EU;
  return COLOR_PEER;
}

function smartFormat(v) {
  if (!isFinite(v)) return "N/A";
  if (Math.abs(v) >= 1e3) return d3.format(",")(Math.round(v));
  if (Math.abs(v) >= 10)  return d3.format(",.1f")(v);
  return d3.format(",.2f")(v);
}

// ─── Tooltip ─────────────────────────────────────────────────────────────────
let tooltipEl = null;
function ensureTooltip() {
  if (SHOW_TOOLTIP && !tooltipEl) {
    tooltipEl = document.createElement("div");
    tooltipEl.id = "tooltip";
    document.body.appendChild(tooltipEl);
  }
}

// ─── Render ──────────────────────────────────────────────────────────────────
const vizContainer = document.getElementById("viz");

function render() {
  ensureTooltip();

  const rect   = vizContainer.getBoundingClientRect();
  const width  = Math.max(320, rect.width);
  const height = Math.max(220, rect.height);
  const compact = window.matchMedia("(max-height:500px)").matches;

  const yMax = (function () {
    const top = d3.max(DATA, d => d.value) * 1.15;
    if (!(top > 0)) return 1;
    const step = Math.pow(10, Math.floor(Math.log10(top))) / 2;
    return Math.ceil(top / step) * step;
  })();

  const yTickFormat = d3.format(",");
  const yMaxStr = yTickFormat(yMax);
  const yLabelWidth = Math.max(yMaxStr.length * 7.5, 28) + 16;

  const xLabels = DATA.map(d => d.name);
  const rotateX = xLabels.length > 7
    || (xLabels.length > 4 && xLabels.some(l => String(l).length > 5));
  const bottomMargin = rotateX
    /* v2: cap at 35% (was 22%) so a long rotated label is never clipped */
    ? Math.min(height * 0.35, Math.max(56, d3.max(xLabels, l => String(l).length) * 6 + 24))
    : Math.max(28, height * 0.07);

  const margin = { top: 16, right: Math.max(24, width * 0.04), bottom: bottomMargin, left: yLabelWidth + (rotateX ? 56 : 32) };
  const innerWidth  = Math.max(40, width  - margin.left - margin.right);
  const innerHeight = Math.max(40, height - margin.top  - margin.bottom);

  const svg = d3.select("#chart")
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", `0 0 ${width} ${height}`)
    .style("width", "100%")
    .style("height", "100%");

  svg.selectAll("*").remove();

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand()
    .domain(xLabels)
    .range([0, innerWidth])
    .paddingInner(compact ? 0.22 : 0.32)
    .paddingOuter(compact ? 0.10 : 0.14);

  const y = d3.scaleLinear()
    .domain([0, yMax])
    .range([innerHeight, 0]);

  const axisFont = Math.max(9, Math.min(13, innerWidth / Math.max(5, xLabels.length) * 0.5));

  // Grid lines
  g.append("g")
    .attr("class", "grid-lines")
    .call(d3.axisLeft(y).ticks(compact ? 4 : 5).tickSize(-innerWidth).tickFormat(""))
    .select(".domain").remove();

  // X axis
  const xAxisG = g.append("g")
    .attr("class", "axis x-axis")
    .attr("transform", `translate(0,${innerHeight})`)
    .call(d3.axisBottom(x).tickSizeOuter(0));

  xAxisG.selectAll("text")
    .style("font-size", `${axisFont}px`)
    .style("font-family", "system-ui, -apple-system, Segoe UI, Roboto, sans-serif");

  if (rotateX) {
    xAxisG.selectAll("text")
      .attr("transform", "rotate(-35)")
      .attr("text-anchor", "end")
      .attr("dx", "-0.4em")
      .attr("dy", "0.8em");
  }

  // Y axis
  const yAxisG = g.append("g")
    .attr("class", "axis y-axis")
    .call(d3.axisLeft(y).ticks(compact ? 4 : 5).tickFormat(yTickFormat));

  yAxisG.selectAll("text")
    .style("font-size", `${axisFont}px`)
    .style("font-family", "system-ui, -apple-system, Segoe UI, Roboto, sans-serif");

  yAxisG.append("text")
    .attr("transform", "rotate(-90)")
    .attr("y", -margin.left + 16)
    .attr("x", -(innerHeight / 2))
    .attr("dy", "0.71em")
    .attr("text-anchor", "middle")
    .style("fill", "#000")
    .style("font-weight", "700")
    .style("font-size", "clamp(12px, 1.5vw, 18px)")
    .style("font-family", "system-ui, -apple-system, Segoe UI, Roboto, sans-serif")
    .text("AI publications per million inhabitants · " + V2.label);

  // Bars
  const bars = g.append("g")
    .attr("class", "bars")
    .selectAll("rect")
    .data(DATA)
    .enter()
    .append("rect")
      .attr("x", d => x(d.name))
      .attr("width", x.bandwidth())
      .attr("fill", d => colorFor(d.geo))
      .attr("y", y(0))
      .attr("height", 0);

  bars.transition()
    .duration(850)
    .ease(d3.easeCubicOut)
    .attr("y", d => y(d.value))
    .attr("height", d => y(0) - y(d.value));

  // Bar labels
  const barLabelFont   = Math.max(8, Math.min(13, x.bandwidth() * 0.32));
  const barLabelOffset = Math.max(5, Math.min(10, barLabelFont * 0.7));

  g.append("g")
    .attr("class", "bar-labels")
    .selectAll("text")
    .data(DATA)
    .enter()
    .append("text")
      .attr("class", "bar-label")
      .attr("x", d => x(d.name) + x.bandwidth() / 2)
      .attr("y", d => y(d.value) - barLabelOffset)
      .attr("text-anchor", "middle")
      .style("font-size", `${barLabelFont}px`)
      .style("font-family", "system-ui, -apple-system, Segoe UI, Roboto, sans-serif")
      .style("opacity", 0)
      .text(d => smartFormat(d.value))
    .transition()
      .duration(850)
      .delay(100)
      .style("opacity", 1);

  // Tooltip + hover
  if (SHOW_TOOLTIP) {
    bars
      .on("mousemove", function (event, d) {
        d3.select(this).attr("opacity", 0.85);
        const html =
          `<strong>${d.name}</strong>` +
          `<br/><span style="color:${colorFor(d.geo)};font-weight:600">` +
            `${smartFormat(d.value)} per million</span>` +
          `<br/><span style="opacity:.75">${d3.format(",")(d.count)} publications · ${d3.format(",.1f")(d.pop)} M people</span>`;
        tooltipEl.innerHTML = html;
        tooltipEl.style.left = (event.clientX + 14) + "px";
        tooltipEl.style.top  = (event.clientY - 24) + "px";
        tooltipEl.style.opacity = "1";
      })
      .on("mouseleave", function () {
        d3.select(this).attr("opacity", 1);
        tooltipEl.style.opacity = "0";
      });
  }
}

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 220);
});
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => render()).observe(vizContainer);
}

render();
</script>

<script>
/* ══ v2: pin the chart element to the grid cell's real pixels ═══════════════════
   Safari/WebKit sizes `#viz { height: 100% }` from the *grid container* until the
   `Nfr` row is resolved, which happens after the first render. The chart therefore
   draws itself taller than its cell and `overflow: hidden` cuts the bottom off —
   the rotated x-axis labels in the bars, the last row of tiles in the treemaps.
   Measuring the cell and writing those pixels back breaks the circular sizing;
   the dispatched `resize` makes the chart redraw at the corrected size (every
   archetype here, Leaflet included, re-renders on window resize). ══════════════ */
(function () {
  var cell = document.getElementById("container1");
  var viz = document.getElementById("viz") || document.getElementById("map");
  if (!cell || !viz) return;
  var lastW = 0, lastH = 0, redraws = 0;
  function pin() {
    var w = Math.round(cell.clientWidth), h = Math.round(cell.clientHeight);
    if (!w || !h) return;
    if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
    lastW = w; lastH = h;
    viz.style.width = w + "px";
    viz.style.height = h + "px";
    /* a cell whose height feeds back from its content could ping-pong here; cap it */
    if (redraws++ < 40) window.dispatchEvent(new Event("resize"));
  }
  pin();
  requestAnimationFrame(pin);
  window.addEventListener("load", function () { requestAnimationFrame(pin); });
  window.addEventListener("resize", pin);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(pin).observe(cell);
})();
</script>
</body>
</html>
