    .viz-grid {

      border-radius: 4px !important; color: #475569 !important;
      border: 1px solid rgba(17, 24, 39, 0.12) !important;
    }
    .leaflet-interactive { transition: fill 0.4s ease, stroke 0.2s ease; }

    .header-card {
      position: absolute; top: 14px; left: 14px; z-index: 1000;
      background: #ffffff; border: 1px solid rgba(17,24,39,0.08);
      border-radius: 12px; padding: 12px 16px; max-width: 360px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .header-card h1 {
      margin: 0 0 4px; font-size: 16px; font-weight: 800; color: #0f172a; line-height: 1.25;
    }
    .header-card .sub { font-size: 12px; color: #64748b; line-height: 1.4; }
    .header-card .foot {
      font-size: 10.5px; color: #94a3b8; margin-top: 6px; line-height: 1.4;
      border-top: 1px solid #eef2f7; padding-top: 6px;

    .map-legend { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }

      font-size: 11px; font-weight: 700; color: #475569;

    .map-legend-swatch { width: 40px; height: 12px; border: 1px solid rgba(0,0,0,0.06); }
    .map-legend-tick { font-size: 10px; color: #64748b; font-weight: 600; font-variant-numeric: tabular-nums; }

    #tooltip {
      position: fixed; pointer-events: none; background: #fff;

    }

      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);

      padding: 12px 18px; background: #ffffff; border: 1px solid rgba(17,24,39,0.08);
      border-radius: 12px; z-index: 1000; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      max-width: calc(100% - 16px); width: auto;
    }
    .slider-label {
      font-size: 12px; font-weight: 700; color: #475569;
      text-transform: uppercase; letter-spacing: 0.04em;
    }

    .slider-track-bg {
      position: absolute; top: 50%; left: 0; right: 0; height: 6px;
      background: #e2e8f0; border-radius: 3px; transform: translateY(-50%); pointer-events: none;
    }
    .year-slider {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      background: transparent; border-radius: 3px; outline: none; cursor: pointer;
      position: relative; z-index: 2;
    }
    .year-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 22px; height: 22px;
      border-radius: 50%; background: #2756d3; border: 3px solid #fff; cursor: pointer;
      box-shadow: 0 2px 6px rgba(39,86,211,0.35); transition: box-shadow 0.2s;

      width: 22px; height: 22px; border-radius: 50%; background: #2756d3;
      border: 3px solid #fff; box-shadow: 0 2px 6px rgba(39,86,211,0.4); cursor: pointer;
    }
    .slider-year-label {
      font-size: 16px; font-weight: 800; color: #0f172a;
      font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right;
    }
    .slider-year-label .partial { font-size: 11px; font-weight: 600; color: #94a3b8; font-style: italic; }
    .play-button {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid rgba(17,24,39,0.12); background: #f8fafc; color: #2756d3;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      padding: 0; transition: background 0.2s ease, border-color 0.2s ease; flex-shrink: 0;
    }
    .play-button:hover { background: #eef2ff; border-color: rgba(39,86,211,0.35); }
    .play-button svg { width: 12px; height: 12px; fill: currentColor; }

    function v2BreakLabels(breaks, prefix) {
      var p = prefix || "";
      function n(v) { return p + v2CompactNum(v); }
      var out = ["< " + n(breaks[0])];
      for (var i = 1; i < breaks.length; i++) {
        out.push(n(breaks[i - 1]) + "\u2013" + n(breaks[i]));
      }
      out.push("\u2265 " + n(breaks[breaks.length - 1]));
      return out;
    }
    /* keep a currency marker if the chart's own labels carried one */
    function v2LabelPrefix(labels) {
      return (labels || []).join("").indexOf("$") >= 0 ? "$" : "";
    }
    /* ══════════════════════════════════════════════════════════════════════ */

    const V2 = v2ParseYears(YEARS);
    if (!V2.controls && !V2.single) {
      const v2p = v2LabelPrefix(BREAK_LABELS);
      BREAKS = v2ScaleBreaks(BREAKS, V2.n);
      BREAK_LABELS = v2BreakLabels(BREAKS, v2p);
    }

    if (V2.controls) {
      var v2Slider = document.getElementById("year-slider");
      if (v2Slider) {
        v2Slider.addEventListener("input", function () {
          var y = +v2Slider.value;
          var isAll = (typeof isAllYears === "function") && isAllYears(y);
          V2.setYears(isAll ? YEARS : [y]);
          /* the legend title carries the year window, and in some archetypes the
             legend is built once at load — rebuild it so it cannot go stale */
          if (typeof buildLegend === "function") buildLegend();
        }, true);
      }
    }

    const NO_DATA_FILL = "#e5e7eb";
    const BE_STROKE = "#2756d3";
    const DEFAULT_STROKE = "#b9c4d4";

    const tooltipEl = document.getElementById("tooltip");

    function valueFor(iso, year) {
      let v2s = 0, v2n = 0;
      for (const y of V2.years) {
        const yd = DATA[String(y)];
        if (!yd || !(iso in yd)) continue;
        const v = yd[iso];
        if (v != null && isFinite(v)) { v2s += v; v2n++; }
      }
      return v2n ? v2s : null;
    }
    function colorFor(value) {
      if (value == null || !isFinite(value)) return NO_DATA_FILL;
      for (let i = 0; i < BREAKS.length; i++) { if (value < BREAKS[i]) return COLORS[i]; }
      return COLORS[COLORS.length - 1];
    }
    function cleanName(iso) {
      const n = NAMES[iso];
      if (n) return n.replace(/\s*\([A-Z0-9]+\)\s*$/, "");
      const f = GEO.features.find(g => g.properties.iso === iso);
      return f ? f.properties.name : iso;
    }
    function formatCount(v) { return isFinite(v) ? d3.format(",")(v) : "N/A"; }

    function buildLegend() {
      const el = document.getElementById("map-legend");
      const cells = COLORS.map((c, i) => `
        <div class="map-legend-cell">
          <div class="map-legend-swatch" style="background:${c}"></div>
          <div class="map-legend-tick">${BREAK_LABELS[i]}</div>
        </div>`).join("");
      const noData = `
        <div class="map-legend-cell">
          <div class="map-legend-swatch" style="background:${NO_DATA_FILL}"></div>
          <div class="map-legend-tick">N/A</div>
        </div>`;
      el.innerHTML = `
        <div class="map-legend-title">AI patent filings (NACE-only) <span class="v2-years">${V2.label}</span></div>
        <div class="map-legend-row">${cells}${noData}</div>`;
    }
    buildLegend();

    function showTooltip(iso, year) {
      const value = valueFor(iso, year);
      const isBE = iso === "BE";
      const partial = V2.years.some(y => PARTIAL_YEARS.has(y)) ? ' <span style="color:#94a3b8;font-style:italic;">(partial)</span>' : '';
      const meta = value != null ? `AI patent filings · ${V2.label}${partial}` : `No data · ${V2.label}`;
      tooltipEl.innerHTML = `
        <div class="t-name">${cleanName(iso)}${isBE ? '<span class="be-flag">BELGIUM</span>' : ''}</div>
        <div class="t-count">${value != null ? formatCount(value) : "—"}</div>
        <div class="t-meta">${meta}</div>`;
      tooltipEl.style.opacity = "1";
    }
    function moveTooltip(evt) {
      const tw = tooltipEl.offsetWidth || 160, th = tooltipEl.offsetHeight || 60;
      let left = evt.clientX + 14, top = evt.clientY - 24;
      if (left + tw > window.innerWidth - 8) left = evt.clientX - tw - 14;
      if (top + th > window.innerHeight - 8) top = evt.clientY - th - 14;
      if (top < 8) top = 8;
      tooltipEl.style.left = left + "px";
      tooltipEl.style.top = top + "px";
    }
    function hideTooltip() { tooltipEl.style.opacity = "0"; }

    const FOCUS_BOUNDS = [[34.5, -11.0], [60.5, 32.0]];
    const map = L.map("map", {
      zoomControl: true, attributionControl: false,
      minZoom: 3, maxZoom: 8, worldCopyJump: false, zoomSnap: 0.25,
    });
    map.fitBounds(FOCUS_BOUNDS, { padding: [10, 10] });

    let currentYear = +document.getElementById("year-slider").value;
    let geoLayer = null;

    function styleFor(feature) {
      const iso = feature.properties.iso;
      const value = valueFor(iso, currentYear);
      const isBE = iso === "BE";
      return {
        weight: isBE ? 2.6 : 0.7,
        color: isBE ? BE_STROKE : DEFAULT_STROKE,
        fillColor: colorFor(value),
        fillOpacity: 0.92,
        opacity: 1,
      };
    }

    geoLayer = L.geoJson(GEO, {
      style: styleFor,
      onEachFeature: (feature, layer) => {
        const iso = feature.properties.iso;
        layer.on({
          mouseover: (e) => {
            e.target.setStyle({ weight: iso === "BE" ? 3.2 : 2, color: iso === "BE" ? BE_STROKE : "#0f172a" });
            e.target.bringToFront();
            // keep BE outline above on top after re-order
            beToFront();
            showTooltip(iso, currentYear);
            moveTooltip(e.originalEvent);
          },
          mousemove: (e) => moveTooltip(e.originalEvent),
          mouseout: (e) => { geoLayer.resetStyle(e.target); beToFront(); hideTooltip(); },
        });
      },
    }).addTo(map);

    function beToFront() {
      geoLayer.eachLayer(l => { if (l.feature && l.feature.properties.iso === "BE") l.bringToFront(); });
    }
    beToFront();

    function updateForYear(year) {
      currentYear = year;
      geoLayer.setStyle(styleFor);
      beToFront();
    }

    map.on("mouseout movestart zoomstart", hideTooltip);
    window.addEventListener("blur", hideTooltip);
    document.addEventListener("mouseleave", hideTooltip);

    // ─── Year slider + play ───
    const slider = document.getElementById("year-slider");
    const yearLabel = document.getElementById("year-label");
    const playButton = document.getElementById("play-button");
    const PLAY_INTERVAL_MS = 1300;
    const PLAY_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5 L10 6 L3 10.5 Z"/></svg>';
    const PAUSE_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.5" height="8"/><rect x="7" y="2" width="2.5" height="8"/></svg>';

    function renderYearLabel(y) {
      yearLabel.innerHTML = PARTIAL_YEARS.has(y) ? `${y} <span class="partial">(partial)</span>` : `${y}`;
    }
    renderYearLabel(currentYear);

    slider.addEventListener("input", () => {
      const y = +slider.value;
      renderYearLabel(y);
      updateForYear(y);
    });

    const MIN_YEAR = +slider.min, MAX_YEAR = +slider.max;
    let playing = false, playTimer = null;
    function setSliderYear(year) { slider.value = year; slider.dispatchEvent(new Event("input")); }
    function startPlay() {
      if (playing) return;
      playing = true;
      playButton.innerHTML = PAUSE_ICON;
      playButton.setAttribute("aria-label", "Pause animation");
      if (+slider.value >= MAX_YEAR) setSliderYear(MIN_YEAR);
      playTimer = setInterval(() => {
        const next = +slider.value + 1;
        if (next > MAX_YEAR) { stopPlay(); return; }
        setSliderYear(next);
      }, PLAY_INTERVAL_MS);
    }
    function stopPlay() {
      if (!playing) return;
      playing = false;
      playButton.innerHTML = PLAY_ICON;
      playButton.setAttribute("aria-label", "Play animation");
      clearInterval(playTimer); playTimer = null;
    }
    playButton.addEventListener("click", () => playing ? stopPlay() : startPlay());
    slider.addEventListener("mousedown", stopPlay);
    slider.addEventListener("touchstart", stopPlay, { passive: true });
    slider.addEventListener("keydown", stopPlay);

    window.addEventListener("resize", () => {
      setTimeout(() => { map.invalidateSize(); map.fitBounds(FOCUS_BOUNDS, { padding: [10, 10] }); }, 100);
    });
  </script>

<script>
/* ══ v2: pin the chart element to the grid cell's real pixels ═══════════════════
   Safari/WebKit sizes `#viz { height: 100% }` from the *grid container* until the
   `Nfr` row is resolved, which happens after the first render. The chart therefore
   draws itself taller than its cell and `overflow: hidden` cuts the bottom off —
   the rotated x-axis labels in the bars, the last row of tiles in the treemaps.
   Measuring the cell and writing those pixels back breaks the circular sizing;
   the dispatched `resize` makes the chart redraw at the corrected size (every
   archetype here, Leaflet included, re-renders on window resize). ══════════════ */
(function () {
  var cell = document.getElementById("container1");
  var viz = document.getElementById("viz") || document.getElementById("map");
  if (!cell || !viz) return;
  var lastW = 0, lastH = 0, redraws = 0;
  function pin() {
    var w = Math.round(cell.clientWidth), h = Math.round(cell.clientHeight);
    if (!w || !h) return;
    if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
    lastW = w; lastH = h;
    viz.style.width = w + "px";
    viz.style.height = h + "px";
    /* a cell whose height feeds back from its content could ping-pong here; cap it */
    if (redraws++ < 40) window.dispatchEvent(new Event("resize"));
  }
  pin();
  requestAnimationFrame(pin);
  window.addEventListener("load", function () { requestAnimationFrame(pin); });
  window.addEventListener("resize", pin);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(pin).observe(cell);
})();
</script>
</body>
</html>
