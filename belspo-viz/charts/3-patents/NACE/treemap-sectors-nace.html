      <div class="footnote-text" id="footnote-text"></div>
    </div>
    <div id="container6" class="container year-selector-container">
      <div class="selector-group" id="year-selector" role="tablist" aria-label="Year"></div>
    </div>
    <div id="container2" class="container legend-container">
      <div class="custom-legend" id="legend"></div>
    </div>
  </div>
<script>
var RAW = JSON.parse(document.getElementById("chart-data").textContent);
var VALUE_FORMAT = RAW.value_format || "count";
var VALUE_LABEL  = RAW.value_label || "Value";
var GROUPS = RAW.groups; // [{name, color}, ...]
var YEARS  = (RAW.years || []).slice();
    /* ══ v2: year selection from the URL ════════════════════════════════════
       ?years=2023 | ?years=2021-2025 | ?years=2021,2023 | absent = all years  */
    function v2ParseYears(all) {
      all = (all || []).map(Number);
      var q = new URLSearchParams(window.location.search);
      var raw = (q.get("years") || q.get("year") || "").trim();
      var want = [];
      if (raw) {
        raw.split(",").forEach(function (part) {
          part = part.trim();
          var m = part.match(/^(\d{4})\s*(?:-|\u2013|\u2014|\.\.)\s*(\d{4})$/);
          if (m) {
            var a = +m[1], b = +m[2];
            if (a > b) { var t = a; a = b; b = t; }
            for (var y = a; y <= b; y++) want.push(y);
          } else if (/^\d{4}$/.test(part)) {
            want.push(+part);
          }
        });
      }
      var wanted = new Set(want);
      var sel = all.filter(function (y) { return wanted.has(y); });
      if (!sel.length) sel = all.slice();          /* unparseable / no overlap */
      var state = {
        controls: q.get("controls") === "1",
        has: function (y) { return this.years.indexOf(+y) >= 0; },
        /* the in-chart controls, when shown, drive the selection again */
        setYears: function (list) {
          this.years = list.slice();
          this.idx = this.years.map(function (y) { return all.indexOf(y); });
          this.single = this.years.length === 1;
          this.n = this.years.length;
          this.all = this.years.length === all.length;
          this.label = v2Label(this.years);
        }
      };
      state.setYears(sel);
      return state;
    }
    function v2Label(sel) {
      if (!sel.length) return "";
      if (sel.length === 1) return String(sel[0]);
      var contiguous = sel.length === (sel[sel.length - 1] - sel[0] + 1);
      return contiguous ? sel[0] + "\u2013" + sel[sel.length - 1] : sel.join(", ");
    }
    function v2CompactNum(v) {
      var a = Math.abs(v);
      function trim(x) { return String(+x.toFixed(1)).replace(/\.0$/, ""); }
      if (a >= 1e9) return trim(v / 1e9) + "B";
      if (a >= 1e6) return trim(v / 1e6) + "M";
      if (a >= 1e3) return trim(v / 1e3) + "k";
      return trim(v);
    }
    function v2ScaleBreaks(breaks, n) {
      return breaks.map(function (b) { return b * n; });
    }
    function v2BreakLabels(breaks, prefix) {
      var p = prefix || "";
      function n(v) { return p + v2CompactNum(v); }
      var out = ["< " + n(breaks[0])];
      for (var i = 1; i < breaks.length; i++) {
        out.push(n(breaks[i - 1]) + "\u2013" + n(breaks[i]));
      }
      out.push("\u2265 " + n(breaks[breaks.length - 1]));
      return out;
    }
    /* keep a currency marker if the chart's own labels carried one */
    function v2LabelPrefix(labels) {
      return (labels || []).join("").indexOf("$") >= 0 ? "$" : "";
    }
    /* ══════════════════════════════════════════════════════════════════════ */
    var V2 = v2ParseYears(YEARS);

var TOP_N  = +RAW.top_n || 30;
var TREEMAP_BORDER_RADIUS = 0;
var SHOW_TOOLTIP = 1;

document.getElementById("footnote-text").textContent = RAW.subtitle || "";

var GROUP_COLOR = {};
GROUPS.forEach(function (g) { GROUP_COLOR[g.name] = g.color; });
function getGroupColor(name) { return GROUP_COLOR[name] || "#666"; }

function smartFormatCount(v) {
  if (!isFinite(v)) return "N/A";
  if (Math.abs(v) >= 1e9) return d3.format(".2f")(v / 1e9) + "B";
  if (Math.abs(v) >= 1e6) return d3.format(".1f")(v / 1e6) + "M";
  if (Math.abs(v) >= 1e3) return d3.format(",")(Math.round(v));
  return d3.format(",")(Math.round(v));
}
function formatValue(v) {
  if (VALUE_FORMAT === "percent") return d3.format(".1%")(v);
  if (VALUE_FORMAT === "rate")    return d3.format(",.2f")(v);
  return smartFormatCount(v);
}

var ALL_ITEMS = (RAW.items || []).map(function (d) {
  return {
    name:    d.name,
    parent:  d.parent,
    by_year: (d.by_year || []).map(function (v) { return +v || 0; })
  };
});

var activeGroups = new Set(GROUPS.map(function (g) { return g.name; }));
var activeYears  = new Set(V2.years);
var legendInitialized = false;
var yearSelectorInitialized = false;

function getDataForRender() {
  var yearIdxs = [];
  for (var i = 0; i < YEARS.length; i++) {
    if (activeYears.has(YEARS[i])) yearIdxs.push(i);
  }
  var items = ALL_ITEMS.map(function (it) {
    var val = 0;
    for (var k = 0; k < yearIdxs.length; k++) val += (it.by_year[yearIdxs[k]] || 0);
    return { name: it.name, parent: it.parent, value: val };
  }).filter(function (d) {
    return d.value > 0 && activeGroups.has(d.parent);
  });
  items.sort(function (a, b) { return b.value - a.value; });
  if (TOP_N > 0) items = items.slice(0, TOP_N);
  return items;
}

function buildLegend() {
  if (legendInitialized) return;
  var legend = document.getElementById("legend");
  if (!legend) return;
  legend.innerHTML = "";
  GROUPS.forEach(function (g) {
    var item = document.createElement("div");
    item.className = "legend-item active";
    item.setAttribute("data-group", g.name);
    item.setAttribute("role", "button");
    item.setAttribute("tabindex", "0");
    item.setAttribute("aria-pressed", "true");

    var sq = document.createElement("div");
    sq.className = "legend-square";
    sq.style.backgroundColor = g.color;
    sq.style.borderRadius = TREEMAP_BORDER_RADIUS + "px";

    var lbl = document.createElement("span");
    lbl.textContent = g.name;

    item.appendChild(sq);
    item.appendChild(lbl);

    var toggleGroup = function () {
      if (activeGroups.has(g.name) && activeGroups.size === 1) return;
      if (activeGroups.has(g.name)) activeGroups.delete(g.name);
      else activeGroups.add(g.name);
      updateVisualization();
    };
    item.addEventListener("click", toggleGroup);
    item.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault(); toggleGroup();
      }
    });
    legend.appendChild(item);
  });
  legendInitialized = true;
}

function updateLegendStyles() {
  var legend = document.getElementById("legend");
  if (!legend) return;
  legend.querySelectorAll(".legend-item").forEach(function (item) {
    var grp = item.getAttribute("data-group");
    var on = activeGroups.has(grp);
    item.classList.toggle("inactive", !on);
    item.classList.toggle("active", on);
    item.setAttribute("aria-pressed", on ? "true" : "false");
  });
}

var treemapData = getDataForRender();
var treemapInstance = null;
var vizContainer = document.getElementById("viz");

function buildYearSelector() {
  /* v2: the row is built only when ?controls=1 asks for it; otherwise the
     years come from the URL and there is nothing to click. */
  if (!V2.controls) return;
  if (yearSelectorInitialized) return;
  if (!YEARS.length) return;
  var sel = document.getElementById("year-selector");
  if (!sel) return;
  sel.innerHTML = "";

  var allBtn = document.createElement("button");
  allBtn.className = "selector-button" + (activeYears.size === YEARS.length ? " active" : "");
  allBtn.textContent = "All";
  allBtn.setAttribute("type", "button");
  allBtn.addEventListener("click", function () {
    if (activeYears.size === YEARS.length) return;
    activeYears = new Set(YEARS);
    updateYearStyles();
    updateVisualization();
  });
  sel.appendChild(allBtn);

  YEARS.forEach(function (yr) {
    var btn = document.createElement("button");
    btn.className = "selector-button" + (activeYears.has(yr) ? " active" : "");
    btn.textContent = String(yr);
    btn.setAttribute("type", "button");
    btn.setAttribute("data-year", String(yr));
    btn.addEventListener("click", function () {
      if (activeYears.has(yr)) {
        if (activeYears.size === 1) return; // keep at least one year
        activeYears.delete(yr);
      } else {
        activeYears.add(yr);
      }
      updateYearStyles();
      updateVisualization();
    });
    sel.appendChild(btn);
  });
  yearSelectorInitialized = true;
}

function v2SyncYears() {
  var picked = YEARS.filter(function (y) { return activeYears.has(y); });
  V2.setYears(picked.length ? picked : YEARS);
}

function updateYearStyles() {
  v2SyncYears();
  var sel = document.getElementById("year-selector");
  if (!sel) return;
  sel.querySelectorAll(".selector-button").forEach(function (b) {
    if (b.textContent === "All") {
      b.classList.toggle("active", activeYears.size === YEARS.length);
    } else {
      var y = +b.getAttribute("data-year");
      b.classList.toggle("active", activeYears.has(y));
    }
  });
}

function ensureTreemapInstance(width, height) {
  if (!vizContainer) return null;
  if (!treemapInstance) {
    treemapInstance = new d3plus.Treemap()
      .select("#viz")
      .data(treemapData)
      .groupBy(["parent", "name"])
      .tooltip(!!SHOW_TOOLTIP)
      .tooltipConfig({
        title: function (d) { return d.name; },
        body: function (d) {
          var grp = d.parent || d.id;
          var val = d.value || 0;
          return "<strong>Group:</strong> " + grp +
                 "<br><strong>" + VALUE_LABEL + ":</strong> " + formatValue(val);
        }
      })
      .sum("value")
      .layoutPadding(2)
      .legend(false)
      .color(function (d) { return getGroupColor(d.parent || d.id); })
      .shapeConfig({
        rx: TREEMAP_BORDER_RADIUS, ry: TREEMAP_BORDER_RADIUS,
        stroke: function (d) {
          return d.depth === 0 ? getGroupColor(d.id) : "transparent";
        },
        strokeWidth: function (d) { return d.depth === 0 ? 3 : 0; }
      })
      .config({ label: function (d) { return d.name; } });
  }
  if (typeof treemapInstance.width === "function" && width) treemapInstance.width(width);
  if (typeof treemapInstance.height === "function" && height) treemapInstance.height(height);
  return treemapInstance;
}

function updateVisualization(width, height) {
  treemapData = getDataForRender();
  var inst = ensureTreemapInstance(width, height);
  if (!inst) return;
  inst.data(treemapData).render();
  updateLegendStyles();
  updateYearStyles();
}

function renderVisualizationForContainer() {
  if (!vizContainer) return;
  buildLegend();
  buildYearSelector();
  var rect = vizContainer.getBoundingClientRect();
  updateVisualization(rect.width, rect.height);
}

var resizeTimer;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderVisualizationForContainer, 120);
});
if (typeof ResizeObserver !== "undefined" && vizContainer) {
  new ResizeObserver(renderVisualizationForContainer).observe(vizContainer);
}
renderVisualizationForContainer();
</script>

<script>
/* ══ v2: pin the chart element to the grid cell's real pixels ═══════════════════
   Safari/WebKit sizes `#viz { height: 100% }` from the *grid container* until the
   `Nfr` row is resolved, which happens after the first render. The chart therefore
   draws itself taller than its cell and `overflow: hidden` cuts the bottom off —
   the rotated x-axis labels in the bars, the last row of tiles in the treemaps.
   Measuring the cell and writing those pixels back breaks the circular sizing;
   the dispatched `resize` makes the chart redraw at the corrected size (every
   archetype here, Leaflet included, re-renders on window resize). ══════════════ */
(function () {
  var cell = document.getElementById("container1");
  var viz = document.getElementById("viz") || document.getElementById("map");
  if (!cell || !viz) return;
  var lastW = 0, lastH = 0, redraws = 0;
  function pin() {
    var w = Math.round(cell.clientWidth), h = Math.round(cell.clientHeight);
    if (!w || !h) return;
    if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
    lastW = w; lastH = h;
    viz.style.width = w + "px";
    viz.style.height = h + "px";
    /* a cell whose height feeds back from its content could ping-pong here; cap it */
    if (redraws++ < 40) window.dispatchEvent(new Event("resize"));
  }
  pin();
  requestAnimationFrame(pin);
  window.addEventListener("load", function () { requestAnimationFrame(pin); });
  window.addEventListener("resize", pin);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(pin).observe(cell);
})();
</script>
</body>
</html>
