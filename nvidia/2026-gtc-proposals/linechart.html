html[data-theme="dark"] {

:root {
    --fs-control:  clamp(9px, 1.4vw, 13px);
    --fs-legend:   clamp(0.625rem, 1.4vw, 1rem);

    --fs-slider:   clamp(11px, 1.2vw, 13px);

    --breakpoint-compact: 500px;
}

html, body {
    height: 100%;
}

body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Helvetica, Arial, sans-serif;
    background-color: var(--c-bg);
}

.viz-grid {
    display: grid;
    grid-template-rows: 16fr 1fr 1fr;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    padding-bottom: clamp(8px, 2vh, 18px);
}

#container1 {
    grid-row: 1;
    grid-column: 1 / span 2;
    overflow: hidden;
    min-height: 0;
}

#container1 .chart-wrapper {
    flex: 1 1 auto;
    display: flex;
    min-width: 0;
    height: 100%;
    margin-left: 0;
}

#container1 .chart-wrapper-inner {
    flex: 1 1 auto;
    display: flex;
    min-width: 0;
    height: 100%;
}

#container2 {
    grid-row: 2;
    grid-column: 1 / span 2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#container3 {
    grid-row: 3;
    grid-column: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 20px;
    overflow: hidden;
    min-width: 0;
}

#container4 {
    grid-row: 3;
    grid-column: 2;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 20px;
    overflow: hidden;
    min-width: 0;
}

#container4 a {
    height: 100%;
    display: flex;
    align-items: center;
    cursor: default;
}

#viz {
    width: 100%;
    height: 100%;
    min-height: 0;
    min-width: 0;
}

#chart {
    display: block;
    width: 100%;
    height: 100%;
}

#tooltip .t-rel {
    display: block;
    margin-top: 5px;
    color: var(--c-text);
    font-weight: 700;
}

#tooltip .t-rel span {
    color: var(--c-muted);
    font-weight: 500;
}

#tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--c-tooltip-bg);
    color: var(--c-text);
    border: 1px solid var(--c-tooltip-brd);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.4;
    opacity: 0;
    transition: opacity 0.15s ease;
    box-shadow: 0 4px 12px var(--c-tooltip-sh);
    max-width: 240px;
    z-index: 100;
}

.source-text {
    font-size: var(--fs-meta);
    font-weight: 600;
    color: var(--c-source);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-style: normal;
}

.source-text a {
    color: var(--c-link);
    text-decoration: underline;
    cursor: pointer;
    font-style: normal;
    display: inline-block;
    transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .32s cubic-bezier(.4,0,.2,1);
}

.source-text a:visited {
    color: var(--c-link);
}

.source-text a.slide-out { transform: translateY(12px);  opacity: 0; }
.source-text a.slide-in  { transform: translateY(-12px); opacity: 0; transition: none; }

.src-switch #container3,
.src-switch .source-text { overflow: visible; }

.logo {
    height: 100%;
    width: auto;
    max-height: 100%;
    max-width: 100%;
    pointer-events: auto;
    object-fit: contain;
}

a .logo,
.logo a {
    cursor: pointer;
}

.axis path,
.axis line {
    stroke: var(--c-axis);
}

.tick text {
    font-weight: 600;
    fill: var(--c-tick);
}

.grid-lines line {
    stroke: var(--c-grid);
    stroke-dasharray: 2, 3;
}

.grid-lines path {
    stroke: none;
}

.bar-label {
    fill: var(--c-bar-label);
    font-weight: 500;
}

@media (max-height: 500px) {
    .viz-grid {
        grid-template-rows: 1fr !important;
        grid-template-columns: 1fr !important;
        padding-bottom: 0;
    }

    #container1 {
        grid-row: 1 !important;
        grid-column: 1 !important;
    }

    #container2,
    #container3,
    #container4 {
        display: none !important;
    }

    .legend,
    .source-text,
    .logo {
        display: none !important;

#container3 {

    padding: 0;

#container4 {

.milestone-value {
    font-weight: 800;
    paint-order: stroke;
    stroke-linejoin: round;
}





html[data-theme="dark"] .milestone-value.on-white,
html[data-theme="dark"] .milestone-value.on-fill {
    stroke-width: 5.5px;
}




html[data-theme="dark"] .milestone-value .milestone-sub {
    stroke-width: 3.2px;
}

.milestone-sub {
    font-weight: 600;
}

.release-org {
    font-weight: 600;
    letter-spacing: 0.01em;
    paint-order: stroke;
    stroke-linejoin: round;
}



html[data-view="datasets"] .release-org,
html[data-view="spaces"] .release-org {
    font-weight: 500;
    letter-spacing: normal;
}

.release-model {
    font-weight: 700;
    paint-order: stroke;
    stroke-linejoin: round;
}

.on-white {
    stroke: var(--c-halo);
    stroke-width: 3.5px;
}

.on-fill {
    stroke: var(--c-halo);
    stroke-width: 3.5px;
}



html[data-view="models"] .release-org.on-white,
html[data-view="models"] .release-org.on-fill {
    stroke-width: 2.8px;
}

html[data-view="models"] .release-model.on-white,
html[data-view="models"] .release-model.on-fill {
    stroke-width: 3.4px;
}

.leader {
    fill: none;
    stroke-width: 1.2px;
    stroke-dasharray: 3 2;
    stroke-linejoin: round;
}


html[data-view="datasets"] .leader {
    stroke-width: 1px;
    stroke-dasharray: none;
}

.year-axis-label {
    font-weight: 700;
    fill: var(--c-tick);
}

.y-axis-title {
    fill: var(--c-y-title);
    font-weight: 700;
}

.chart-title {
    font-family: "Libre Baskerville", "Bodoni 72", Didot, serif;
    font-weight: 700;
    fill: var(--c-text);
}







#container-switch {
    display: flex;
    align-items: center;
    justify-content: center;
    justify-self: center;
    align-self: center;
    overflow: visible;
    min-width: 0;
    z-index: 2;
}

.selector-group {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(8px, 1.4vw, 18px);
    padding: 0;
    border: none;
    background: none;
    max-width: 100%;
    min-width: 0;
}

.selector-pill {
    position: absolute;
    top: 0;
    left: 0;
    height: 2px;
    background: var(--c-curve);
    border-radius: 1px;
    z-index: 0;
    pointer-events: none;
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.selector-button {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    

    padding: clamp(4px, 0.7vh, 7px) 0;
    border-radius: 0;
    font-family: inherit;
    font-size: var(--fs-control);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--c-muted);
    cursor: pointer;
    transition: color 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
}

.selector-button:hover {
    color: var(--c-text);
}

.selector-button.active {
    color: var(--c-curve);
}

.selector-button:focus-visible {
    outline: 2px solid var(--c-curve);
    outline-offset: 3px;
}

@media (max-height: 500px) {
    #container-switch {
        display: none !important;
    }
}

    (function applyContainerVisibility() {
      const vizGrid = document.querySelector('.viz-grid');
      const c2 = document.getElementById('container2');
      const c3 = document.getElementById('container3');
      const c4 = document.getElementById('container4');
      const c5 = document.getElementById('container5');
      const cSwitch = document.getElementById('container-switch');

      if (!SHOW_CONTAINER_2 && c2) c2.style.display = 'none';

      if (!SHOW_CONTAINER_4 && c4) c4.style.display = 'none';
      if (c5 && !SHOW_CONTAINER_5) c5.style.display = 'none';

      const row2Visible = SHOW_CONTAINER_5;
      const row3Visible = SHOW_CONTAINER_2;
      const row4Visible = SHOW_CONTAINER_3 || SHOW_CONTAINER_4;

      let gridRows = [];
      let currentRow = 1;
      const chartHeight = 20 - (row2Visible ? 1 : 0) - (row3Visible ? 1 : 0) - (row4Visible ? 1 : 0);
      gridRows.push(`${chartHeight}fr`);

      if (row2Visible) { gridRows.push('1fr'); currentRow++; if (c5) c5.style.gridRow = String(currentRow); }
      if (row3Visible) { gridRows.push('1fr'); currentRow++; if (c2) c2.style.gridRow = String(currentRow); }
      if (row4Visible) {
        gridRows.push('1fr'); currentRow++;
        if (SHOW_CONTAINER_3 && c3) c3.style.gridRow = String(currentRow);
        if (SHOW_CONTAINER_4 && c4) c4.style.gridRow = String(currentRow);

        if (cSwitch) {
          cSwitch.style.gridRow = String(currentRow);
          cSwitch.style.gridColumn = '1 / span 2';
        }
      } else if (cSwitch) {
        cSwitch.style.display = 'none';

      vizGrid.style.gridTemplateRows = gridRows.join(' ');

      render();
      if (push) {
        try {
          const q = new URLSearchParams(location.search);
          q.set('view', VIEW);
          history.replaceState(null, '', `${location.pathname}?${q.toString()}${location.hash}`);
        } catch (e) {}
      }
    }

    document.getElementById('view-switch').addEventListener('click', e => {
      const btn = e.target.closest('.selector-button');
      if (btn) setView(btn.dataset.view, true);
    });

    function measureText(svgNode, text, fontSize, weight, family) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', -9999);
      t.setAttribute('y', -9999);
      t.style.fontSize = fontSize + 'px';
      t.style.fontWeight = weight;
      if (family) t.style.fontFamily = family;
      t.textContent = text;
      svgNode.appendChild(t);
      const w = t.getComputedTextLength();
      svgNode.removeChild(t);
      return w;
    }

    function boxesOverlap(a, b, pad) {
      return a.x0 - pad < b.x1 && a.x1 + pad > b.x0 && a.y0 - pad < b.y1 && a.y1 + pad > b.y0;
    }

    function segmentsCross(p1, p2, p3, p4) {
      const d = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
      const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
      return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
    }

    function render() {
      const V = VIEWS[VIEW];
      const DATA = dataFor(VIEW);
      const LOGOS = V.LOGOS;
      const AREA_FILL = C.area;
      const CURVE_STROKE = C.curve;

      d3.select(vizContainer).selectAll('*').remove();

      const rect = vizContainer.getBoundingClientRect();
      const width = Math.max(320, rect.width);
      const height = Math.max(220, rect.height);
      const compact = window.matchMedia(`(max-height:${BREAKPOINT_COMPACT}px)`).matches;
      const sc = Math.max(0.6, Math.min(1, Math.min(width / 1400, height / 780)));

      if (!DATA.length) {
        const el = document.createElement('div');
        el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;font-family:system-ui,sans-serif;color:var(--c-muted);';
        el.textContent = 'No data available';
        vizContainer.appendChild(el);
        return;
      }

      const yMaxValue = d3.max(DATA, d => d.number);
      const yMaxStr = shortFormatter(yMaxValue);
      const yLabelWidth = Math.max(yMaxStr.length * 10, 34);

      const margin = {
        top: Math.round(26 * sc),
        right: Math.round(26 * sc),
        bottom: Math.round(Math.max(46, 66 * sc)),
        left: Math.round(yLabelWidth + 34 * sc)
      };
      const innerWidth = Math.max(40, width - margin.left - margin.right);
      const innerHeight = Math.max(40, height - margin.top - margin.bottom);

      document.getElementById('container4').style.paddingRight = `${margin.right}px`;

      const axisFont = Math.max(10, Math.round(14 * sc));

      const svg = d3.select(vizContainer).append('svg')
        .attr('width', width)
        .attr('height', height)
        .attr('viewBox', `0 0 ${width} ${height}`)
        .style('width', '100%')
        .style('height', '100%');
      const svgNode = svg.node();

      const defs = svg.append('defs');
      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      const x = d3.scaleUtc()
        .domain([DATA[0].date, DATA[DATA.length - 1].date])
        .range([0, innerWidth]);

      
      
      
      
      const y = d3.scaleLinear().range([innerHeight, 0]);
      let yTickValues = null;
      if (V.yNice) {
        y.domain([0, yMaxValue * 1.06]).nice();
      } else {
        y.domain([0, Math.ceil(yMaxValue * 1.25 / 500000) * 500000]);
        yTickValues = d3.ticks(0, yMaxValue, compact ? 4 : 8);
      }
      const applyTicks = axis => yTickValues ? axis.tickValues(yTickValues) : axis.ticks(compact ? 4 : 6);

      g.append('g')
        .attr('class', 'grid-lines')
        .call(applyTicks(d3.axisLeft(y)).tickSize(-innerWidth).tickFormat(''))
        .select('.domain').remove();

      const minDate = DATA[0].date;
      const maxDate = DATA[DATA.length - 1].date;
      const years = Array.from(new Set(DATA.map(d => String(d.date.getUTCFullYear())))).sort();

      const area = d3.area().x(d => x(d.date)).y0(innerHeight).y1(d => y(d.number)).curve(d3.curveMonotoneX);
      const line = d3.line().x(d => x(d.date)).y(d => y(d.number)).curve(d3.curveMonotoneX);

        const gradId = 'areaFade';
        defs.select('#' + gradId).remove();
        const grad = defs.append('linearGradient')
          .attr('id', gradId)
          .attr('gradientUnits', 'userSpaceOnUse')
          .attr('x1', 0).attr('y1', 0)
          .attr('x2', 0).attr('y2', innerHeight);
        grad.append('stop').attr('offset', '0%')
          .attr('stop-color', AREA_FILL).attr('stop-opacity', 0.62);
        grad.append('stop').attr('offset', '100%')
          .attr('stop-color', AREA_FILL).attr('stop-opacity', 0);
        g.append('path').datum(DATA)
          .attr('fill', 'url(#' + gradId + ')').attr('d', area);
      g.append('path').datum(DATA)
        .attr('fill', 'none').attr('stroke', CURVE_STROKE)
        .attr('stroke-width', V.curveWidth * sc).attr('stroke-opacity', V.curveOpacity).attr('d', line);

      const yearFont = Math.round(axisFont * 1.6);
      const yearLabelY = innerHeight + Math.round(Math.max(22, 30 * sc)) + yearFont * 0.4;
      years.forEach(yr => {
        const ys = new Date(Date.UTC(+yr, 0, 1));
        const ye = new Date(Date.UTC(+yr + 1, 0, 1));
        const s = ys < minDate ? minDate : ys;
        const e = ye > maxDate ? maxDate : ye;
        if (s >= e) return;
        g.append('text').attr('class', 'year-axis-label')
          .attr('x', (x(s) + x(e)) / 2).attr('y', yearLabelY)
          .attr('text-anchor', 'middle')
          .style('font-size', `${yearFont}px`).text(yr);
      });

      g.append('g').attr('class', 'axis x-axis')
        .attr('transform', `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x).tickValues([]).tickSize(0));

      const yAxisG = g.append('g').attr('class', 'axis y-axis')
        .call(applyTicks(d3.axisLeft(y)).tickFormat(v => shortFormatter(v)));
      yAxisG.selectAll('text').style('font-size', `${axisFont}px`);
      yAxisG.select('.domain').remove();

      let yTitleNode = null;
      if (!compact) {
        yTitleNode = yAxisG.append('text').attr('class', 'y-axis-title')
          .attr('transform', 'rotate(-90)')
          .attr('y', -margin.left + Math.round(14 * sc))
          .attr('x', -(innerHeight / 2))
          .attr('dy', '0.71em')
          .attr('text-anchor', 'middle')
          .style('font-size', `${Math.round(17 * sc)}px`)
          .text(V.yAxisTitle)
          .node();
      }

      const svgLeft = svgNode.getBoundingClientRect().left;
      const inkLeft = yTitleNode
        ? yTitleNode.getBoundingClientRect().left - svgLeft
        : margin.left;
      document.getElementById('container3').style.paddingLeft = `${Math.max(0, Math.round(inkLeft))}px`;

      const bisectDate = d3.bisector(d => d.date).left;
      const valueAt = date => {
        const i = Math.min(Math.max(bisectDate(DATA, date), 0), DATA.length - 1);
        return DATA[i].number;
      };

      const STEP = 3;
      const curveY = new Float64Array(Math.ceil(innerWidth / STEP) + 2);
      for (let k = 0; k < curveY.length; k++) {
        const px = Math.min(k * STEP, innerWidth);
        const date = x.invert(px);
        const i = Math.min(Math.max(bisectDate(DATA, date), 1), DATA.length - 1);
        const a = DATA[i - 1], b = DATA[i];
        const span = Math.max(1, b.date - a.date);
        const t = Math.max(0, Math.min(1, (date - a.date) / span));
        curveY[k] = y(a.number + (b.number - a.number) * t);
      }
      const yAtPx = px => curveY[Math.max(0, Math.min(curveY.length - 1, Math.round(px / STEP)))];

      function boxAboveCurve(b, clear) {
        if (b.y0 < 2 || b.x0 < 0 || b.x1 > innerWidth) return false;
        for (let px = b.x0; px <= b.x1; px += STEP) if (yAtPx(px) < b.y1 + clear) return false;
        return yAtPx(b.x1) >= b.y1 + clear;
      }
      function boxInsideFill(b, clear) {
        if (b.y1 > innerHeight - 4 || b.x0 < 0 || b.x1 > innerWidth) return false;
        for (let px = b.x0; px <= b.x1; px += STEP) if (yAtPx(px) > b.y0 - clear) return false;
        return yAtPx(b.x1) <= b.y0 - clear;
      }

      const placedBoxes = [];
      const placedSegs = [];
      const clear = Math.round(7 * sc);
      const pad = Math.round(9 * sc);

      function segHitsBox(s, b) {
        const sx0 = Math.min(s[0].x, s[1].x), sx1 = Math.max(s[0].x, s[1].x);
        const sy0 = Math.min(s[0].y, s[1].y), sy1 = Math.max(s[0].y, s[1].y);
        return sx0 < b.x1 - 1 && sx1 > b.x0 + 1 && sy0 < b.y1 - 1 && sy1 > b.y0 + 1;
      }

      function segsOk(segs) {
        for (const s of segs) {
          for (const t of placedSegs) if (segmentsCross(s[0], s[1], t[0], t[1])) return false;
          for (const b of placedBoxes) if (segHitsBox(s, b)) return false;
        }
        return true;
      }

      function hLineClear(xa, xb, yy, above) {
        const lo = Math.min(xa, xb), hi = Math.max(xa, xb);
        for (let px = lo; px <= hi; px += STEP) {
          const cy = yAtPx(px);
          if (above ? cy < yy + clear : cy > yy - clear) return false;
        }
        return true;
      }

      function leaderFor(box, dotX, dotY, dotGap) {
        const above = box.mode === 'above';
        if (box.shape === 'v') {
          const stop = { x: dotX, y: above ? dotY - dotGap : dotY + dotGap };
          return [[stop, { x: dotX, y: above ? box.y1 : box.y0 }]];
        }
        if (box.shape === 'vh') {
          const stop = { x: dotX, y: above ? dotY - dotGap : dotY + dotGap };
          const midY = (box.y0 + box.y1) / 2;
          const nearX = box.side < 0 ? box.x1 + 3 : box.x0 - 3;
          if (!hLineClear(dotX, nearX, midY, above)) return null;
          return [[stop, { x: dotX, y: midY }], [{ x: dotX, y: midY }, { x: nearX, y: midY }]];
        }
        const cx = (box.x0 + box.x1) / 2;
        const stop = { x: dotX + box.hvSide * dotGap, y: dotY };
        if (!hLineClear(stop.x, cx, dotY, above)) return null;
        return [[stop, { x: cx, y: dotY }], [{ x: cx, y: dotY }, { x: cx, y: above ? box.y1 : box.y0 }]];
      }

      function tryPlace(dotX, dotY, w, h, gapX, lifts, drops, dotGap, vertLifts, parkFirst) {
        vertLifts = vertLifts || lifts;
        const vert = (off, above) => above
          ? { x0: dotX - w / 2, x1: dotX + w / 2, y0: dotY - off - h, y1: dotY - off, side: 0, shape: 'v', mode: 'above' }
          : { x0: dotX - w / 2, x1: dotX + w / 2, y0: dotY + off, y1: dotY + off + h, side: 0, shape: 'v', mode: 'fill' };
        const elbow = (off, above, side) => {
          const x0 = side < 0 ? dotX - gapX - w : dotX + gapX;
          return above
            ? { x0, x1: x0 + w, y0: dotY - off - h, y1: dotY - off, side, shape: 'vh', mode: 'above' }
            : { x0, x1: x0 + w, y0: dotY + off, y1: dotY + off + h, side, shape: 'vh', mode: 'fill' };
        };
        const sideways = (hoff, voff, above, hvSide) => {
          const cx = dotX + hvSide * hoff;
          const x0 = cx - w / 2, x1 = cx + w / 2;
          return above
            ? { x0, x1, y0: dotY - voff - h, y1: dotY - voff, side: 0, shape: 'hv', hvSide, mode: 'above' }
            : { x0, x1, y0: dotY + voff, y1: dotY + voff + h, side: 0, shape: 'hv', hvSide, mode: 'fill' };
        };

        const near = 6;
        const hoffs = [];
        for (let k = 0; k < 7; k++) hoffs.push(w / 2 + gapX * 2 + k * Math.round(34 * sc));
        const voffs = [Math.round(10 * sc), Math.round(30 * sc), Math.round(54 * sc)];

        const cands = [];
        if (parkFirst) {
          vertLifts.forEach(L => cands.push(vert(L, true)));
          hoffs.forEach(H => voffs.forEach(V2 => [-1, 1].forEach(s => cands.push(sideways(H, V2, true, s)))));
          lifts.forEach(L => [-1, 1].forEach(s => cands.push(elbow(L, true, s))));
          drops.forEach(D => cands.push(vert(D, false)));
          drops.forEach(D => [1, -1].forEach(s => cands.push(elbow(D, false, s))));
        } else {
          vertLifts.slice(0, near).forEach(L => cands.push(vert(L, true)));
          drops.slice(0, near).forEach(D => cands.push(vert(D, false)));
          lifts.forEach(L => [-1, 1].forEach(s => cands.push(elbow(L, true, s))));
          drops.forEach(D => [1, -1].forEach(s => cands.push(elbow(D, false, s))));
          hoffs.forEach(H => voffs.forEach(V2 => [-1, 1].forEach(s => cands.push(sideways(H, V2, true, s)))));
          hoffs.forEach(H => voffs.forEach(V2 => [1, -1].forEach(s => cands.push(sideways(H, V2, false, s)))));
          vertLifts.slice(near).forEach(L => cands.push(vert(L, true)));
          drops.slice(near).forEach(D => cands.push(vert(D, false)));
        }

        for (const c of cands) {
          const fits = c.mode === 'above' ? boxAboveCurve(c, clear) : boxInsideFill(c, clear);
          if (!fits) continue;
          if (placedBoxes.some(b => boxesOverlap(c, b, pad))) continue;
          const segs = leaderFor(c, dotX, dotY, dotGap);
          if (!segs || !segsOk(segs)) continue;
          placedBoxes.push(c);
          segs.forEach(s => placedSegs.push(s));
          return { box: c, segs };
        }
        return null;
      }

      function leaderPath(segs) {
        let d = `M${segs[0][0].x},${segs[0][0].y}`;
        segs.forEach(s => { d += ` L${s[1].x},${s[1].y}`; });
        return d;
      }

      const momentFont = Math.round(30 * sc);
      const momentSubFont = Math.round(14 * sc);
      const orgFont = Math.max(V.orgFontMin, Math.round(V.orgFontScale * sc));
      const modelFont = Math.max(V.modelFontMin, Math.round(V.modelFontScale * sc));
      const gapX = Math.round(13 * sc);
      const logoR = V.logoR === 'model' ? Math.max(10, modelFont) : Math.round(V.logoR * sc);
      const liftLadder = [];
      for (let L = Math.round(24 * sc); L < innerHeight; L += Math.round(24 * sc)) liftLadder.push(L);
      const dropLadder = [];
      for (let D = Math.round(24 * sc); D < innerHeight * 0.8; D += Math.round(24 * sc)) dropLadder.push(D);

      const momentsG = g.append('g');
      const releasesG = g.append('g');
      const logosG = g.append('g');
      const calloutG = g.append('g');
      const titleG = g.append('g');

      
      
      
      
      
      
      const CHART_TITLE = V.chartTitle;
      let titleFont = Math.max(18, Math.min(66, width * 0.0315));
      const titleMaxW = width - Math.round(30 * sc) * 2;
      let titleW = measureText(svgNode, CHART_TITLE, titleFont, 700, SERIF);
      let titleGuard = 0;
      while (titleFont > 13 && titleW > titleMaxW && titleGuard < 140) {
        titleFont -= 0.6;
        titleW = measureText(svgNode, CHART_TITLE, titleFont, 700, SERIF);
        titleGuard++;
      }
      const titleCx = width / 2 - margin.left;
      const titleTop = Math.max(18, Math.min(46, height * 0.052)) - margin.top;
      const titlePad = Math.round(10 * sc);
      placedBoxes.push({
        x0: titleCx - titleW / 2 - titlePad, x1: titleCx + titleW / 2 + titlePad,
        y0: titleTop - titlePad, y1: titleTop + titleFont * 1.15 + titlePad
      });

      titleG.append('text')
        .attr('class', 'chart-title')
        .attr('x', titleCx).attr('y', titleTop + titleFont * 0.85)
        .attr('text-anchor', 'middle')
        .style('font-size', `${titleFont}px`)
        .text(CHART_TITLE);

      const releases = V.RELEASES
        .map(r => ({ ...r, dateObj: parseDate(r.date) }))
        .filter(r => r.dateObj && r.dateObj >= minDate && r.dateObj <= maxDate)
        .map(r => ({ ...r, dotX: x(r.dateObj), dotY: y(valueAt(r.dateObj)),
                   logo: LOGOS[r.org] || null, color: orgColor(r.color) }))
        .sort((a, b) => a.dotY - b.dotY);

      releases.forEach(r => {
        r.inBlock = !!r.logo;
        r.markR = Math.max(4, 6 * sc);
        placedBoxes.push({ x0: r.dotX - r.markR, x1: r.dotX + r.markR, y0: r.dotY - r.markR, y1: r.dotY + r.markR });
      });

      const last = DATA[DATA.length - 1];
      const lastX = x(last.date), lastY = y(last.number);
      const lastR = Math.max(5, 9 * sc);
      placedBoxes.push({ x0: lastX - lastR, x1: lastX + lastR, y0: lastY - lastR, y1: lastY + lastR });

      const moments = V.KEY_MOMENTS
        .map(m => ({ ...m, dateObj: parseDate(m.date) }))
        .filter(m => m.dateObj && m.dateObj >= minDate && m.dateObj <= maxDate)
        .map(m => ({ ...m, dotX: x(m.dateObj), dotY: y(valueAt(m.dateObj)) }))
        .sort((a, b) => a.dotY - b.dotY);

      const momentR = Math.max(5, 8 * sc);
      moments.forEach(m => {
        placedBoxes.push({ x0: m.dotX - momentR, x1: m.dotX + momentR, y0: m.dotY - momentR, y1: m.dotY + momentR });
      });

      const calloutFont = Math.round(34 * sc);
      const calloutSubFont = Math.round(calloutFont * 0.36);
      const calloutText = numberFormatter(last.number);
      const calloutSub = `${V.noun}, ${formatTooltipDate(last.date)}`;
      const calloutW = Math.max(
        measureText(svgNode, calloutText, calloutFont, 800),
        measureText(svgNode, calloutSub, calloutSubFont, 600));
      const calloutH = calloutFont + calloutSubFont * 1.5;

      
      
      
      const placeCallout = () => tryPlace(lastX, lastY, calloutW, calloutH, gapX, [], dropLadder, lastR + 5);
      let calloutRes = V.calloutFirst ? placeCallout() : null;

      const unplacedMoments = [];
      moments.forEach(m => {
        const w = Math.max(
          measureText(svgNode, m.label, momentFont, 800),
          measureText(svgNode, V.noun, momentSubFont, 600));
        const h = momentFont + momentSubFont * 1.15;
        const res = tryPlace(m.dotX, m.dotY, w, h, gapX, liftLadder, dropLadder, momentR + 5);
        if (!res) { unplacedMoments.push(m.label); return; }
        const { box, segs } = res;
        const onFill = box.mode === 'fill';
        const cls = onFill ? 'on-fill' : 'on-white';
        
        
        
        
        const fill = C.inkOnFill;
        const tx = box.side < 0 ? box.x1 : box.side > 0 ? box.x0 : (box.x0 + box.x1) / 2;
        const anchor = box.side < 0 ? 'end' : box.side > 0 ? 'start' : 'middle';

        momentsG.append('path').attr('class', 'leader')
          .attr('stroke', onFill ? C.inkFill : C.leaderStrong)
          .attr('d', leaderPath(segs));

        const t = momentsG.append('text')
          .attr('class', `milestone-value ${cls}`)
          .attr('x', tx).attr('y', box.y0 + momentFont)
          .attr('text-anchor', anchor).attr('fill', fill)
          .style('font-size', `${momentFont}px`);
        t.append('tspan').attr('x', tx).attr('dy', 0).text(m.label);
        t.append('tspan').attr('x', tx).attr('dy', '1.1em')
          .attr('class', 'milestone-sub')
          .style('font-size', `${momentSubFont}px`).text(V.noun);

        momentsG.append('circle')
          .attr('cx', m.dotX).attr('cy', m.dotY).attr('r', momentR)
          .attr('fill', C.dot).attr('stroke', C.halo).attr('stroke-width', 2.2);
      });

      const unplaced = [];
      const parkStep = Math.round(V.parkStep * sc);
      
      
      const parkLadder = dotY => {
        if (V.parkFraction === null) {
          const out = [];
          for (let L = Math.round(30 * sc); L < dotY; L += parkStep) out.push(L);
          return out;
        }
        const target = dotY * V.parkFraction;
        const out = [target];
        for (let k = 1; k < 30; k++) {
          const up = target + k * parkStep;
          const down = target - k * parkStep;
          if (up < dotY - parkStep) out.push(up);
          if (down > parkStep) out.push(down);
        }
        return out.map(Math.round);
      };
      releases.forEach((r, i) => {
        const textW = Math.max(
          measureText(svgNode, r.model, modelFont, 700),
          measureText(svgNode, r.org, orgFont, 500));
        const logoD = logoR * 2;
        const blockGap = Math.round(V.blockGap * sc);
        const w = r.inBlock ? Math.max(textW, logoD) : textW;
        const h = (r.inBlock ? logoD + blockGap : 0) + orgFont * V.orgLine + modelFont;
        const res = tryPlace(r.dotX, r.dotY, w, h, gapX, liftLadder,
                             V.releaseDrops ? dropLadder : [], r.markR + 5,
                             parkLadder(r.dotY), true);

        logosG.append('circle')
          .attr('cx', r.dotX).attr('cy', r.dotY).attr('r', r.markR)
          .attr('fill', r.color).attr('stroke', C.halo).attr('stroke-width', 2);

        if (!res) { unplaced.push(r.model); return; }
        const { box, segs } = res;
        const onFill = box.mode === 'fill';
        const cls = onFill ? 'on-fill' : 'on-white';
        const textCls = V.keepHaloOnFill ? cls : (onFill ? '' : cls);
        const tx = box.side < 0 ? box.x1 : box.side > 0 ? box.x0 : (box.x0 + box.x1) / 2;
        const anchor = box.side < 0 ? 'end' : box.side > 0 ? 'start' : 'middle';
        const boxCx = (box.x0 + box.x1) / 2;
        const textTop = box.y0 + (r.inBlock ? logoD + blockGap : 0);
        const modelBase = box.y1 - 1;

        releasesG.append('path').attr('class', 'leader')
          .attr('stroke', (V.leaderInkOnFill && onFill) ? C.inkFill : C.leaderMuted)
          .attr('d', leaderPath(segs));

        
        if (V.backplate && onFill) {
          releasesG.append('rect')
            .attr('x', box.x0 - 7).attr('y', box.y0 - 5)
            .attr('width', box.x1 - box.x0 + 14).attr('height', box.y1 - box.y0 + 10)
            .attr('rx', 5)
            .attr('fill', C.bg).attr('fill-opacity', 0.93)
            .attr('stroke', 'rgba(15,23,42,0.12)');
        }

        if (r.inBlock) {
          const clipId = `logo-clip-${i}`;
          defs.append('clipPath').attr('id', clipId)
            .append('circle').attr('cx', boxCx).attr('cy', box.y0 + logoR).attr('r', logoR - 2);
          logosG.append('circle')
            .attr('cx', boxCx).attr('cy', box.y0 + logoR).attr('r', logoR - 1)
            .attr('fill', C.logoDisc);
          logosG.append('image')
            .attr('href', r.logo)
            .attr('x', boxCx - (logoR - 2)).attr('y', box.y0 + logoR - (logoR - 2))
            .attr('width', (logoR - 2) * 2).attr('height', (logoR - 2) * 2)
            .attr('preserveAspectRatio', 'xMidYMid slice')
            .attr('clip-path', `url(#${clipId})`);
          logosG.append('circle')
            .attr('cx', boxCx).attr('cy', box.y0 + logoR).attr('r', logoR - 1)
            .attr('fill', 'none').attr('stroke', r.color).attr('stroke-width', 2.4);
          logosG.append('circle')
            .attr('cx', boxCx).attr('cy', box.y0 + logoR).attr('r', logoR + 0.6)
            .attr('fill', 'none').attr('stroke', C.halo).attr('stroke-width', 1.6);
          if (V.connector) {
            releasesG.append('line')
              .attr('x1', boxCx).attr('x2', boxCx)
              .attr('y1', box.y0 + logoD + 1.2).attr('y2', textTop + blockGap * 0.15)
              .attr('stroke', C.halo).attr('stroke-width', 3.4).attr('stroke-linecap', 'round');
            releasesG.append('line')
              .attr('x1', boxCx).attr('x2', boxCx)
              .attr('y1', box.y0 + logoD + 1.2).attr('y2', textTop + blockGap * 0.15)
              .attr('stroke', r.color).attr('stroke-width', 1.8).attr('stroke-linecap', 'round');
          }
        }

        releasesG.append('text')
          .attr('class', `release-org ${textCls}`)
          .attr('x', tx).attr('y', textTop + orgFont)
          .attr('text-anchor', anchor)
          .attr('fill', V.orgFill === 'blend' ? d3.interpolateLab(r.color, C.orgBlend)(0.42) : C.muted)
          .style('font-size', `${orgFont}px`).text(r.org);

        releasesG.append('text')
          .attr('class', `release-model ${textCls}`)
          .attr('x', tx).attr('y', modelBase)
          .attr('text-anchor', anchor).attr('fill', r.color)
          .style('font-size', `${modelFont}px`).text(r.model);
      });

      if (!V.calloutFirst) calloutRes = placeCallout();

      if (unplaced.length || unplacedMoments.length) {
        console.warn('unplaced', VIEW, unplaced, unplacedMoments);
      }

      calloutG.append('circle')
        .attr('cx', lastX).attr('cy', lastY).attr('r', lastR)
        .attr('fill', C.dot).attr('stroke', C.halo).attr('stroke-width', 2.4);

      if (calloutRes) {
        const cb = calloutRes.box;
        const ctx = cb.side < 0 ? cb.x1 : cb.side > 0 ? cb.x0 : (cb.x0 + cb.x1) / 2;
        const canchor = cb.side < 0 ? 'end' : cb.side > 0 ? 'start' : 'middle';
        
        const cInk = C.inkOnFill;
        const cHalo = C.halo;
        calloutG.append('path').attr('class', 'leader')
          .attr('stroke', C.inkFill)
          .attr('d', leaderPath(calloutRes.segs));
        calloutG.append('text')
          .attr('x', ctx).attr('y', cb.y0 + calloutFont).attr('text-anchor', canchor)
          .attr('fill', cInk).attr('font-weight', 800)
          .attr('stroke', cHalo).attr('stroke-width', IS_DARK ? 6.5 : 4.5)
          .attr('paint-order', 'stroke').attr('stroke-linejoin', 'round')
          .style('font-size', `${calloutFont}px`).text(calloutText);
        calloutG.append('text')
          .attr('x', ctx).attr('y', cb.y1 - 2).attr('text-anchor', canchor)
          .attr('fill', cInk).attr('font-weight', 600)
          .attr('stroke', cHalo).attr('stroke-width', IS_DARK ? 3.2 : 3)
          .attr('paint-order', 'stroke').attr('stroke-linejoin', 'round')
          .style('font-size', `${calloutSubFont}px`).text(calloutSub);
      }

      if (SHOW_TOOLTIP && tooltip) {
        const focusLine = g.append('line')
          .attr('stroke', C.text).attr('stroke-width', 1).attr('stroke-dasharray', '3 3')
          .attr('y1', 0).attr('y2', innerHeight).style('opacity', 0);
        const focusDot = g.append('circle')
          .attr('r', 4.5).attr('fill', C.dot).attr('stroke', C.halo).attr('stroke-width', 2)
          .style('opacity', 0);

        g.append('rect')
          .attr('width', innerWidth).attr('height', innerHeight).attr('fill', 'transparent')
          .on('mousemove', function (event) {
            const [mx] = d3.pointer(event, this);
            const i = Math.min(Math.max(bisectDate(DATA, x.invert(mx)), 0), DATA.length - 1);
            const d = DATA[i];
            focusLine.attr('x1', x(d.date)).attr('x2', x(d.date)).style('opacity', 0.5);
            focusDot.attr('cx', x(d.date)).attr('cy', y(d.number)).style('opacity', 1);
            const hit = releases.find(r => Math.abs(r.dotX - x(d.date)) <= r.markR);
            tooltip.innerHTML = `<strong>${numberFormatter(d.number)}</strong> ${V.noun}<br>${formatTooltipDate(d.date)}`
              + (hit ? `<span class="t-rel"><span>${hit.org}</span><br>${hit.model}</span>` : '');
            tooltip.style.left = `${event.clientX + 14}px`;
            tooltip.style.top = `${event.clientY - 24}px`;
            tooltip.style.opacity = '1';
          })
          .on('mouseleave', () => {
            tooltip.style.opacity = '0';
            focusLine.style.opacity = 0;
            focusDot.style.opacity = 0;
          });
      }
    }

    applyViewChrome();
    render();
    
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(movePill);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { render(); movePill(); }, 120);
    });

    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => { render(); movePill(); }).observe(vizContainer);
    }
  </script>
</body>
</html>
