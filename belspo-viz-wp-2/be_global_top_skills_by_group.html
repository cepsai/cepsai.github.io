<style>

      color-scheme: dark;
      --surface-0: #121211; --surface-1: #1a1a19; --border: #383835;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8a8985;

    }

    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8a8985;
    --grid: #2c2c2a;
    --s1: #3987e5; --violet: #9085e9; --s2: #d95926; --s3: #199e70; --s4: #c98500;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); margin: 0 0 16px; max-width: 900px; }

  .top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; margin: 4px 0 18px; }
  .metric-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .metric-label { font-size: 13px; color: var(--text-secondary); }
  .seg { --n: 2; --i: 0; position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
         padding: 5px; border-radius: 999px; background: var(--surface-1); border: 1px solid var(--border);
         max-width: 100%; }
  .seg .thumb { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / var(--n));
                border-radius: 999px; background: var(--s1); transform: translateX(calc(var(--i) * 100%));
                transition: transform .28s cubic-bezier(.3,.7,.3,1); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; cursor: pointer; border-radius: 999px;
                font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 10px 22px;
                color: var(--text-secondary); white-space: nowrap; transition: color .2s; }
  .seg button[aria-checked="true"] { color: #ffffff; }
  .seg button:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
  @media (max-width: 480px) { .seg button { font-size: 14px; padding: 9px 12px; } }
  @media (prefers-reduced-motion: reduce) { .seg .thumb, .seg button { transition: none; } }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
          padding: 12px 16px 10px; margin-bottom: 12px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 4px; }
  .panel-head .name { font-weight: 600; font-size: 14.5px; color: var(--text-primary); }
  .panel-head .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .panel-head .meta { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .panel-head .share-bar { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .panel-head .share-bar .track { position: relative; width: 120px; height: 10px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .panel-head .share-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--violet); border-radius: 2px; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 3px 12px; margin: 0 0 4px; font-size: 12px; color: var(--text-secondary); }
  .legend-row span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-row i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart { height: 150px; }

  details summary { cursor: pointer; color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 7px; border-bottom: 1px solid var(--border); }
  th:first-child, th:nth-child(2), td:first-child, td:nth-child(2) { text-align: left; }
  th { color: var(--text-secondary); font-weight: 500; position: sticky; top: 0; background: var(--surface-1); }

  ul.notes { margin: 6px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px; }
  footer { color: var(--text-muted); font-size: 12px; margin-top: 8px; }

  return `<section class="card" data-panel="${i}">

  const yMax = isShare ? Math.ceil(maxY * 110) / 100 : Math.max(5, Math.ceil(maxY * 1.1));
  const traces = skills.map((s, j) => ({
    x: D.quarters,
    y: M.y(s),
    type: "scatter",
    mode: "lines",
    name: s.name,
    line: { color: css(SLOTS[j]), width: 1.8, shape: "spline", smoothing: 0.6 },
    connectgaps: false,
    customdata: M.hover(s).map(n => n == null ? "" : (isShare ? fmtN(n) : fmtPct1(n))),
    hovertemplate: isShare
      ? `<b>${s.name}</b>: %{y:.1%} (%{customdata} postings)<extra></extra>`
      : `<b>${s.name}</b>: %{y:,} postings (%{customdata} of AI postings)<extra></extra>`,
  }));
  Plotly.react(`pc${i}`, traces, baseLayout(yMax, M.tickformat), { displayModeBar: false, responsive: true });
}

function renderPanels() {
  const groups = D.dims[dimKey].groups;
  const shareMax = Math.max(...groups.map(g => g.ai_share), 1e-6);
  $("panels").innerHTML = groups.map((_, i) => panelHtml(i)).join("");
  groups.forEach((g, i) => renderPanel(i, g, shareMax));
  renderTable(groups);
}

function renderTable(groups) {
  const isShare = measureKey === "share";
  const cell = v => isShare ? fmtPct1(v) : (v == null ? "–" : fmtN(v));
  const rows = [];
  rows.push(`<thead><tr><th>${D.dims[dimKey].label}</th><th>AI skill</th>` +
    D.quarters.map(q => `<th>${q}</th>`).join("") + `</tr></thead><tbody>`);
  groups.forEach(g => {
    const label = (g.id && g.id !== g.name) ? `${g.id} ${g.name}` : g.name;
    g.top_skills.forEach((s, j) => {
      const vals = isShare ? s.series : s.series_n;
      rows.push(`<tr>` +
        `<td>${j === 0 ? label : ""}</td>` +
        `<td>${s.name}</td>` +
        vals.map(v => `<td>${cell(v)}</td>`).join("") +
        `</tr>`);
    });
  });
  rows.push("</tbody>");
  $("table").innerHTML = rows.join("");
}

function renderNotes() {
  $("notes").innerHTML = D.notes.map(s => `<li>${s}</li>`).join("");
  $("source").textContent = D.source;
}

function buildSeg(segId, keys, labelOf, getState, setState) {
  const seg = $(segId);
  seg.style.setProperty("--n", keys.length);
  seg.insertAdjacentHTML("beforeend", keys.map(k =>
    `<button type="button" role="radio" data-k="${k}">${labelOf(k)}</button>`).join(""));
  const buttons = [...seg.querySelectorAll("button")];
  const choose = (k, focus) => {
    setState(k);
    const i = keys.indexOf(k);
    seg.style.setProperty("--i", i);
    buttons.forEach((b, j) => { b.setAttribute("aria-checked", j === i); b.tabIndex = j === i ? 0 : -1; });
    if (focus) buttons[i].focus();
    renderPanels();
  };
  buttons.forEach(b => b.onclick = () => { if (b.dataset.k !== getState()) choose(b.dataset.k); });
  seg.onkeydown = e => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    const n = keys.length, i = (keys.indexOf(getState()) + step + n) % n;
    choose(keys[i], true);
  };
  const i0 = keys.indexOf(getState());
  seg.style.setProperty("--i", i0);
  buttons.forEach((b, j) => { b.setAttribute("aria-checked", j === i0); b.tabIndex = j === i0 ? 0 : -1; });
}

function renderAll() { renderHeader(); renderPanels(); renderNotes(); }

buildSeg("dim", Object.keys(D.dims), k => D.dims[k].label,
         () => dimKey, k => { dimKey = k; });
buildSeg("measure", MEASURE_KEYS, k => MEASURES[k].label,
         () => measureKey, k => { measureKey = k; });
renderAll();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
</script>
</body>
