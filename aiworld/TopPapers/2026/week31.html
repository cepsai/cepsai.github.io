<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papers of the Week</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="resources/styles.css">
</head>

<body>
    <img src="resources/logo.svg" id="corner-logo" alt="Logo">
    <div id="bg-layer"></div>

    <div class="main-title">NOTABLE AI RESEARCH PAPERS</div>
    <div class="subtitle">WEEKLY BRIEF</div>

    <div class="crystal-window" id="crystal-window">
    </div>

    <div id="version-display"></div>

    <script>
        const version = "1.1.0";
        const week = "2026-31";
        document.querySelector('.subtitle').textContent += ` #${week}`;
        const data = [
            {
                "title": "Learning skillful medium-range global weather forecasting",
                "authors": "Remi Lam, Alvaro Sanchez-Gonzalez, Matthew Willson et",
                "icon": "fa-solid fa-cloud-sun-rain",
                "url": "https://doi.org/10.1126/science.adi2336"
            },
            {
                "title": "Accurate medium-range global weather forecasting with 3D neural networks",
                "authors": "Kaifeng Bi, Lingxi Xie, Hengheng Zhang et al.",
                "icon": "fa-solid fa-globe",
                "url": "https://doi.org/10.1038/s41586-023-06185-3"
            },
            {
                "title": "Probabilistic weather forecasting with machine learning. Nature",
                "authors": "Ilan Price, Alvaro Sanchez-Gonzalez, Ferran Alet et al.",
                "icon": "fa-solid fa-dice",
                "url": "https://doi.org/10.1038/s41586-024-08252-9"
            },
            {
                "title": "A foundation model for the Earth system",
                "authors": "Cristian Bodnar, Wessel Bruinsma, Ana Lucic et al.",
                "icon": "fa-solid fa-earth-americas",
                "url": "https://doi.org/10.1038/s41586-025-09005-y"
            },
            {
                "title": "Neural general circulation models for weather and climate",
                "authors": "Dmitrii Kochkov, Janni Yuval, Ian Langmore et al.",
                "icon": "fa-solid fa-robot",
                "url": "https://doi.org/10.1038/s41586-024-07744-y"
            }
        ];

        const container = document.getElementById('crystal-window');

        data.forEach(item => {
            const row = document.createElement('a');
            row.className = 'row';
            row.href = item.url;
            row.target = '_blank';
            row.rel = 'noopener noreferrer';

            const iconContainer = document.createElement('div');
            iconContainer.className = 'icon-container';
            iconContainer.innerHTML = `<i class="${item.icon}"></i>`;

            const titleContainer = document.createElement('div');
            titleContainer.className = 'title-container';
            titleContainer.innerHTML = `
                <div class="paper-title">${item.title}</div>
                <div class="paper-authors"><span class="author-name">${item.authors}</span></div>
            `;

            row.appendChild(iconContainer);
            row.appendChild(titleContainer);
            container.appendChild(row);
        });

        const [year, weekNum] = week.split('-');
        const mobileLabel = document.createElement('div');
        mobileLabel.className = 'mobile-label';
        mobileLabel.innerHTML = `Week ${weekNum},<br>${year}`;
        container.insertBefore(mobileLabel, container.firstChild);

        const versionDisplay = document.getElementById('version-display');
        versionDisplay.textContent = `v${version}`;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'v' || e.key === 'V') versionDisplay.classList.add('visible');
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'v' || e.key === 'V') versionDisplay.classList.remove('visible');
        });
    </script>
</body>

</html>
