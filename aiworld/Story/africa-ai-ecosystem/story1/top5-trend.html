<!doctype html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI startups in Africa</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { --breakpoint-compact: 500px; }            /* MUST equal BREAKPOINT_COMPACT in JS */
  html,body { margin:0; height:100vh; width:100vw; overflow:hidden; color:#0f172a; background:#fff;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Helvetica,Arial,sans-serif; }
  .viz-grid { display:grid; height:100vh; box-sizing:border-box; padding-bottom:clamp(8px,2vh,18px);
    grid-template-rows:16fr 1fr 1fr; grid-template-columns:auto minmax(0,1fr) auto; }   /* footer: source | footnote | logo */
  #container1 { grid-column:1 / -1; display:flex; flex-direction:column; min-height:0; }
  #viz { width:100%; flex:1 1 auto; min-height:0; }
  /* subtitle: same style as the country map's subtitle; the story page carries the headline */
  #title-block { padding:clamp(6px,2vh,20px) clamp(8px,2vw,24px) 0; }
  /* view switch centred under the chart, inside the chart cell (auto height, the SVG takes the rest) */
  #switch-row { flex:0 0 auto; display:flex; justify-content:center; padding:clamp(2px,0.8vh,8px) 0; }
  #title-block .subtitle { font-size:clamp(10px,1.5vw,15px); font-weight:600; color:#475569; }
  .selector-group { display:flex; align-items:center; justify-content:center;
    gap:clamp(2px,0.5vw,6px); padding:clamp(2px,0.4vw,4px);
    border-radius:6px; border:1px solid rgba(17,24,39,0.15); background:#f8fafc;
    max-width:100%; flex-shrink:1; min-width:0; }
  .selector-button { border:none; background:transparent; border-radius:6px;
    padding:clamp(4px,0.8vh,8px) clamp(8px,1.5vw,14px);
    font-size:clamp(9px,1.4vw,13px); font-weight:600; color:#475569;
    cursor:pointer; white-space:nowrap; min-width:0;
    transition:background 0.2s ease, color 0.2s ease; }
  .selector-button.active { background:#2756d3; color:#fff; }
  #container2 { grid-column:1 / -1; display:flex; align-items:center; justify-content:center; min-height:0; }
  #legend { display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(4px,1vw,14px); }
  .legend-item { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    font-size:clamp(9px,1.3vw,13px); font-weight:600; color:#333; padding:2px 4px; border-radius:4px; }
  .legend-item:focus-visible { outline:2px solid #2756d3; }
  .legend-item[aria-pressed="false"] { opacity:0.35; }
  .legend-item svg { flex:0 0 auto; }
  .legend-total { cursor:default; }
  /* footnote: middle column of the footer row, between source and logo; ellipsised, full text on hover */
  #container5 { grid-column:2; display:flex; align-items:center; justify-content:center; min-width:0; min-height:0;
    font-size:clamp(8px,1.2vw,12px); color:#475569; overflow:hidden; }
  #container5 span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* source (left): width-scaled, vertically centred, ellipsised so a long source never wraps the row */
  #container3 { font-size:clamp(5px,1.6vw,16px); display:flex; align-items:center; justify-content:flex-start;
    padding:0 20px; overflow:hidden; min-width:0; }
  #container3 #source-text { font-weight:600; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #container3 #source-text a { color:#2756d3; text-decoration:underline; }
  /* logo (right): fills the footer row height */
  #container4 { display:flex; justify-content:flex-end; align-items:center; padding:0 20px; overflow:hidden; min-width:0; }
  #container4 a { height:100%; display:flex; align-items:center; }
  #container4 img { height:100%; width:auto; max-height:100%; max-width:100%; object-fit:contain; }
  #tooltip { position:fixed; pointer-events:none; display:none; background:#fff; z-index:10;
    border:1px solid #DBDBDB; padding:6px 8px; font-size:12px; border-radius:4px; line-height:1.45; }
  #tooltip table { border-collapse:collapse; }
  #tooltip td { padding:0 4px; } #tooltip td.num { text-align:right; font-variant-numeric:tabular-nums; }
  #tooltip .swatch { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; }
  .axis text { font-size:clamp(9px,1.3vw,13px); font-weight:600; fill:#333; }
  .axis path, .axis line { stroke:#94a3b8; }
  .grid line { stroke:#DBDBDB; stroke-dasharray:2,3; } .grid path { display:none; }
  .error-box { position:fixed; top:8px; left:8px; background:#fee2e2; color:#991b1b; padding:6px 10px;
    border:1px solid #fca5a5; border-radius:4px; font-size:12px; }
  /* Short iframe / "snapshot" embed: drop ALL chrome; chart alone fills the frame. */
  @media (max-height:500px){
    .viz-grid { grid-template-rows:1fr !important; grid-template-columns:1fr !important; padding-bottom:0; }
    #container1 { grid-row:1 !important; grid-column:1 / -1 !important; }
    #container2,#container3,#container4,#container5 { display:none !important; }
  }
</style></head><body>
<div class="viz-grid">
  <div id="container1">
    <div id="title-block"><div class="subtitle"></div></div>
    <div id="viz"></div>
    <div id="switch-row"><div class="selector-group" id="view-switch" role="group" aria-label="Chart view"></div></div>
  </div>
  <div id="container5"><span id="footnote"></span></div>
  <div id="container2"><div id="legend"></div></div>
  <div id="container3"><span id="source-text"></span></div>
  <div id="container4"><a href="https://aiworld.eu/" target="_blank" rel="noopener"><img src="https://aiworld.eu/logo-transparent.svg" alt="AI World"></a></div>
</div>
<div id="tooltip"></div>
<script>
// ---- CONFIG: declare everything; nothing implicit ----
const SHOW_CONTAINER_2 = 1, SHOW_CONTAINER_3 = 1, SHOW_CONTAINER_4 = 1, SHOW_CONTAINER_5 = 1;
const SHOW_TOOLTIP = 1;
const BREAKPOINT_COMPACT = 500;                       // px; MUST equal --breakpoint-compact
const SOURCE_NAME = "Crunchbase", SOURCE_HREF = "https://www.crunchbase.com/";
const RECENT_FROM = 2021;                  // first founding year counted
const SNAPSHOT_LABEL = "23 Sep 2026";          // data cut-off; the last year is partial
const LAST_GAP = 0.5;                                 // x gap before the partial last year, as a share of a full year gap
const GROUP_ORDER = ["Nigeria", "South Africa", "Kenya", "Egypt", "Morocco", "Rest of Africa"];                  // top countries by count, then the rest; bottom-to-top in the stack
const DATA = [{"year": 2021, "group": "Egypt", "n": 16}, {"year": 2021, "group": "Kenya", "n": 22}, {"year": 2021, "group": "Morocco", "n": 11}, {"year": 2021, "group": "Nigeria", "n": 40}, {"year": 2021, "group": "Rest of Africa", "n": 72}, {"year": 2021, "group": "South Africa", "n": 44}, {"year": 2022, "group": "Egypt", "n": 32}, {"year": 2022, "group": "Kenya", "n": 28}, {"year": 2022, "group": "Morocco", "n": 18}, {"year": 2022, "group": "Nigeria", "n": 61}, {"year": 2022, "group": "Rest of Africa", "n": 105}, {"year": 2022, "group": "South Africa", "n": 56}, {"year": 2023, "group": "Egypt", "n": 27}, {"year": 2023, "group": "Kenya", "n": 34}, {"year": 2023, "group": "Morocco", "n": 31}, {"year": 2023, "group": "Nigeria", "n": 74}, {"year": 2023, "group": "Rest of Africa", "n": 100}, {"year": 2023, "group": "South Africa", "n": 67}, {"year": 2024, "group": "Egypt", "n": 38}, {"year": 2024, "group": "Kenya", "n": 40}, {"year": 2024, "group": "Morocco", "n": 22}, {"year": 2024, "group": "Nigeria", "n": 76}, {"year": 2024, "group": "Rest of Africa", "n": 113}, {"year": 2024, "group": "South Africa", "n": 49}, {"year": 2025, "group": "Egypt", "n": 27}, {"year": 2025, "group": "Kenya", "n": 26}, {"year": 2025, "group": "Morocco", "n": 18}, {"year": 2025, "group": "Nigeria", "n": 77}, {"year": 2025, "group": "Rest of Africa", "n": 82}, {"year": 2025, "group": "South Africa", "n": 60}, {"year": 2026, "group": "Egypt", "n": 12}, {"year": 2026, "group": "Kenya", "n": 8}, {"year": 2026, "group": "Morocco", "n": 6}, {"year": 2026, "group": "Nigeria", "n": 25}, {"year": 2026, "group": "Rest of Africa", "n": 22}, {"year": 2026, "group": "South Africa", "n": 13}];                                // new companies per founding year: [{year, group, n}]
// views of the switch; ?view=new opens the per-year view directly (one file can back two story charts)
const VIEWS = [
  { key: "cumulative", label: "Cumulative", subtitle: `Cumulative number of AI companies founded since ${RECENT_FROM}` },
  { key: "new",        label: "New per year", subtitle: `AI companies founded per year since ${RECENT_FROM}` },
];
// ranked countries get Blues from dark to light; the grouped rest is neutral slate (darker as a line, to stay visible)
const RANK_COLORS = ["#08306b","#08519c","#3182bd","#6baed6","#9ecae1"], REST_COLOR = "#cbd5e1", REST_LINE_COLOR = "#94a3b8";
const COLORS = Object.fromEntries(GROUP_ORDER.map((g, i) => [g, i < RANK_COLORS.length && i < GROUP_ORDER.length - 1 ? RANK_COLORS[i] : REST_COLOR]));
const TOTAL_COLOR = "#0f172a";
const TOTAL_BAR_COLOR = "#e2e8f0", TOTAL_BAR_PARTIAL = "#f1f5f9";   // per-year view: faint total bars behind the lines

const fmtInt = d3.format(",");
const YEARS = d3.range(RECENT_FROM, d3.max(DATA, d => d.year) + 1);
const LAST_YEAR = YEARS[YEARS.length - 1];
// x position on a continuous year axis: the partial last year sits closer to the previous one
const xPos = d => d.year < LAST_YEAR ? d.year : LAST_YEAR - 1 + LAST_GAP;
const yearLabel = y => y === LAST_YEAR ? `${y}*` : String(y);
const newCount = new Map(DATA.map(d => [`${d.group}|${d.year}`, d.n]));   // O(1) lookup in render
const activeGroups = new Set(GROUP_ORDER);
const SHOW_VIEW_SWITCH = 0;        // 0 = cumulative-only copy: no switch, ?view is ignored
const requestedView = new URLSearchParams(location.search).get("view");
let currentView = SHOW_VIEW_SWITCH && VIEWS.some(v => v.key === requestedView) ? requestedView : "cumulative";
if (!SHOW_VIEW_SWITCH) document.getElementById("switch-row").style.display = "none";
const isCumulative = () => currentView === "cumulative";
const colorFor = g => !isCumulative() && COLORS[g] === REST_COLOR ? REST_LINE_COLOR : COLORS[g];

const footnote = document.getElementById("footnote");
footnote.textContent = `* ${LAST_YEAR} up to ${SNAPSHOT_LABEL} (data snapshot). Companies without a founding date are not counted.`;
footnote.title = footnote.textContent;
document.getElementById("source-text").innerHTML =
  'Source: <a href="'+SOURCE_HREF+'" target="_blank" rel="noopener">'+SOURCE_NAME+'</a>';

// Show only the footer rows whose flag is on, then recompute grid rows.
(function applyContainerVisibility(){
  const grid = document.querySelector(".viz-grid"), c = n => document.getElementById("container"+n);
  const c2=c(2), c3=c(3), c4=c(4), c5=c(5);
  if (c2 && !SHOW_CONTAINER_2) c2.style.display="none";
  if (c3 && !SHOW_CONTAINER_3) c3.style.display="none";
  if (c4 && !SHOW_CONTAINER_4) c4.style.display="none";
  if (c5 && !SHOW_CONTAINER_5) c5.style.display="none";
  // container5 (footnote) shares the footer row with source and logo instead of taking its own row
  const rowLegend=SHOW_CONTAINER_2, rowFooter=SHOW_CONTAINER_3||SHOW_CONTAINER_4||SHOW_CONTAINER_5;
  const rows=[]; let r=1;
  rows.push((20-(rowLegend?1:0)-(rowFooter?1:0))+"fr");
  if (rowLegend) { rows.push("1fr"); r++; if (c2) c2.style.gridRow=r; }
  if (rowFooter) { rows.push("1fr"); r++;
    if (SHOW_CONTAINER_3 && c3) { c3.style.gridRow=r; c3.style.gridColumn="1"; }
    if (SHOW_CONTAINER_5 && c5) c5.style.gridRow=r;
    if (SHOW_CONTAINER_4 && c4) { c4.style.gridRow=r; c4.style.gridColumn="3"; }
  }
  grid.style.gridTemplateRows = rows.join(" ");
  c(1).style.gridRow = "1";
})();

// Segmented view switch: cumulative stack vs. new companies per year.
function buildViewSwitch(){
  const container = document.getElementById("view-switch");
  container.innerHTML = "";
  VIEWS.forEach(v => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "selector-button";
    btn.textContent = v.label; btn.dataset.view = v.key;
    btn.title = v.subtitle; btn.setAttribute("aria-label", v.label);
    btn.addEventListener("click", () => {
      if (v.key === currentView) return;
      currentView = v.key;
      updateViewState(); buildLegend(); render();
    });
    container.appendChild(btn);
  });
  updateViewState();
}
function updateViewState(){
  document.querySelectorAll("#view-switch .selector-button").forEach(btn => {
    const isActive = btn.dataset.view === currentView;
    btn.classList.toggle("active", isActive);
    btn.setAttribute("aria-pressed", isActive);
  });
  document.querySelector("#title-block .subtitle").textContent = VIEWS.find(v => v.key === currentView).subtitle;
}

// Interactive legend: toggles a country group in or out of the chart. Area swatch or line+dot swatch per view.
function buildLegend(){
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  GROUP_ORDER.forEach(g => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.setAttribute("role", "button"); item.setAttribute("tabindex", "0");
    const swatch = isCumulative()
      ? `<svg width="12" height="12"><rect width="12" height="12" rx="2" fill="${colorFor(g)}"></rect></svg>`
      : `<svg width="20" height="12"><line x1="1" x2="19" y1="6" y2="6" stroke="${colorFor(g)}" stroke-width="2"></line>` +
        `<circle cx="10" cy="6" r="3" fill="#fff" stroke="${colorFor(g)}" stroke-width="2"></circle></svg>`;
    item.innerHTML = `${swatch}<span>${g}</span>`;
    const toggle = () => {
      if (activeGroups.has(g)) { if (activeGroups.size > 1) activeGroups.delete(g); } else activeGroups.add(g);
      updateLegendState(); render();
    };
    item.addEventListener("click", toggle);
    item.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    item.dataset.group = g;
    legend.appendChild(item);
  });
  // per-year view: a fixed (non-toggle) entry explaining the grey total bars
  if (!isCumulative()) {
    const total = document.createElement("div");
    total.className = "legend-item legend-total";
    total.innerHTML = `<svg width="12" height="12"><rect width="12" height="12" rx="2" fill="${TOTAL_BAR_COLOR}" stroke="#cbd5e1"></rect></svg><span>Total</span>`;
    legend.prepend(total);
  }
  updateLegendState();
}
function updateLegendState(){
  document.querySelectorAll(".legend-item:not(.legend-total)").forEach(el => el.setAttribute("aria-pressed", activeGroups.has(el.dataset.group)));
}

const tooltip = d3.select("#tooltip");
const vizContainer = document.getElementById("viz");
let firstRender = true;

function render(){
  d3.select("#viz").selectAll("*").remove();
  const rect = vizContainer.getBoundingClientRect();
  if (rect.width < 50 || rect.height < 50) return;
  const compact = window.matchMedia(`(max-height:${BREAKPOINT_COMPACT}px)`).matches;
  const narrow = rect.width < 520;
  const cumulative = isCumulative();

  const groups = GROUP_ORDER.filter(g => activeGroups.has(g));
  // per founding year: cumulative count per group (row[g]) and new companies per group (row.added_by[g])
  const rows = YEARS.map(year => {
    const row = { year, added_by: {} };
    groups.forEach(g => {
      row[g] = d3.sum(YEARS.filter(y => y <= year), y => newCount.get(`${g}|${y}`) || 0);
      row.added_by[g] = newCount.get(`${g}|${year}`) || 0;
    });
    row.total = d3.sum(groups, g => row[g]);
    row.added = d3.sum(groups, g => row.added_by[g]);
    return row;
  });
  const totalValue = d => cumulative ? d.total : d.added;
  const groupValue = (d, k) => cumulative ? d[k] : d.added_by[k];
  const maxY = d3.max(rows, totalValue);   // per-year view: the faint total bars share the axis with the country lines

  const svg = d3.select("#viz").append("svg").attr("width", rect.width).attr("height", rect.height);
  const y = d3.scaleLinear().domain([0, maxY * 1.08]).nice();
  const lastPos = xPos({ year: LAST_YEAR });
  const X_DOMAIN = [RECENT_FROM - 0.15, lastPos + 0.15];   // small insets so the end points are not on the frame

  // margins from the longest tick label (left) and the longest direct label (right; cumulative view only)
  const measure = svg.append("text").attr("class", "axis").style("font-size", "13px").style("font-weight", 600);
  const textWidth = s => { measure.text(s); return measure.node().getComputedTextLength(); };
  const tickW = d3.max(y.ticks(6).map(fmtInt), textWidth);
  const labelW = narrow || !cumulative ? 0 : d3.max(groups, g => textWidth(g)) + 14;
  measure.remove();
  const margin = { top: compact ? 22 : 28, right: Math.max(labelW, 24), bottom: 30, left: tickW + 18 };
  const innerW = rect.width - margin.left - margin.right, innerH = rect.height - margin.top - margin.bottom;
  y.range([innerH, 0]);
  const x = d3.scaleLinear().domain(X_DOMAIN).range([0, innerW]);

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
  g.append("g").attr("class", "grid").call(d3.axisLeft(y).ticks(6).tickSize(-innerW).tickFormat(""));
  g.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(6).tickFormat(fmtInt).tickSizeOuter(0))
    .call(a => a.select(".domain").remove());
  g.append("g").attr("class", "axis").attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).tickValues(rows.map(xPos)).tickSizeOuter(0).tickFormat((v, i) => yearLabel(rows[i].year)));

  // clip used for the left-to-right reveal on first render
  const clipId = "reveal-clip";
  const clipRect = svg.append("defs").append("clipPath").attr("id", clipId)
    .append("rect").attr("x", -2).attr("y", -margin.top).attr("height", innerH + margin.top + 2).attr("width", innerW + 4);
  const plot = g.append("g").attr("clip-path", `url(#${clipId})`);

  // a line through all years: solid for complete years, dashed into the partial last year
  const drawLine = (value, color, width) => {
    const line = d3.line().x(d => x(xPos(d))).y(d => y(value(d))).curve(d3.curveMonotoneX);
    plot.append("path").datum(rows.slice(0, -1)).attr("d", line)
      .attr("fill", "none").attr("stroke", color).attr("stroke-width", width);
    plot.append("path").datum(rows.slice(-2)).attr("d", line)
      .attr("fill", "none").attr("stroke", color).attr("stroke-width", width).attr("stroke-dasharray", "5,4");
    plot.append("g").selectAll("circle").data(rows).join("circle")
      .attr("cx", d => x(xPos(d))).attr("cy", d => y(value(d))).attr("r", 3)
      .attr("fill", "#fff").attr("stroke", color).attr("stroke-width", 2);
  };

  if (cumulative) {
    const series = d3.stack().keys(groups)(rows);
    const area = d3.area().x(d => x(xPos(d.data))).y0(d => y(d[0])).y1(d => y(d[1])).curve(d3.curveMonotoneX);
    plot.selectAll(".band").data(series).join("path").attr("class", "band")
      .attr("d", area).attr("fill", s => colorFor(s.key)).attr("stroke", "#fff").attr("stroke-width", 1);
    drawLine(totalValue, TOTAL_COLOR, 2);
  } else {
    // faint total bars as context behind the country lines; the partial last year is lighter with a dashed outline.
    // Width stays inside the narrower gap before the partial year.
    const barW = Math.min(44, (x(RECENT_FROM + 1) - x(RECENT_FROM)) * LAST_GAP * 0.7);
    plot.selectAll(".total-bar").data(rows).join("rect").attr("class", "total-bar")
      .attr("x", d => x(xPos(d)) - barW / 2).attr("width", barW)
      .attr("y", d => y(d.added)).attr("height", d => innerH - y(d.added))
      .attr("fill", d => d.year === LAST_YEAR ? TOTAL_BAR_PARTIAL : TOTAL_BAR_COLOR)
      .attr("stroke", d => d.year === LAST_YEAR ? "#94a3b8" : "none").attr("stroke-dasharray", "3,2");
    // smallest groups first so the larger lines are drawn on top
    groups.slice().reverse().forEach(k => drawLine(d => d.added_by[k], colorFor(k), 2));
  }

  const labels = g.append("g");
  if (cumulative) {
    labels.selectAll(".total-label").data(rows).join("text").attr("class", "total-label")
      .attr("x", d => x(xPos(d))).attr("y", d => y(d.total) - 9).attr("text-anchor", "middle")
      .style("font-size", "clamp(9px,1.3vw,13px)").style("font-weight", 700).attr("fill", TOTAL_COLOR)
      .text(d => fmtInt(d.total));
  } else {
    // total on top of each bar, in muted slate so it reads as context, not as a series
    labels.selectAll(".total-label").data(rows).join("text").attr("class", "total-label")
      .attr("x", d => x(xPos(d))).attr("y", d => y(d.added) - 6).attr("text-anchor", "middle")
      .style("font-size", "clamp(9px,1.3vw,13px)").style("font-weight", 700).attr("fill", "#475569")
      .text(d => fmtInt(d.added));
  }

  // direct labels at the right edge, centred on each band; skipped when a band is too thin.
  // Not used for the per-year lines: their end points crowd together, so the legend and tooltip carry the names.
  if (cumulative && !narrow) {
    const last = d3.stack().keys(groups)(rows)
      .map(s => ({ key: s.key, y0: y(s[s.length - 1][0]), y1: y(s[s.length - 1][1]) }))
      .filter(d => d.y0 - d.y1 >= 12);
    labels.selectAll(".band-label").data(last).join("text").attr("class", "band-label")
      .attr("x", x(lastPos) + 8).attr("y", d => (d.y0 + d.y1) / 2).attr("dy", "0.35em")
      .style("font-size", "clamp(9px,1.2vw,12px)").style("font-weight", 600).attr("fill", "#333")
      .text(d => d.key);
  }

  // hover: snaps to the nearest year with a vertical rule and a breakdown tooltip
  if (SHOW_TOOLTIP) {
    const rule = g.append("line").attr("y1", 0).attr("y2", innerH).attr("stroke", "#475569")
      .attr("stroke-width", 1).attr("stroke-dasharray", "2,3").style("display", "none");
    g.append("rect").attr("width", innerW).attr("height", innerH).attr("fill", "transparent")
      .on("mousemove", event => {
        const mx = d3.pointer(event)[0];
        const d = d3.least(rows, r => Math.abs(x(xPos(r)) - mx));
        rule.style("display", null).attr("x1", x(xPos(d))).attr("x2", x(xPos(d)));
        const body = groups.slice().reverse().map(k =>
          `<tr><td><span class="swatch" style="background:${colorFor(k)}"></span>${k}</td><td class="num">${fmtInt(groupValue(d, k))}</td></tr>`).join("");
        const header = cumulative
          ? `<strong>End of ${yearLabel(d.year)}</strong><br>Total: <strong>${fmtInt(d.total)}</strong> (+${fmtInt(d.added)} founded in ${d.year})`
          : `<strong>Founded in ${yearLabel(d.year)}</strong><br>Total: <strong>${fmtInt(d.added)}</strong>`;
        tooltip.style("display", "block").html(`${header}<table>${body}</table>`);
        const tip = tooltip.node().getBoundingClientRect();
        const left = event.clientX + 14 + tip.width > window.innerWidth ? event.clientX - tip.width - 14 : event.clientX + 14;
        tooltip.style("left", `${left}px`).style("top", `${Math.max(4, Math.min(event.clientY - 10, window.innerHeight - tip.height - 4))}px`);
      })
      .on("mouseleave", () => { rule.style("display", "none"); tooltip.style("display", "none"); });
  }

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (firstRender && !reducedMotion) {
    clipRect.attr("width", 0).transition().duration(850).ease(d3.easeCubicOut).attr("width", innerW + 4);
    labels.attr("opacity", 0).transition().delay(950).duration(300).attr("opacity", 1);
  }
  firstRender = false;                                  // no animation on resize, legend or view redraws
}

try { buildViewSwitch(); buildLegend(); render(); }
catch (err) {
  const box = document.createElement("div"); box.className = "error-box";
  box.textContent = "Could not render the chart: " + err.message; document.body.appendChild(box);
}

let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 220); });
if (typeof ResizeObserver !== "undefined")
  new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 220); }).observe(vizContainer);
</script></body></html>
