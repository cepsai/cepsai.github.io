<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task success by model, DeepSWE vs MaxxBench</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
        --fs-control:  clamp(9px, 1.4vw, 13px);
        --fs-legend:   clamp(0.625rem, 1.4vw, 1rem);
        --fs-meta:     clamp(10px, 1.6vw, 16px);
        --fs-slider:   clamp(11px, 1.2vw, 13px);
        --breakpoint-compact: 500px;
    }

    html, body {
        height: 100%;
    }

    body {
        margin: 0;
        overflow: hidden;
        height: 100vh;
    }

    .viz-grid {
        display: grid;
        grid-template-rows: 16fr 1fr 1fr;
        grid-template-columns: 1fr 1fr;
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
        padding-bottom: clamp(8px, 2vh, 18px);
    }

    #container1 {
        grid-row: 1;
        grid-column: 1 / span 2;
        overflow: hidden;
        min-height: 0;
    }

    #container1 .chart-wrapper {
        flex: 1 1 auto;
        display: flex;
        min-width: 0;
        height: 100%;
        margin-left: 0;
    }

    #container1 .chart-wrapper-inner {
        flex: 1 1 auto;
        display: flex;
        min-width: 0;
        height: 100%;
    }

    #container2 {
        grid-row: 2;
        grid-column: 1 / span 2;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    #container3 {
        grid-row: 3;
        grid-column: 1;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 0 20px;
        overflow: hidden;
        min-width: 0;
    }

    #container4 {
        grid-row: 3;
        grid-column: 2;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 20px;
        overflow: hidden;
        min-width: 0;
    }

    #container5 {
        grid-column: 1 / span 2;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 20px;
        overflow: hidden;
        min-width: 0;
    }

    #container4 a {
        height: 100%;
        display: flex;
        align-items: center;
        cursor: default;
    }

    #viz {
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
    }

    #chart {
        display: block;
        width: 100%;
        height: 100%;
    }

    #tooltip {
        position: fixed;
        pointer-events: none;
        padding: 8px 12px;
        font-size: 12px;
        line-height: 1.4;
        opacity: 0;
        transition: opacity 0.15s ease;
        max-width: 240px;
        z-index: 1100;
    }

    #tooltip .t-name { display: block; margin-bottom: 2px; }
    #tooltip .t-count { display: block; margin-top: 2px; font-variant-numeric: tabular-nums; }
    #tooltip .t-meta { display: block; margin-top: 1px; }
    #tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; }
    #tooltip .t-v { font-variant-numeric: tabular-nums; }

    .legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1vw, 14px);
        padding: clamp(4px, 1vh, 10px) clamp(10px, 2vw, 16px);
        max-width: 100%;
        max-height: 100%;
        font-size: var(--fs-legend);
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: clamp(4px, 1vw, 8px);
        font-size: inherit;
        padding: 2px 6px;
        cursor: default;
    }

    .legend-item.interactive {
        cursor: pointer;
        transition: opacity 0.2s ease;
    }

    .legend-item.dim {
        opacity: 0.35;
    }

    .legend-item:focus-visible {
        outline-offset: 2px;
    }

    .legend-square {
        flex-shrink: 0;
    }

    .legend-sep {
        width: 1px;
        height: 16px;
        margin: 0 8px;
        flex-shrink: 0;
    }

    .source-text {
        font-size: var(--fs-meta);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    .source-text a {
        cursor: pointer;
        display: inline-block;
        transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .32s cubic-bezier(.4,0,.2,1);
    }

    .source-text a.slide-out { transform: translateY(12px);  opacity: 0; }
    .source-text a.slide-in  { transform: translateY(-12px); opacity: 0; transition: none; }

    .src-switch #container3,
    .src-switch .source-text { overflow: visible; }

    .logo {
        height: 100%;
        width: auto;
        max-height: 100%;
        max-width: 100%;
        pointer-events: auto;
        object-fit: contain;
    }

    a .logo,
    .logo a {
        cursor: pointer;
    }

    .grid-lines path {
        stroke: none;
    }

    .text-halo {
        paint-order: stroke;
        stroke-linejoin: round;
    }

    @media (max-height: 500px) {
        /* banner: chart plus a one-line legend, no source or logo */
        .viz-grid {
            grid-template-rows: 1fr auto !important;
            grid-template-columns: 1fr !important;
            padding-bottom: 0;
        }

        #container1 {
            grid-row: 1 !important;
            grid-column: 1 !important;
        }

        #container2 {
            grid-row: 2 !important;
            grid-column: 1 !important;
        }

        #container3,
        #container4,
        #container5 {
            display: none !important;
        }

        .legend {
            flex-wrap: nowrap;
            padding: 2px 8px 4px;
            gap: 4px;
            font-size: 10px;
        }

        .legend-item { padding: 0 4px; gap: 4px; }
        .legend-sep { height: 10px; margin: 0 4px; }

        .source-text,
        .logo {
            display: none !important;
        }
    }

    :root {
        --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Helvetica, Arial, sans-serif;

        --ink: #0f172a;
        --ink-2: #333;
        --muted: #4b5563;
        --faint: #9ca3af;
        --rule: #ccc;
        --grid: #DBDBDB;
        --grid-dash: 2 3;
        --paper: #fff;
        --no-data: #e5e7eb;
        --context: #e5e7eb;
        --water: #e0f2fe;
        --accent: #2756d3;
        --accent-tint: #DDE7F9;
        --hover: #0f172a;
        --highlight: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.2));
        --halo: 0 0 3px rgba(255, 255, 255, 0.95), 0 0 3px rgba(255, 255, 255, 0.95);
        --mark-sep: rgba(255, 255, 255, 0.3);
        --band: rgba(15, 23, 42, 0.05);

        --radius-ui: 6px;
        --radius-mark: 0;
        --radius-knob: 50%;

        --fw-regular: 400;
        --fw-emphasis: 600;
        --fw-title: 700;

        --fs-floor: 9px;
        --fs-small: 11px;
        --fs-tick: 11px;
        --fs-label: 13px;
        --fs-title: clamp(12px, 1.5vw, 18px);
        --fs-tip: 12px;
        --fs-tip-title: 13px;
        --fs-tip-big: 17px;
        --fs-tip-meta: 11px;

        --tip-border: 1px solid rgba(17, 24, 39, 0.08);
        --tip-shadow: 0 4px 12px rgba(0, 0, 0, 0.12);
        --tip-pad: 8px 12px;

        --legend-bg: #fff;
        --swatch-size: clamp(8px, 0.9vw, 12px);
        --focus-ring: 2px solid rgba(0, 0, 0, 0.5);

        --control-bg: #f8fafc;
        --control-border: 1px solid rgba(17, 24, 39, 0.15);

        --check-size: 14px;
        --play-bg: var(--control-bg);
        --play-ink: var(--muted);
        --play-border: var(--control-border);

        --text-halo: var(--paper);
        --text-halo-width: 3px;
        --text-halo-opacity: 0.95;

        --card-radius: var(--radius-ui);
        --card-border: 1px solid rgba(255, 255, 255, 0.12);
        --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.45);

        --footnote-style: italic;
        --footnote-align: right;
        --footnote-ink: var(--ink-2);
        --footnote-size: var(--fs-meta);
    }

    body {
        font-family: var(--font);
        color: var(--ink);
        background-color: var(--paper);
    }

    html, body, svg, svg text, button, select, input {
        font-family: var(--font) !important;
    }

    #tooltip {
        background: var(--paper);
        color: var(--ink);
        border: var(--tip-border);
        border-radius: var(--radius-ui);
        box-shadow: var(--tip-shadow);
        padding: var(--tip-pad);
        font-family: var(--font);
        font-size: var(--fs-tip);
        font-weight: var(--fw-regular);
    }

    #tooltip .t-name, #tooltip b, #tooltip strong {
        font-weight: var(--fw-title);
        color: var(--ink);
    }

    #tooltip .t-name {
        font-size: var(--fs-tip-title);
    }

    #tooltip .t-count {
        font-weight: var(--fw-title);
        font-size: var(--fs-tip-big);
        color: var(--accent);
    }

    #tooltip .t-meta {
        font-size: var(--fs-tip-meta);
        color: var(--muted);
    }

    #tooltip .t-v {
        font-weight: var(--fw-title);
    }

    .legend {
        background: var(--legend-bg);
        border-radius: var(--radius-ui);
    }

    .legend-item {
        font-weight: var(--fw-emphasis);
        color: var(--ink-2);
    }

    .legend-item:focus-visible {
        outline: var(--focus-ring);
    }

    .legend-square {
        width: var(--swatch-size);
        height: var(--swatch-size);
        border-radius: var(--radius-mark);
    }

    .legend-sep {
        background: var(--rule);
    }

    .source-text {
        font-weight: var(--fw-emphasis);
        color: var(--ink-2);
        font-style: normal;
    }

    .source-text a,
    .source-text a:visited {
        color: var(--accent);
        text-decoration: underline;
        font-style: normal;
    }

    .axis path,
    .axis line {
        stroke: var(--rule);
    }

    .tick text {
        font-family: var(--font);
        font-weight: var(--fw-emphasis);
        fill: var(--muted);
    }

    .grid-lines line {
        stroke: var(--grid);
        stroke-dasharray: var(--grid-dash);
    }

    .axis-title {
        fill: var(--ink);
        font-weight: var(--fw-title);
        font-size: var(--fs-title);
    }

    .bar-label {
        fill: var(--ink-2);
        font-weight: var(--fw-emphasis);
    }

    .empty-state {
        font-family: var(--font);
        color: var(--muted);
        fill: var(--muted);
        font-size: var(--fs-label);
    }

    .text-halo {
        stroke: var(--text-halo);
        stroke-width: var(--text-halo-width);
        stroke-opacity: var(--text-halo-opacity);
    }

    #viz { overflow-y: auto; overflow-x: hidden; }
    .dr-link { stroke: var(--rule); stroke-linecap: round; }
    .dr-head { fill: var(--rule); }
    .dr-dot { stroke: var(--paper); stroke-width: 1px; }
    .dr-value { font-size: calc(var(--fs-small) * 1.02); font-weight: var(--fw-title); font-variant-numeric: tabular-nums; }
    .dr-row, .names .tick { transition: opacity 0.15s ease; }
    .dr-row.dim, .names .tick.dim { opacity: 0.3; }
    .dr-hit { fill: transparent; pointer-events: all; cursor: pointer; }
    .names .tick text { fill: var(--ink); }
  </style>
</head>

    (function applyContainerVisibility() {
      const vizGrid = document.querySelector('.viz-grid');
      const c2 = document.getElementById('container2');
      const c3 = document.getElementById('container3');
      const c4 = document.getElementById('container4');
      const c5 = document.getElementById('container5');

      if (!SHOW_CONTAINER_2 && c2) c2.style.display = 'none';
      if (!SHOW_CONTAINER_3 && c3) c3.style.display = 'none';
      if (!SHOW_CONTAINER_4 && c4) c4.style.display = 'none';
      if (c5 && !SHOW_CONTAINER_5) c5.style.display = 'none';

      const row2Visible = SHOW_CONTAINER_2;
      const row3Visible = SHOW_CONTAINER_5;
      const row4Visible = SHOW_CONTAINER_3 || SHOW_CONTAINER_4;

      let gridRows = [];
      let currentRow = 1;
      const chartHeight = 20 - (row2Visible ? 1 : 0) - (row3Visible ? 1 : 0) - (row4Visible ? 1 : 0);
      gridRows.push(`${chartHeight}fr`);

      if (row2Visible) { gridRows.push('1fr'); currentRow++; if (c2) c2.style.gridRow = String(currentRow); }
      if (row3Visible) { gridRows.push('1fr'); currentRow++; if (c5) c5.style.gridRow = String(currentRow); }
      if (row4Visible) {
        gridRows.push('1fr'); currentRow++;
        if (SHOW_CONTAINER_3 && c3) c3.style.gridRow = String(currentRow);

      vizGrid.style.gridTemplateRows = gridRows.join(' ');
      document.getElementById('container1').style.gridRow = '1';

    };
    const LOGO_OF = [[/^Claude/, 'claude'], [/^GPT/, 'gpt'], [/^Gemini/, 'gemini'], [/^DeepSeek/, 'deepseek'], [/^GLM/, 'zai'], [/^Qwen/, 'qwen'], [/^Muse/, 'meta']];
    const logoFor = cat => { const m = LOGO_OF.find(([re]) => re.test(cat)); return m ? LOGOS[m[1]] : null; };
    const VALUE_SCALE = 1.02;  // value labels, 15% under the old 1.2
    const DOT_SCALE = 0.85;    // dots 15% smaller than the base size
    const isFlash = cat => /\b(Flash|Luna)\b/.test(cat);

    const ROWS = DATA.slice()
      .sort((p, q) => (q.a - p.a) || (q.b - p.b))
      .slice(0, MAX_ITEMS);

    document.getElementById('sw-a').style.background = LOOK.a;
    document.getElementById('sw-b').style.background = LOOK.b;
    document.getElementById('sw-flash').style.background = LOOK.flash;
    document.getElementById('source-text').innerHTML = SOURCE_HREF
      ? `Source: <a href="${SOURCE_HREF}" target="_blank" rel="noopener">${SOURCE_NAME}</a>`
      : `Source: ${SOURCE_NAME}`;

    const fmt = v => d3.format('.1f')(v);
    const fmtPct = v => d3.format('.1f')(v) + '%';
    const fmtChange = v => (v > 0 ? '+' : v < 0 ? '−' : '') + d3.format('.1f')(Math.abs(v)) + ' pp';

    let measureCtx = null;
    function textWidth(text, size, weight) {
      measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
      measureCtx.font = `${weight} ${size}px ${HOUSE.font}`;
      return measureCtx.measureText(String(text)).width;
    }

    function fitText(text, maxW, size, weight) {
      if (textWidth(text, size, weight) <= maxW) return text;
      let s = String(text);
      while (s.length > 1 && textWidth(s + '…', size, weight) > maxW) s = s.slice(0, -1);
      return s.trimEnd() + '…';
    }

    const tooltip = document.createElement('div');
    tooltip.id = 'tooltip';
    document.body.appendChild(tooltip);

    function placeTooltip(cx, cy) {
      const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
      let left = cx + 14;
      if (left + w > window.innerWidth - 4) left = Math.max(4, cx - w - 14);
      let top = cy - 24;
      top = Math.max(4, Math.min(top, window.innerHeight - h - 4));
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function showTooltip(e, d) {
      if (!SHOW_TOOLTIP) return;
      tooltip.innerHTML =
        `<span class="t-name">${d.cat}</span>` +
        (isFlash(d.cat) ? `<span class="t-meta">Lightweight model</span>` : '') +
        `<div class="t-row"><span>${SERIES_A}</span><span class="t-v">${fmtPct(d.a)}</span></div>` +
        `<div class="t-row"><span>${SERIES_B}</span><span class="t-v">${fmtPct(d.b)}</span></div>` +
        `<div class="t-row"><span>Change</span><span class="t-v">${fmtChange(d.b - d.a)}</span></div>`;
      tooltip.style.opacity = '1';
      placeTooltip(e.clientX, e.clientY);
    }

    function hideTooltip() { tooltip.style.opacity = '0'; }

    let activeCat = null;
    function setActive(cat) {
      activeCat = cat;
      d3.selectAll('.dr-row').classed('dim', d => cat != null && d.cat !== cat);
      d3.selectAll('.names .tick').classed('dim', d => cat != null && d !== cat);
    }

    function clearActive() { setActive(null); hideTooltip(); }

    document.addEventListener('click', clearActive);
    window.addEventListener('scroll', hideTooltip, true);

    const vizContainer = document.getElementById('viz');
    const c3 = document.getElementById('container3');
    const c4 = document.getElementById('container4');
    let firstRender = true;

    function render() {
      vizContainer.innerHTML = '';
      const data = ROWS;
      if (!data.length) {
        const el = document.createElement('div');
        el.className = 'empty-state';
        el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;';
        el.textContent = 'No data available';
        vizContainer.appendChild(el);
        return;
      }

      const rect = vizContainer.getBoundingClientRect();
      const width = Math.max(320, Math.floor(vizContainer.clientWidth || rect.width));
      const height = Math.max(220, Math.floor(rect.height));
      const small = width < BREAKPOINT_SIDE_KEY || window.innerHeight < BREAKPOINT_COMPACT;
      const showLabels = DOT_LABELS === 'on' || (DOT_LABELS === 'auto' && !small && data.length <= MAX_ITEMS);

      document.querySelector('.viz-grid').classList.toggle('small', small);
      c4.style.display = small ? 'none' : '';
      c3.style.gridColumn = small ? '1 / span 2' : '';

      // compact mode: every row fits the frame, names drop to 10px, logos go when rows get tight
      const fitPitch = (height - 10 - 26) / data.length;
      const showIcons = !small || fitPitch >= 18;
      const nameSize = small ? 10 : HOUSE.fs.label;
      const nameWeight = HOUSE.fw.emphasis;
      const icon = showIcons ? Math.round(Math.max(14, Math.min(20, nameSize * 1.4))) : 0;
      const iconPad = showIcons ? 6 : 0;
      const edgePad = Math.round(Math.max(6, Math.min(14, width * 0.012)));
      const nameCap = width * 0.3 - icon - iconPad;
      const nameW = Math.min(d3.max(data, d => textWidth(d.cat, nameSize, nameWeight)), nameCap);
      const names = new Map(data.map(d => [d.cat, fitText(d.cat, nameCap, nameSize, nameWeight)]));

      const nTicks = small ? 4 : 6;
      const margin = {
        top: 10,
        right: 14 + (showLabels ? 48 : 0),
        bottom: small ? 26 : 50,
        left: edgePad + nameW + icon + iconPad + 10
      };
      const innerW = Math.max(40, width - margin.left - margin.right);
      const innerH = small ? height - margin.top - margin.bottom : Math.max(height - margin.top - margin.bottom, data.length * ROW_PITCH);
      const svgH = innerH + margin.top + margin.bottom;

      const y = d3.scaleBand(data.map(d => d.cat), [0, innerH]).padding(0.5);
      // the 15% smaller dots are for the full view only, the banner keeps the base size
      const r = Math.max(4, Math.min(7, y.step() * 0.28)) * (small ? 1 : DOT_SCALE);

      const vals = data.flatMap(d => [d.a, d.b]).filter(v => v != null);
      const [lo, hi] = d3.extent(vals);
      const pad = (hi - lo) * 0.06 || Math.abs(hi) * 0.1 || 1;
      const x = d3.scaleLinear()
        .domain([lo >= 0 ? Math.max(0, lo - pad) : lo - pad, hi + pad])
        .nice()
        .range([0, innerW]);

      if (showLabels) {
        const low = data.filter(d => d.a != null && d.b != null).map(d => Math.min(d.a, d.b));
        const need = d3.max(low, v => {
          const w = textWidth(fmt(v), HOUSE.fs.small * VALUE_SCALE, HOUSE.fw.title) + r + 10;
          return x(v) < w ? w : 0;
        }) || 0;
        if (need > 0) x.range([Math.min(need, innerW * 0.3), innerW]);
      }

      const axisFont = small ? HOUSE.axisFontRange[0] : Math.max(HOUSE.axisFontRange[0], Math.min(HOUSE.axisFontRange[1], innerW / Math.max(5, nTicks) * 0.5));

      const svg = d3.select(vizContainer).append('svg')
        .attr('width', width)
        .attr('height', svgH)
        .attr('viewBox', `0 0 ${width} ${svgH}`)
        .style('display', 'block');

      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      g.append('g').attr('class', 'flash-bands')
        .selectAll('rect').data(data.filter(d => isFlash(d.cat))).join('rect')
        .attr('x', -margin.left + 2)
        .attr('y', d => y(d.cat) + y.bandwidth() / 2 - y.step() / 2 + 1)
        .attr('width', width - 4)
        .attr('height', y.step() - 2)
        .attr('rx', HOUSE.radiusUi)
        .attr('fill', LOOK.flash);

      g.append('g')
        .attr('class', 'grid-lines')
        .attr('transform', `translate(0,${innerH})`)
        .call(d3.axisBottom(x).ticks(nTicks).tickSize(-innerH).tickFormat(''))
        .select('.domain').remove();

      const xAxisG = g.append('g')
        .attr('class', 'axis x-axis')
        .attr('transform', `translate(0,${innerH})`)
        .call(d3.axisBottom(x).ticks(nTicks).tickSizeOuter(0));
      xAxisG.selectAll('text').style('font-size', `${axisFont}px`).style('font-family', HOUSE.font);

      if (!small) {
        xAxisG.append('text')
          .attr('class', 'axis-title')
          .attr('x', (x.range()[0] + x.range()[1]) / 2)
          .attr('y', 40)
          .attr('text-anchor', 'middle')
          .text(X_TITLE);
      }

      const namesG = g.append('g')
        .attr('class', 'axis names')
        .call(d3.axisLeft(y).tickSize(0).tickPadding(icon + iconPad + 6).tickFormat(c => names.get(c)));
      namesG.select('.domain').remove();
      namesG.selectAll('text').style('font-size', `${nameSize}px`);
      namesG.selectAll('.tick').filter(c => showIcons && logoFor(c)).append('image')
        .attr('href', c => logoFor(c))
        .attr('x', -(icon + iconPad))
        .attr('y', -icon / 2)
        .attr('width', icon)
        .attr('height', icon)
        .attr('preserveAspectRatio', 'xMidYMid meet');

      const sw = Math.max(2, r * 0.6);
      // arrowheads follow the dots, not the labels
      const headLen = r * 1.3 * 1.2;
      const headHalf = r * 0.85 * 1.2;
      const headGap = Math.max(1.5, r * 0.25);

      const geo = d => {
        const xa = x(d.a), xb = x(d.b);
        const dir = xb >= xa ? 1 : -1;
        const gap = Math.abs(xb - xa);
        const hasHead = gap >= 2 * r + headGap + headLen + 2;
        const tip = xb - dir * (r + headGap);
        return { xa, xb, dir, hasHead, tip, x2: hasHead ? tip - dir * headLen * 0.8 : xb, mid: (xa + xb) / 2 };
      };

      const row = g.selectAll('g.dr-row').data(data).join('g')
        .attr('class', 'dr-row')
        .classed('dim', d => activeCat != null && d.cat !== activeCat)
        .attr('transform', d => `translate(0,${y(d.cat) + y.bandwidth() / 2})`);

      const both = d => d.a != null && d.b != null;

      const link = row.filter(both).append('line').attr('class', 'dr-link')
        .attr('stroke-width', sw);

      const head = row.filter(d => both(d) && geo(d).hasHead).append('path').attr('class', 'dr-head')
        .attr('d', `M0,0 L${-headLen},${-headHalf} L${-headLen},${headHalf} Z`)
        .attr('transform', d => { const q = geo(d); return `translate(${q.tip},0) scale(${q.dir},1)`; });

      const dotA = row.filter(d => d.a != null).append('circle').attr('class', 'dr-dot')
        .attr('r', r).attr('fill', LOOK.a);
      const dotB = row.filter(d => d.b != null).append('circle').attr('class', 'dr-dot')
        .attr('r', r).attr('fill', LOOK.b);

      const labels = row.selectAll('text.dr-value')
        .data(d => {
          const pts = [[d.a, LOOK.a], [d.b, LOOK.b]].filter(p => p[0] != null).sort((m, n) => m[0] - n[0]);
          return showLabels ? pts.map((p, i) => ({ v: p[0], c: p[1], left: i === 0 && pts.length > 1 })) : [];
        })
        .join('text')
        .attr('class', 'dr-value text-halo')
        .attr('x', p => x(p.v) + (p.left ? -(r + 4) : r + 4))
        .attr('dy', '0.35em')
        .attr('text-anchor', p => p.left ? 'end' : 'start')
        .attr('fill', p => p.c)
        .text(p => fmt(p.v));

      if (firstRender) {
        link.attr('x1', d => geo(d).mid).attr('x2', d => geo(d).mid);
        dotA.attr('cx', d => both(d) ? geo(d).mid : x(d.a));
        dotB.attr('cx', d => both(d) ? geo(d).mid : x(d.b));
        head.attr('opacity', 0);
        labels.attr('opacity', 0);
        const t = d3.transition().duration(700).ease(d3.easeCubicOut);
        link.transition(t).attr('x1', d => geo(d).xa).attr('x2', d => geo(d).x2);
        dotA.transition(t).attr('cx', d => x(d.a));
        dotB.transition(t).attr('cx', d => x(d.b));
        head.transition().delay(500).duration(250).attr('opacity', 1);
        labels.transition().delay(450).duration(300).attr('opacity', 1);
        firstRender = false;
      } else {
        link.attr('x1', d => geo(d).xa).attr('x2', d => geo(d).x2);
        dotA.attr('cx', d => x(d.a));
        dotB.attr('cx', d => x(d.b));
      }

      row.append('rect').attr('class', 'dr-hit')
        .attr('x', -margin.left)
        .attr('y', -y.step() / 2)
        .attr('width', width)
        .attr('height', y.step())
        .on('pointerenter', (e, d) => { if (e.pointerType === 'mouse') { setActive(d.cat); showTooltip(e, d); } })
        .on('pointermove', (e, d) => { if (e.pointerType === 'mouse') showTooltip(e, d); })
        .on('pointerleave', e => { if (e.pointerType === 'mouse') clearActive(); })
        .on('click', (e, d) => {
          e.stopPropagation();
          if (e.pointerType !== 'mouse' && activeCat === d.cat) { clearActive(); return; }
          setActive(d.cat);
          showTooltip(e, d);
        });
    }

    render();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 220);
    });

    if (typeof ResizeObserver !== 'undefined') {
      const r0 = vizContainer.getBoundingClientRect();
      let lastW = Math.round(r0.width), lastH = Math.round(r0.height);
      new ResizeObserver(entries => {
        const cr = entries[0].contentRect;
        if (Math.round(cr.width) === lastW && Math.round(cr.height) === lastH) return;
        lastW = Math.round(cr.width); lastH = Math.round(cr.height);
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 220);
      }).observe(vizContainer);
    }
  </script>
</body>
</html>
