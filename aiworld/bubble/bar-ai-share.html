<!DOCTYPE html>
<html lang="en">

  <style>
/* ─── BASE ────────────────────────────────────────────────────────────────── */
html, body { height: 100%; }

body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Helvetica, Arial, sans-serif;

/* ─── LAYOUT GRID ─────────────────────────────────────────────────────────── */
.viz-grid {
    display: grid;
    grid-template-rows: 16fr 1fr 1fr;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    padding-bottom: clamp(8px, 2vh, 18px);
}

#container1 {
    grid-row: 1;
    grid-column: 1 / span 2;
    overflow: hidden;
    min-height: 0;
}

#container2 {
    grid-row: 2;
    grid-column: 1 / span 2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* ─── CHART CANVAS ────────────────────────────────────────────────────────── */
#viz { width: 100%; height: 100%; min-height: 0; min-width: 0; }
#chart { display: block; width: 100%; height: 100%; }

/* ─── SLIDER ──────────────────────────────────────────────────────────────── */
#slider-container {
    grid-row: 3;
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-self: center;
    gap: clamp(8px, 1vw, 16px);
    padding: clamp(4px, 1vh, 8px) clamp(8px, 2vw, 24px);
    overflow: visible;
    min-height: 0;
    max-width: 560px;
    width: 100%;
    box-sizing: border-box;
}

.slider-label {
    font-size: clamp(11px, 1.4vw, 14px);
    font-weight: 700;
    color: #1e293b;
    white-space: nowrap;
    min-width: 8.5ch;
    text-align: center;
}

.slider-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    height: 40px;
    min-width: 0;
}

.slider-track-bg {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 6px;
    background: #e2e8f0;
    border-radius: 3px;
    transform: translateY(-50%);
    pointer-events: none;
}

.slider-track-fill {
    position: absolute;
    top: 50%;
    height: 6px;
    background: #2756d3;
    border-radius: 3px;
    transform: translateY(-50%);
    pointer-events: none;
}

.slider-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #cbd5e1;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.slider-dot.on { background: #2756d3; }

/* Two overlaid range inputs give a two-handle range. Only the thumbs take
   pointer events so the lower input never swallows clicks meant for the upper. */
.year-slider {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    left: 0;
    width: 100%;
    height: 6px;
    margin: 0;
    background: transparent;
    outline: none;
    pointer-events: none;
    z-index: 2;
}

.year-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #3b82f6;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
    cursor: pointer;
    pointer-events: auto;
    transition: box-shadow 0.2s;
}

.year-slider::-webkit-slider-thumb:hover {

}

.year-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #3b82f6;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);

}

.year-slider::-moz-range-track { background: transparent; border: none; }

.year-slider:focus-visible::-webkit-slider-thumb {

/* ─── LEGEND ──────────────────────────────────────────────────────────────── */

/* ─── CHART ELEMENTS (D3) ─────────────────────────────────────────────────── */

/* ─── TOOLTIP ─────────────────────────────────────────────────────────────── */

}

/* ─── RESPONSIVE ──────────────────────────────────────────────────────────── */

  <div class="viz-grid">
    <div id="container1" class="container viz-container">
      <div id="viz"><svg id="chart"></svg></div>
    </div>

    <div id="container2" class="container legend-container">
      <div class="legend" id="legend"></div>
    </div>

    <div id="slider-container">
      <span class="slider-label" id="slider-label"></span>
      <div class="slider-wrapper">
        <div class="slider-track-bg"></div>
        <div class="slider-track-fill" id="slider-fill"></div>
        <div id="slider-dots"></div>
        <input type="range" class="year-slider" id="year-from" aria-label="First year shown">
        <input type="range" class="year-slider" id="year-to" aria-label="Last year shown">
      </div>
    </div>
  </div>

<script>
// ─── Data ────────────────────────────────────────────────────────────────────
const RAW    = JSON.parse(document.getElementById("chart-data").textContent);
const GROUPS = RAW.groups;
const YEARS  = RAW.years.map(d => d.year);

const BY_YEAR = new Map(RAW.years.map(d => [d.year, d.groups]));

// The build year is only complete once it is over, so it carries a YTD marker.
const PARTIAL_YEAR = +RAW.built.slice(0, 4);

// Legend clicks hide a region group; the stacks are independent so the
// remaining bars simply widen.
const hidden = new Set();
function activeGroups() { return GROUPS.filter(g => !hidden.has(g.id)); }

// ─── Slider ──────────────────────────────────────────────────────────────────
const fromEl  = document.getElementById("year-from");
const toEl    = document.getElementById("year-to");
const labelEl = document.getElementById("slider-label");
const fillEl  = document.getElementById("slider-fill");
const dotsEl  = document.getElementById("slider-dots");

let fromIdx = 0;
let toIdx   = YEARS.length - 1;

for (const el of [fromEl, toEl]) {
    el.min = 0;
    el.max = String(YEARS.length - 1);
    el.step = 1;
}
fromEl.value = String(fromIdx);
toEl.value   = String(toIdx);

for (let i = 0; i < YEARS.length; i++) {
    const dot = document.createElement("div");
    dot.className = "slider-dot";
    dot.style.left = pct(i) + "%";
    dot.dataset.idx = String(i);
    dotsEl.appendChild(dot);
}

function pct(i) {
    return YEARS.length < 2 ? 50 : (i / (YEARS.length - 1)) * 100;
}

function syncSlider() {
    labelEl.textContent = fromIdx === toIdx
        ? String(YEARS[fromIdx])
        : YEARS[fromIdx] + "–" + YEARS[toIdx];

    fillEl.style.left  = pct(fromIdx) + "%";
    fillEl.style.width = (pct(toIdx) - pct(fromIdx)) + "%";

    for (const dot of dotsEl.children) {
        const i = +dot.dataset.idx;
        dot.classList.toggle("on", i >= fromIdx && i <= toIdx);
    }
}

function onSlide() {
    let a = +fromEl.value;
    let b = +toEl.value;
    if (a > b) { const t = a; a = b; b = t; }   // handles crossed over
    fromIdx = a;
    toIdx   = b;
    fromEl.value = String(a);
    toEl.value   = String(b);
    syncSlider();
    render();
}

fromEl.addEventListener("input", onSlide);
toEl.addEventListener("input", onSlide);

// ─── Legend ──────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");

function buildLegend() {
    legendEl.innerHTML = "";
    for (const g of GROUPS) {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.tabIndex = 0;
        item.dataset.group = g.id;
        item.innerHTML =
            '<span class="legend-swatch">' +
              '<span style="background:' + g.rest_color + '"></span>' +
              '<span style="background:' + g.ai_color + '"></span>' +
            '</span><span>' + g.label + '</span>';
        legendEl.appendChild(item);
    }

    // Years the build could not plot, so the gap in the axis is explained.
    // The axis already marks the current year YTD, so that needs no note.
    if (RAW.dropped.length) {
        addNote(RAW.dropped.map(d => d.year).join(", ") +
                " omitted (stale denominator)");
    }
}

function addNote(html) {
    const note = document.createElement("div");
    note.className = "legend-item";
    note.style.cursor = "default";
    note.style.color = "#6b7280";
    note.style.fontWeight = "500";
    note.innerHTML = html;
    legendEl.appendChild(note);
    return note;
}

// Event delegation -- no inline handlers.
legendEl.addEventListener("click", ev => toggleGroup(ev.target.closest(".legend-item")));
legendEl.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        toggleGroup(ev.target.closest(".legend-item"));
    }
});

function toggleGroup(item) {
    if (!item || !item.dataset.group) return;
    const id = item.dataset.group;
    if (hidden.has(id)) hidden.delete(id);
    else if (activeGroups().length > 1) hidden.add(id);   // never hide the last one
    else return;
    item.classList.toggle("dim", hidden.has(id));
    render();
}

// ─── Formatting ──────────────────────────────────────────────────────────────
function usd(v) {
    const a = Math.abs(v);
    if (a >= 1e9) return "$" + (v / 1e9).toFixed(1) + "bn";
    if (a >= 1e6) return "$" + (v / 1e6).toFixed(0) + "m";
    return "$" + d3.format(",")(Math.round(v));
}

function shareText(f) {
    const p = f * 100;
    if (p > 0 && p < 1) return "<1%";
    if (p < 100 && p > 99) return ">99%";
    return Math.round(p) + "%";
}

// ─── Tooltip ─────────────────────────────────────────────────────────────────
let tooltipEl = null;
function ensureTooltip() {
    if (!tooltipEl) {
        tooltipEl = document.createElement("div");
        tooltipEl.id = "tooltip";
        document.body.appendChild(tooltipEl);
    }
}

// ─── Render ──────────────────────────────────────────────────────────────────
const vizContainer = document.getElementById("viz");

function render() {
    ensureTooltip();

    const groups = activeGroups();
    const years  = YEARS.slice(fromIdx, toIdx + 1);

    const rect    = vizContainer.getBoundingClientRect();
    const width   = Math.max(320, rect.width);
    const height  = Math.max(220, rect.height);
    const compact = window.matchMedia("(max-height:500px)").matches;

    const margin = {
        top: 18,
        right: Math.max(24, width * 0.04),
        bottom: Math.max(52, height * 0.13),
        left: Math.max(72, width * 0.07)
    };
    const innerWidth  = Math.max(40, width  - margin.left - margin.right);
    const innerHeight = Math.max(40, height - margin.top  - margin.bottom);

    const svg = d3.select("#chart")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", "0 0 " + width + " " + height)
        .style("width", "100%")
        .style("height", "100%");

    svg.selectAll("*").remove();

    const g = svg.append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    const x0 = d3.scaleBand()
        .domain(years)
        .range([0, innerWidth])
        .paddingInner(0.22)
        .paddingOuter(0.06);

    const x1 = d3.scaleBand()
        .domain(groups.map(d => d.id))
        .range([0, x0.bandwidth()])
        .padding(0.12);

    const y = d3.scaleLinear().domain([0, 1]).range([innerHeight, 0]);

    const axisFont = Math.max(9, Math.min(13, innerWidth / (years.length * 4) * 0.8));

    // Grid lines
    g.append("g")
        .attr("class", "grid-lines")
        .call(d3.axisLeft(y).ticks(5).tickSize(-innerWidth).tickFormat(""))
        .select(".domain").remove();

    // Faint dividers between year groups
    g.append("g")
        .attr("class", "year-dividers")
        .selectAll("line")
        .data(years.slice(1))
        .enter()
        .append("line")
            .attr("class", "year-divider")
            .attr("x1", d => x0(d) - x0.step() * x0.paddingInner() / 2)
            .attr("x2", d => x0(d) - x0.step() * x0.paddingInner() / 2)
            .attr("y1", 0)
            .attr("y2", innerHeight);

    // X axis -- years
    const xAxisG = g.append("g")
        .attr("class", "axis x-axis")
        .attr("transform", "translate(0," + innerHeight + ")")
        .call(d3.axisBottom(x0)
            .tickSizeOuter(0)
            .tickFormat(d => d === PARTIAL_YEAR ? d + " YTD" : d));

    xAxisG.selectAll("text")
        .style("font-size", Math.max(11, Math.min(16, axisFont * 1.3)) + "px")
        .style("font-weight", 700)
        .style("fill", "#1e293b")
        .attr("dy", "1.4em");

    // Y axis -- share of total investment
    const yAxisG = g.append("g")
        .attr("class", "axis y-axis")
        .call(d3.axisLeft(y).ticks(5).tickFormat(d3.format(".0%")));

    yAxisG.selectAll("text").style("font-size", Math.max(10, axisFont) + "px");

    yAxisG.append("text")
        .attr("transform", "rotate(-90)")
        .attr("y", -margin.left + 16)
        .attr("x", -(innerHeight / 2))
        .attr("dy", "0.71em")
        .attr("text-anchor", "middle")
        .style("fill", "#000")
        .style("font-weight", 700)
        .style("font-size", "clamp(12px, 1.5vw, 18px)")
        .text("Share of venture capital towards AI companies");

    // ── Bars: one 100% stack per year x group ────────────────────────────────
    const cells = [];
    for (const yr of years) {
        for (const grp of groups) {
            const t = BY_YEAR.get(yr)[grp.id];
            if (!t || !t.all) continue;
            const share = t.ai / t.all;
            cells.push({
                year: yr, grp: grp,
                ai: t.ai, all: t.all, rest: t.all - t.ai,
                share: share,
                x: x0(yr) + x1(grp.id),
                w: x1.bandwidth()
            });
        }
    }

    const cellG = g.append("g").attr("class", "bars")
        .selectAll("g")
        .data(cells)
        .enter()
        .append("g")
            .attr("transform", d => "translate(" + d.x + ",0)");

    // Rest of investment -- upper block
    const restRects = cellG.append("rect")
        .attr("class", "seg-rest")
        .attr("x", 0)
        .attr("width", d => d.w)
        .attr("fill", d => d.grp.rest_color)
        .attr("y", y(1))
        .attr("height", 0);

    restRects.transition().duration(700).ease(d3.easeCubicOut)
        .attr("y", y(1))
        .attr("height", d => y(d.share) - y(1));

    // AI subset -- lower block
    const aiRects = cellG.append("rect")
        .attr("class", "seg-ai")
        .attr("x", 0)
        .attr("width", d => d.w)
        .attr("fill", d => d.grp.ai_color)
        .attr("y", y(0))
        .attr("height", 0);

    aiRects.transition().duration(700).ease(d3.easeCubicOut)
        .attr("y", d => y(d.share))
        .attr("height", d => y(0) - y(d.share));

    // ── Segment numbers ──────────────────────────────────────────────────────
    const labelFont = Math.max(7, Math.min(14, x1.bandwidth() * 0.36));
    const fits = h => h >= labelFont * 1.45;

    function addLabels(cls, valueFn, yFn, fill) {
        cellG.append("text")
            .attr("class", cls)
            .attr("x", d => d.w / 2)
            .attr("y", yFn)
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("font-size", labelFont + "px")
            .style("font-weight", 700)
            .style("fill", fill)
            .style("paint-order", "stroke")
            .style("pointer-events", "none")
            .style("opacity", 0)
            .text(valueFn)
            .transition().duration(700).delay(120)
            .style("opacity", 1);
    }

    // AI share, centred in the lower block
    addLabels(
        "lbl-ai",
        d => fits(y(0) - y(d.share)) ? shareText(d.share) : "",
        d => (y(0) + y(d.share)) / 2,
        "#fff"
    );

    // Rest share, centred in the upper block
    addLabels(
        "lbl-rest",
        d => fits(y(d.share) - y(1)) ? shareText(1 - d.share) : "",
        d => (y(d.share) + y(1)) / 2,
        "#1f2937"
    );

    // Region initials under each bar when there is room for them
    if (x1.bandwidth() >= 22) {
        cellG.append("text")
            .attr("x", d => d.w / 2)
            .attr("y", innerHeight + 12)
            .attr("text-anchor", "middle")
            .style("font-size", Math.max(8, Math.min(11, x1.bandwidth() * 0.3)) + "px")
            .style("font-weight", 600)
            .style("fill", d => d.grp.ai_color)
            .style("pointer-events", "none")
            .text(d => d.grp.id === "WORLD" ? "World" : d.grp.id);
    }

    // ── Hover ────────────────────────────────────────────────────────────────
    cellG.append("rect")
        .attr("class", "hit")
        .attr("x", 0)
        .attr("width", d => d.w)
        .attr("y", y(1))
        .attr("height", innerHeight - y(1))
        .attr("fill", "transparent")
        .on("mousemove", function (event, d) {
            tooltipEl.innerHTML =
                "<strong>" + d.grp.label + " · " + d.year + "</strong>" +
                '<br/><span style="color:' + d.grp.ai_color + ';font-weight:700">' +
                    "AI " + shareText(d.share) + " · " + usd(d.ai) + "</span>" +
                '<br/><span style="opacity:.75">Rest ' + shareText(1 - d.share) +
                    " · " + usd(d.rest) + "</span>" +
                '<br/><span style="opacity:.6">Total ' + usd(d.all) + "</span>";
            tooltipEl.style.left = (event.clientX + 14) + "px";
            tooltipEl.style.top  = (event.clientY - 24) + "px";
            tooltipEl.style.opacity = "1";
        })
        .on("mouseleave", () => { tooltipEl.style.opacity = "0"; });
}

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 220);
});
if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => render()).observe(vizContainer);
}

buildLegend();
syncSlider();
render();
</script>
</body>
</html>
