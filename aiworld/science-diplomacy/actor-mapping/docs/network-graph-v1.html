ech-services-gmbh", "name": "BRIMATECH SERVICES GMBH", "kind": "new", "node": null, "url": null, "country_hint": "AT", "source_node": "czechinvest", "relation": {"type": "partnership", "role": null, "collective": null, "collective_id": null}, "quote": "BRIMATECH is participant in Astropreneurs project with CzechInvest", "via": "oa:4398cb28", "status": "open", "priority": false, "job": "job-022", "step": 3, "added_at": "2026-10-06T12:26:33"}, {"id": "c-uk-research-and-innovation", "name": "UK Research and Innovation", "kind": "new", "node": null, "url": null, "country_hint": "GB", "source_node": "czechinvest", "relation": {"type": "partnership", "role": null, "collective": null, "collective_id": null}, "quote": "UKRI is participant in Astropreneurs project with CzechInvest", "via": "oa:4398cb28", "status": "open", "priority": false, "job": "job-022", "step": 3, "added_at": "2026-10-06T12:26:34"}, {"id": "c-cesah-gmbh", "name": "CESAH GMBH", "kind": "new", "node": null, "url": null, "country_hint": "DE", "source_node": "czechinvest", "relation": {"type": "partnership", "role": null, "collective": null, "collective_id": null}, "quote": "CESAH is participant in Astropreneurs project with CzechInvest", "via": "oa:4398cb28", "status": "open", "priority": false, "job": "job-022", "step": 3, "added_at": "2026-10-06T12:26:34"}]}, "info": "# How this map is built\n\n**Question.** Can a *relational* snowball find what an AI web search cannot: the collaboration\nties between science-diplomacy actors, actors the search missed, and evidence for the actors the\nsearch left \"uncertain\"?\n\n**Seed layer.** The CUSP Pillar-1 candidate lists for Czechia and Denmark (CEPS, Sept 2026):\ngate *pass* rows enter as expandable actors, *uncertain* rows as grey leaves, big registry groups\n(Academy institutes, ministry units, Czech Centres branches) collapsed into one leaf each.\n`part_of` edges reproduce the org charts. The lists contain **no collaboration edges**; finding\nthose is the agent's job.\n\n## One expansion step = harvest, then check\n\n| Phase | Who | Does | Budget |\n|---|---|---|---|\n| Harvest | Haiku | reads the focal actor's own pages, OpenAIRE projects, ≤2 web searches; writes **candidates** (name + relation + quote). No judgement. | ≤ 6 tool calls |\n| Check | Sonnet | looks each candidate up on its own site, scores it on the ladder below, translates the quote, sets the country where clear | ≤ 2 calls per candidate, 4 candidates per step |\n| Verify | you | ✓ / ✗ / ? on nodes and edges in this panel; verified leaves become expandable; rejected nodes are never re-added | — |\n\nUnchecked candidates stay in a pool and are listed on their source node (\"Candidates waiting\",\nwith *Check next*). When a job's own harvest leaves four or more names unchecked, its next step is a\n**check-only step** (six candidates, no new page) instead of a new focal actor. Focal actors are\nchosen by expected yield: organisations with their own site and partner pages first, ministries\nnext, posts and locations whose parent is already expanded last. When several names share one tie\n(a consortium, network, programme, steering group, event), the harvest creates that **collective**\nas a level-1 connector node and records the members as `member_of` it; the check phase may raise\nthe collective's level. The orchestrating Claude Code session only moves briefs and results around.\n\n## The evidence ladder\n\n| Level | Name | Evidence | Effect |\n|---|---|---|---|\n| L0 | candidate | named as partner / member / participant / co-organiser on a source | waits in the pool |\n| 0 | dismissed | not an organisation (a person, a product, a whole country/region/city), defunct, out of scope | not stored; name remembered |\n| 1 | leaf | real organisation, edge documented, no SD element shown for the actor itself | grey, never auto-expanded |\n| 2 | frontier (relational) | (a) member of a clearly SD-labelled collective, or (b) an official third-party source describes SD-type activity (incl. CUSP *pass*), or (c) its own site shows one concrete SD-type activity | expandable, after level 3 |\n| 3 | frontier (own words) | its own site or official document states science diplomacy (or science advice to foreign policy, research cooperation as a foreign-policy tool) as mission, unit, programme, post or course | expandable first |\n| ✓ ✗ ? | verified / rejected / unsure | your judgement | overrides the agent |\n\n**Recheck rule.** A harvested name that matches an existing grey leaf (including CUSP \"uncertain\"\nrows) is not dropped as a duplicate: the check phase re-scores the leaf with the new relation in\nhand. The agent may raise a level, never lower one; nodes you verified or rejected are never\ntouched. Promotions show as a \"re-evaluated\" tag with the reason.\n\n## What the numbers mean\n\n- **Beyond the lists** — *new actors*: found by the agent and in none of the shared-data files;\n  *collaboration edges*: all edges except org-chart `part_of`; *list actors connected*: CUSP rows\n  that gained at least one collaboration edge; *leaves promoted*: rechecks that raised a level;\n  *also found by the non-state sweep*: agent finds that the separate CUSP non-state sweep had too.\n- **Tokens** — exact per-subagent token counts reported by the runner, by model, plus an\n  estimated runner overhead; € uses the blended prices in `data/prices.json`.\n- **Alliance members reached** — hidden gold set of the 86 EU Science Diplomacy Alliance members\n  (kept from the first demo; the agent never sees the list).\n\n## Using the viewer\n\nClick a node: quote (with English rendering), provenance (`via`), CUSP record, relations, waiting\ncandidates. **Start agentic expansion** queues a bounded job (max new nodes, max steps); the\nrunner picks it up within seconds. *Colour by* CUSP gate / verification / relevance / job; tick\n*Colour actors by country*; untick *Show leaves* for a cleaner picture; drag nodes, adjust\n*Gravity*; replay growth with the slider.\n\n## Reviewing a shared snapshot\n\nIf you are reading this on the static page (GitHub Pages), nothing runs in the background: the\ngraph is a snapshot taken at the time shown at the top right. Type your name under **Your review**,\nmark nodes and relations with ✓ / ✗ / ? and add notes in the panel, or flag waiting candidates with\n*Check next*; the **Table** tab lists every actor and candidate with filters, search and CSV export.\nYour marks stay in your browser until you click **Download my review (JSON)** and send the file back;\nthey are then merged into the live graph under your name.\n", "prices": {"_note": "Blended EUR per 1 million tokens (input and output averaged), used only for the on-screen cost estimate. Edit freely; the viewer reloads it on refresh.", "haiku": 1.8, "sonnet": 4.5, "overhead_est": 23.0, "default": 4.5}};
/* Share mode for the static snapshot (built by pipeline/08_export_share.py).
   Part 1 runs in <head> before the main viewer script: embedded data + API shim + local review marks.
   Part 2 runs after the main script: review box, Graph/Table tabs, filterable table, JSON download. */
(function(){
  const SNAP = window.__SNAPSHOT;
  const KEY = "sd-review-" + SNAP.exported_at;
  let review = {reviewer: "", marks: {}};  // "kind|id" -> {kind,id,name,status,note,at}
  try { review = JSON.parse(localStorage.getItem(KEY)) || review; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(review)); } catch (e) {} ; window.dispatchEvent(new Event("review-changed")); };
  const stamp = () => new Date().toISOString().slice(0, 19);

  function overlay(g) {  // show the reviewer's own marks in place of the project's verification
    for (const n of g.nodes) { n.verification_project = n.verification; const m = review.marks["node|" + n.id]; if (m) n.verification = {status: m.status, at: m.at, note: m.note, by: review.reviewer || "you"}; }
    for (const e of g.edges) { e.verification_project = e.verification; const m = review.marks["edge|" + e.id]; if (m) e.verification = {status: m.status, at: m.at, note: m.note, by: review.reviewer || "you"}; }
    for (const c of g.candidates || []) if (review.marks["candidate|" + c.id]) c.priority = true;
    return g;
  }
  window.__shareApi = (path, body) => {
    if (!body) return Promise.resolve(path === "/api/graph" ? overlay(structuredClone(SNAP.graph)) : []);
    if (path === "/api/verify") {
      const k = body.kind + "|" + body.id;
      if (body.status === "unverified") delete review.marks[k];
      else { const item = (body.kind === "node" ? SNAP.graph.nodes : SNAP.graph.edges).find(x => x.id === body.id);
             review.marks[k] = {kind: body.kind, id: body.id, name: item ? (item.name || item.id) : body.id, status: body.status, note: body.note || null, at: stamp()}; }
      save(); return Promise.resolve({result: "ok"});
    }
    const pr = /^\/api\/candidates\/([^/]+)\/priority$/.exec(path);
    if (pr) { const c = (SNAP.graph.candidates || []).find(x => x.id === pr[1]);
              review.marks["candidate|" + pr[1]] = {kind: "candidate", id: pr[1], name: c ? c.name : pr[1], status: "check_next", note: null, at: stamp()}; save(); return Promise.resolve({result: "ok"}); }
    return Promise.resolve({result: "error", error: "Read-only snapshot: marks are kept in this browser - use 'Download my review'."});
  };
  window.__review = {get: () => review, setReviewer: v => { review.reviewer = v; save(); }, clear: () => { review = {reviewer: review.reviewer, marks: {}}; save(); }};
})();
</script>

<body class="share">
<div id="app">
  <aside id="controls">
    <h1>Science Diplomacy Discovery <button id="info" title="How this works: setup, evidence ladder, metrics"><svg width="15" height="15" viewBox="0 0 16 16" aria-label="info" style="vertical-align:-2px"><circle cx="8" cy="8" r="6.9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="4.7" r="1.05" fill="currentColor"/><rect x="7.15" y="6.9" width="1.7" height="5.1" rx=".85" fill="currentColor"/></svg></button></h1>

    <h2>Colour by</h2>

      <option value="verification">Verification status</option>
      <option value="relevance">Relevance (agent)</option>
      <option value="kind">Node kind</option>

    </select>

      <input type="range" id="gravity" min="-1" max="1" step="0.05" value="-0.4" style="width:100%"></label>

    <h2>Jobs <span class="sub" style="text-transform:none;letter-spacing:0">· runner: Claude Code session</span></h2>

    <div id="jobs"><div class="empty">No jobs yet. Select a node → Expand.</div></div>

  </aside>

  <main>

    <div id="tip"></div>
    <div id="hud"></div>
  </main>

  <aside id="detail"><div class="empty">Click a node to inspect, verify, or expand from it.</div></aside>
</div>

<script>
const PAL = ["#4aa3ff","#f0a04b","#5ecf8d","#c792ea","#ff7b8a","#3fc8c0","#e6c84a","#8f9bff","#ff9f6e","#79d0ff","#bfae7a","#d98cc4"];
const COL = {
  verification: {verified:"var(--ok)", rejected:"var(--bad)", unsure:"var(--warn)", unverified:"#8f9bff"},
  relevance:    {3:"var(--ok)", 2:"var(--accent)", 1:"#6b7683"},
  kind:         {actor:"var(--accent)", collective:"var(--warn)"},
};
const state = {colourBy:"country", gravity:Math.pow(4,-0.4), q:"", showLeaves:false, showRejected:true, showLabels:true, tCut:Infinity};
let G = {nodes:[], edges:[], jobs:[], meta:{}}, pos = {}, selected=null, hover=null, sim=null, view={x:0,y:0,k:1};
let timeline = [], detailSig = null;

const svg = document.getElementById("canvas"), tip = document.getElementById("tip");
const NS="http://www.w3.org/2000/svg", el=(n,a={})=>{const e=document.createElementNS(NS,n); for(const k in a) if(a[k]!=null) e.setAttribute(k,a[k]); return e;};
const esc = s => String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const pretty = s => (s==null?"—":String(s)).replace(/_/g," ");
let PRICES = {};  // EUR per million tokens, from data/prices.json (editable)
Promise.resolve(window.__SNAPSHOT.prices).then(p=>{PRICES=p; renderSide();}).catch(()=>{});
const fmtK = v => v>=1e6 ? (v/1e6).toFixed(2)+"M" : v>=1e3 ? (v/1e3).toFixed(1)+"k" : String(v);
const tokLine = t => Object.entries(t||{}).filter(([k,v])=>v>0).map(([k,v])=>`${k==="overhead_est"?"runner (est.)":k} ${fmtK(v)}`).join(" · ") || "0";
const cost = t => Object.entries(t||{}).reduce((a,[k,v])=>a+(v/1e6)*(PRICES[k]??PRICES.default??0),0);
const api = window.__shareApi;

/* ---------- data ---------- */
async function refresh(){
  const g = await api("/api/graph");
  const grew = g.nodes.length !== G.nodes.length || g.edges.length !== G.edges.length;
  G = g;
  G.byId = Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  G.edges.forEach(e=>{ e.s=G.byId[e.source]; e.t=G.byId[e.target]; });
  for(const n of G.nodes){
    if(pos[n.id]) continue;
    // spawn new nodes next to something they connect to, so growth is legible
    const e = G.edges.find(e=>e.source===n.id||e.target===n.id);
    const anchor = e ? pos[e.source===n.id?e.target:e.source] : null;
    pos[n.id] = anchor ? {x:anchor.x+(Math.random()-.5)*60, y:anchor.y+(Math.random()-.5)*60, vx:0, vy:0}
                       : {x:(Math.random()-.5)*300, y:(Math.random()-.5)*300, vx:0, vy:0};
  }
  timeline = [...new Set([...G.nodes.map(n=>n.added_at), ...G.edges.map(e=>e.added_at)])].sort();
  const t = document.getElementById("time");
  const atEnd = +t.value >= +t.max;
  t.max = timeline.length; if(atEnd){ t.value = timeline.length; state.tCut = Infinity; }
  renderSide(); fillJumpList();
  if(selected){
    // Re-render the detail panel only when its data changed, so a poll never wipes
    // half-typed inputs or the button the user is about to click.
    const n = G.byId[selected.id] || null;
    if(sigFor(n) !== detailSig) showDetail(n);
  }
  if(grew) startSim(0.7); else draw();
  const live = document.getElementById("live");
  const rj = [];  // snapshot: nothing is running
  live.textContent = rj.length ? `● ${rj.length} job${rj.length>1?"s":""} running · ${rj.join(", ")}` : "static snapshot · exported "+window.__SNAPSHOT.exported_at.slice(0,16).replace("T"," ");
  live.classList.toggle("on", rj.length>0);
}
setInterval(refresh, 4000);
refresh().then(()=>startSim(1));

/* ---------- visibility ---------- */
function visible(n){
  if(!n) return false;
  if(!state.showLeaves && n.status==="leaf") return false;
  if(!state.showRejected && n.verification.status==="rejected") return false;
  if(state.tCut!==Infinity && n.added_at > state.tCut) return false;
  return true;
}
function visEdges(){ return G.edges.filter(e=>visible(e.s)&&visible(e.t)&&(state.tCut===Infinity||e.added_at<=state.tCut)); }
function matches(n){ if(!state.q) return true; const q=state.q.toLowerCase();
  return (n.name+" "+(n.country||"")+" "+(n.subkind||"")+" "+(n.host||"")+" "+(n.cusp?n.cusp.id+" "+(n.cusp.acronym||"")+" "+(n.cusp.name_local||""):"")).toLowerCase().includes(q); }

const CUSPCOL = {pass:"var(--ok)", uncertain:"var(--warn)", none:"#4a5668"};
// countries ranked by actor count; the top 11 get distinct colours, the long tail is pooled as "other"
const CC_MAX = 11, CC_OTHER = "#9aa3ad";
function countries(){ const c={}; G.nodes.forEach(n=>{ if(n.kind==="actor"&&n.country) c[n.country]=(c[n.country]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function countryCol(c){ const i=countries().findIndex(([k])=>k===c); return i<CC_MAX ? PAL[i] : CC_OTHER; }
function colourFor(n){
  const m = state.colourBy;
  if(m==="country") return n.kind==="actor"&&n.country ? countryCol(n.country) : CC_OTHER;  // unknown country stays neutral, never guessed
  if(m==="cusp") return CUSPCOL[n.cusp?n.cusp.gate:"none"];
  if(m==="verification") return COL.verification[n.verification.status];
  if(m==="relevance") return COL.relevance[n.relevance] || "#6b7683";
  if(m==="kind") return n.kind==="collective" ? COL.kind.collective : COL.kind.actor;
  if(m==="job"){ const jobs=[...new Set(G.nodes.map(n=>n.job||"seed"))]; return PAL[jobs.indexOf(n.job||"seed")%PAL.length]; }
}
function legend(){
  const box=document.getElementById("legend"); box.innerHTML="";
  let items=[];
  if(state.colourBy==="verification") items=Object.entries(COL.verification).map(([k,c])=>[pretty(k),c,G.nodes.filter(n=>n.verification.status===k).length]);
  if(state.colourBy==="relevance") items=[[3,"3 · mission-level"],[2,"2 · concrete activity"],[1,"1 · generic (leaf)"]].map(([k,l])=>[l,COL.relevance[k],G.nodes.filter(n=>n.relevance===k).length]);
  if(state.colourBy==="kind") items=[["actor",COL.kind.actor,G.nodes.filter(n=>n.kind==="actor").length],["collective (◆)",COL.kind.collective,G.nodes.filter(n=>n.kind==="collective").length]];
  if(state.colourBy==="job"){ const jobs=[...new Set(G.nodes.map(n=>n.job||"seed"))]; items=jobs.map((j,i)=>[j,PAL[i%PAL.length],G.nodes.filter(n=>(n.job||"seed")===j).length]); }
  if(state.colourBy==="cusp") items=[["CUSP pass",CUSPCOL.pass,G.nodes.filter(n=>n.cusp&&n.cusp.gate==="pass").length],["CUSP uncertain",CUSPCOL.uncertain,G.nodes.filter(n=>n.cusp&&n.cusp.gate==="uncertain").length],["found by the agent / seed",CUSPCOL.none,G.nodes.filter(n=>!n.cusp).length]];
  if(state.colourBy==="country"){ const cs=countries(), tail=cs.slice(CC_MAX);
    items=cs.slice(0,CC_MAX).map(([c,k])=>[c,countryCol(c),k]);
    if(tail.length) items.push([`other (${tail.map(([c])=>c).join(", ")})`,CC_OTHER,tail.reduce((a,[,k])=>a+k,0)]);
    items.push(["no country / collective",CC_OTHER,G.nodes.filter(n=>n.kind!=="actor"||!n.country).length]); }
  for(const [l,c,k] of items){ const lab=document.createElement("label"); lab.innerHTML=`<span class="swatch" style="background:${c}"></span>${esc(l)}<span class="count">${k}</span>`; box.appendChild(lab); }
  const extra=document.createElement("div"); extra.className="sub"; extra.style.marginTop="6px";
  extra.innerHTML="◯ actor · ◆ collective · dashed ring = frontier · gold ring = Alliance member · grey = leaf · dotted edge = part of (hierarchy)";
  box.appendChild(extra);
}

/* ---------- force layout (positions persist across refreshes) ---------- */
let dragging=null, simAlpha=0;  // id of the node under the pointer; current temperature
const DRAG_ALPHA=0.25;          // held while dragging: enough for springs to pull neighbours, too low to reshuffle the graph
function simStep(){
  const a0=simAlpha, edges=visEdges(), nodes=G.nodes.filter(visible);
  for(const e of edges){
    const a=pos[e.source], b=pos[e.target]; const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const rest = e.type==="member_of" ? 70 : 120;
    const f=(d-rest)/d*0.05*a0; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
  }
  for(let i=0;i<nodes.length;i++){ const a=pos[nodes[i].id];
    for(let j=i+1;j<nodes.length;j++){ const b=pos[nodes[j].id];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy; if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1;}
      if(d2>250000) continue; const f=1800/state.gravity/d2*a0, d=Math.sqrt(d2);  // gravity: weaker repulsion, stronger centre pull
      a.vx-=dx/d*f; a.vy-=dy/d*f; b.vx+=dx/d*f; b.vy+=dy/d*f; }
    a.vx-=a.x*0.003*state.gravity*a0; a.vy-=a.y*0.003*state.gravity*a0; }
  for(const n of nodes){ const p=pos[n.id]; if(p.fixed){p.vx=p.vy=0;continue;} p.x+=(p.vx*=0.8); p.y+=(p.vy*=0.8); }
  simAlpha = dragging ? Math.max(a0,DRAG_ALPHA) : a0*(a0<0.3 ? 0.985 : 0.993);  // cool faster once the big moves are done (~3 s after a drop)
  draw();
  if(simAlpha>0.01) sim=requestAnimationFrame(simStep);
  else if(autoFit){ autoFit=false; fitView(); }
}
function startSim(alpha0=1){ simAlpha=alpha0; cancelAnimationFrame(sim); sim=requestAnimationFrame(simStep); }
let autoFit = true;  // fit once after the first layout settles; later growth keeps the user's view
function fitView(){
  const nodes=G.nodes.filter(visible); if(!nodes.length) return;
  const xs=nodes.map(n=>pos[n.id].x), ys=nodes.map(n=>pos[n.id].y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const w=svg.clientWidth-80, h=svg.clientHeight-80;
  const k=Math.min(3, Math.max(.2, Math.min(w/Math.max(1,maxX-minX), h/Math.max(1,maxY-minY))));
  view={k, x:-(minX+maxX)/2*k, y:-(minY+maxY)/2*k}; draw();
}

/* ---------- draw ---------- */
// Elements persist per node/edge id and only get their attributes updated, so an element
// under the pointer (or behind an accessibility ref) survives redraws. Rebuilding the SVG
// each frame broke real clicks: mousedown and mouseup landed on different elements.
const nodeEls = new Map(), edgeEls = new Map();
let root, gE, gN;
function ensureLayers(){
  if(root) return;
  root=el("g"); gE=el("g"); gN=el("g"); root.appendChild(gE); root.appendChild(gN); svg.appendChild(root);
}
function tipFor(n){ return `<b>${esc(n.name)}</b><br>${esc(n.kind)}${n.subkind?" · "+esc(pretty(n.subkind)):""} · rel ${n.relevance} · ${esc(n.status)}`; }

function makeNode(n){
  const g=el("g",{class:"node"});
  const shape = n.kind==="collective" ? el("rect",{rx:2}) : el("circle");
  const ring=el("circle",{fill:"none","stroke-width":1,"stroke-dasharray":"2 2","stroke-opacity":.9});
  const gold=el("circle",{fill:"none",stroke:"var(--gold)","stroke-width":1.6});
  const label=el("text",{"text-anchor":"middle"});
  g.append(shape,ring,gold,label);
  const rec={g,shape,ring,gold,label,kind:n.kind,n};
  shape.setAttribute("role","button");
  // Select on mousedown: a `click` needs mousedown and mouseup on the same element.
  shape.addEventListener("mousedown",ev=>{ ev.stopPropagation(); nodeMouseDown=true; selected=rec.n; showDetail(rec.n); draw(); dragNode(ev,rec.n); });
  shape.addEventListener("mouseenter",()=>{ hover=rec.n; tip.innerHTML=tipFor(rec.n); tip.style.opacity=1; draw(); });
  shape.addEventListener("mouseleave",()=>{ hover=null; tip.style.opacity=0; draw(); });
  return rec;
}

function draw(){
  ensureLayers();
  const edges=visEdges(), nodes=G.nodes.filter(visible);
  const focus=selected||hover;
  const near=focus?new Set([focus.id,...edges.filter(e=>e.source===focus.id||e.target===focus.id).flatMap(e=>[e.source,e.target])]):null;
  const cx=svg.clientWidth/2, cy=svg.clientHeight/2;
  root.setAttribute("transform",`translate(${cx+view.x},${cy+view.y}) scale(${view.k})`);
  const deg={}; for(const e of edges){ deg[e.source]=(deg[e.source]||0)+1; deg[e.target]=(deg[e.target]||0)+1; }

  const seenE=new Set();
  for(const e of edges){
    seenE.add(e.id);
    let line=edgeEls.get(e.id);
    if(!line){ line=el("line",{class:"edge"}); edgeEls.set(e.id,line); gE.appendChild(line); }
    const a=pos[e.source], b=pos[e.target], rej=e.verification.status==="rejected";
    line.setAttribute("x1",a.x); line.setAttribute("y1",a.y); line.setAttribute("x2",b.x); line.setAttribute("y2",b.y);
    line.setAttribute("stroke", e.verification.status==="verified"?"var(--ok)":rej?"var(--bad)":"var(--dim)");
    line.setAttribute("stroke-opacity", rej?.35:e.type==="part_of"?.35:.55);
    line.setAttribute("stroke-width", e.type==="member_of"?1.2:e.type==="part_of"?.8:1);
    if(e.type==="member_of") line.removeAttribute("stroke-dasharray");
    else line.setAttribute("stroke-dasharray", e.type==="partnership"?"5 3":e.type==="part_of"?"1 3":"2 3");
    line.classList.toggle("faded", !!(near&&!(near.has(e.source)&&near.has(e.target))));
  }
  for(const [id,line] of edgeEls) if(!seenE.has(id)){ line.remove(); edgeEls.delete(id); }

  const seenN=new Set();
  for(const n of nodes){
    seenN.add(n.id);
    let rec=nodeEls.get(n.id);
    if(!rec||rec.kind!==n.kind){ if(rec) rec.g.remove(); rec=makeNode(n); nodeEls.set(n.id,rec); gN.appendChild(rec.g); }
    rec.n=n;
    const p=pos[n.id], hit=matches(n), dim=(near&&!near.has(n.id))||!hit;
    const r = n.status==="leaf" ? 4 : 6 + 4*Math.sqrt(deg[n.id]||0);
    const fill = n.status==="leaf" ? "#6b7683" : colourFor(n);
    const rej = n.verification.status==="rejected", isSel = selected&&selected.id===n.id;
    const s=rec.shape;
    if(n.kind==="collective"){ s.setAttribute("x",p.x-r); s.setAttribute("y",p.y-r); s.setAttribute("width",2*r); s.setAttribute("height",2*r); s.setAttribute("transform",`rotate(45 ${p.x} ${p.y})`); }
    else { s.setAttribute("cx",p.x); s.setAttribute("cy",p.y); s.setAttribute("r",r); }
    s.setAttribute("fill",fill); s.setAttribute("fill-opacity",rej?.35:1);
    s.setAttribute("stroke", isSel?"var(--ink)":"var(--bg)"); s.setAttribute("stroke-width", isSel?2.5:1.5);
    if(rej) s.setAttribute("stroke-dasharray","3 2"); else s.removeAttribute("stroke-dasharray");
    s.setAttribute("aria-label",`${n.name} (${n.kind})`);
    rec.ring.setAttribute("visibility", n.status==="frontier"?"visible":"hidden");
    rec.ring.setAttribute("cx",p.x); rec.ring.setAttribute("cy",p.y); rec.ring.setAttribute("r",r+3.5); rec.ring.setAttribute("stroke",fill);
    rec.gold.setAttribute("visibility", n.gold?"visible":"hidden");
    rec.gold.setAttribute("cx",p.x); rec.gold.setAttribute("cy",p.y); rec.gold.setAttribute("r",r+(n.status==="frontier"?6.5:3.5));
    const showLabel = state.showLabels&&(n.status!=="leaf"||(state.q&&hit)||(near&&near.has(n.id)));
    rec.label.setAttribute("visibility", showLabel?"visible":"hidden");
    rec.label.setAttribute("x",p.x); rec.label.setAttribute("y",p.y-r-5); rec.label.textContent=(n.name||"").slice(0,28);
    rec.g.classList.toggle("faded", !!dim);
  }
  for(const [id,rec] of nodeEls) if(!seenN.has(id)){ rec.g.remove(); nodeEls.delete(id); }
  document.getElementById("hud").textContent=`${nodes.length} nodes · ${edges.length} edges shown`;
}

/* ---------- info pane (viz/info.md) ---------- */
function md2html(md){
  const inline=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>");
  const out=[]; let list=null, table=null, para=[];
  const flush=()=>{ if(para.length){ out.push(`<p>${inline(para.join(" "))}</p>`); para=[]; } if(list){ out.push(`</${list}>`); list=null; } if(table){ out.push("</table>"); table=null; } };
  for(const raw of md.split("\n")){ const l=raw.trimEnd();
    if(/^\|/.test(l)){ if(/^\|\s*-/.test(l)) continue; const cells=l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      if(!table){ flush(); out.push("<table>"); out.push("<tr>"+cells.map(c=>`<th>${inline(c)}</th>`).join("")+"</tr>"); table="body"; }
      else out.push("<tr>"+cells.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>"); continue; }
    if(table){ out.push("</table>"); table=null; }
    const h=/^(#{1,3})\s+(.*)/.exec(l); if(h){ flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li=/^(?:[-*]|\d+\.)\s+(.*)/.exec(l); if(li){ const t=/^\d/.test(l)?"ol":"ul"; if(list!==t){ flush(); out.push(`<${t}>`); list=t; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if(!l.trim()){ flush(); continue; }
    if(list){ out.push(`</${list}>`); list=null; }
    para.push(l.trim());
  }
  flush(); return out.join("\n");
}

  selected=null; detailSig=null; draw();

  const panel=document.getElementById("detail");
  panel.innerHTML=`<div class="btnrow" style="justify-content:flex-end"><button id="infoClose">✕ close</button></div><div class="info">${md2html(md)}</div>`;
  panel.scrollTop=0; panel.querySelector("#infoClose").onclick=()=>showDetail(null);
}

/* ---------- jump-to-node search (graph view) ---------- */
function focusNode(n){
  if(!n||!pos[n.id]) return;
  if(n.status==="leaf"&&!state.showLeaves){ state.showLeaves=true; document.getElementById("showLeaves").checked=true; }
  selected=n; showDetail(n);
  const k=Math.max(view.k,1.6), p=pos[n.id];
  const from={...view}, to={k, x:-p.x*k, y:-p.y*k}, t0=performance.now();
  if(document.hidden){ view=to; draw(); return; }  // no animation frames in a hidden tab: jump straight there
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  (function step(){ const u=Math.min(1,(performance.now()-t0)/350), e=ease(u);
    view={k:from.k+(to.k-from.k)*e, x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e}; draw(); if(u<1) requestAnimationFrame(step); })();
}
function fillJumpList(){
  const dl=document.getElementById("jumplist"); if(!dl||dl.dataset.n==String(G.nodes.length)) return;
  dl.dataset.n=String(G.nodes.length);
  dl.innerHTML=[...G.nodes].sort((a,b)=>a.name.localeCompare(b.name)).map(n=>`<option value="${esc(n.name)}"></option>`).join("");
}
function jumpTo(q){
  q=(q||"").trim().toLowerCase(); if(!q) return;
  const n=G.nodes.find(n=>n.name.toLowerCase()===q)||G.nodes.find(n=>n.name.toLowerCase().startsWith(q))||G.nodes.find(n=>(n.name+" "+(n.cusp?.acronym||"")+" "+(n.cusp?.name_local||"")).toLowerCase().includes(q));
  if(n) focusNode(n);
}
document.getElementById("jumpq").addEventListener("change",e=>jumpTo(e.target.value));
document.getElementById("jumpq").addEventListener("keydown",e=>{ if(e.key==="Enter"){ jumpTo(e.target.value); e.target.blur(); } });

/* ---------- controls ---------- */
const on=(id,ev,fn)=>document.getElementById(id).addEventListener(ev,fn);
on("search","input",e=>{state.q=e.target.value.trim(); draw();});
on("colourBy","change",e=>{state.colourBy=e.target.value; legend(); draw();});
on("showLeaves","change",e=>{state.showLeaves=e.target.checked; startSim(.4);});
on("showRejected","change",e=>{state.showRejected=e.target.checked; startSim(.4);});
on("gravity","input",e=>{state.gravity=Math.pow(4,+e.target.value); if(simAlpha<0.3) startSim(0.3);});  // log scale 0.25x..4x
on("showLabels","change",e=>{state.showLabels=e.target.checked; draw();});
on("time","input",e=>{ const i=+e.target.value; state.tCut = i>=timeline.length ? Infinity : timeline[i-1]||"";
  document.getElementById("timeLabel").textContent = state.tCut===Infinity ? "all" : `up to ${state.tCut.replace("T"," ")}`; draw(); });
on("info","click",showInfo);
on("drain","click",async()=>{ const r=await api("/api/jobs",{mode:"check",start_node:selected?.id||null,max_nodes:30,max_steps:6}); alert(r.result==="queued"?`Queued ${r.job.id}: check-only job from ${r.job.start_name}`:(r.error||JSON.stringify(r))); refresh(); });
on("reheat","click",()=>{ for(const k in pos){ pos[k].fixed=false; } startSim(1); });
on("reset","click",()=>{ selected=null; showDetail(null); fitView(); });
let nodeMouseDown=false;
svg.addEventListener("click",()=>{ if(nodeMouseDown){ nodeMouseDown=false; return; } selected=null; showDetail(null); draw(); });
svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left-svg.clientWidth/2, my=e.clientY-r.top-svg.clientHeight/2;
  const k=Math.min(6,Math.max(.15,view.k*(e.deltaY<0?1.12:.89)));
  view.x=mx-(mx-view.x)*(k/view.k); view.y=my-(my-view.y)*(k/view.k); view.k=k; draw(); },{passive:false});
let pan=null;
svg.addEventListener("mousedown",e=>{ if(e.target===svg||e.target.tagName==="line"){ pan={x:e.clientX-view.x,y:e.clientY-view.y}; svg.classList.add("dragging"); }});
addEventListener("mousemove",e=>{ if(pan){ view.x=e.clientX-pan.x; view.y=e.clientY-pan.y; draw(); } tip.style.left=(e.clientX-265-8)+"px"; tip.style.top=(e.clientY-60)+"px"; });
addEventListener("mouseup",()=>{ pan=null; svg.classList.remove("dragging"); });
function dragNode(ev,n){
  dragging=n.id; startSim(Math.max(simAlpha,DRAG_ALPHA));  // reheat gently so the network follows the dragged node
  const move=e=>{ const r=svg.getBoundingClientRect(); const p=pos[n.id];
    p.x=(e.clientX-r.left-svg.clientWidth/2-view.x)/view.k; p.y=(e.clientY-r.top-svg.clientHeight/2-view.y)/view.k; p.fixed=true; draw(); };
  const up=()=>{ dragging=null; removeEventListener("mousemove",move); removeEventListener("mouseup",up); };  // node stays pinned where dropped; the rest settles
  addEventListener("mousemove",move); addEventListener("mouseup",up); }
new ResizeObserver(()=>draw()).observe(svg);
</script>
<script>
(function(){
  const SNAP = window.__SNAPSHOT, R = window.__review;
  const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;"}[c]));

  /* review box in the left panel */
  const box = document.createElement("div");
  box.innerHTML = `<h2>Your review</h2>
    <input type="text" id="reviewer" placeholder="Your name (goes into the download)" value="${esc(R.get().reviewer)}">
    <div class="sub" id="reviewCount" style="margin-top:4px"></div>
    <div class="btnrow"><button class="primary" id="dlReview">Download my review (JSON)</button><button id="clearReview">Clear</button></div>
    <div class="sub" style="margin-top:4px">Marks (✓ ✗ ?) and notes you make in the panel stay in this browser until you download them and send the file back.</div>`;
  const stats = document.getElementById("stats"); stats.parentNode.insertBefore(box, stats.nextSibling);
  const count = () => { const m = Object.values(R.get().marks); document.getElementById("reviewCount").textContent = `${m.length} mark${m.length === 1 ? "" : "s"} so far`; };
  document.getElementById("reviewer").addEventListener("input", e => R.setReviewer(e.target.value.trim()));
  document.getElementById("dlReview").onclick = () => {
    const r = R.get(); if (!r.reviewer) { alert("Please type your name first."); document.getElementById("reviewer").focus(); return; }
    const out = {reviewer: r.reviewer, snapshot_exported_at: SNAP.exported_at, downloaded_at: new Date().toISOString(), marks: Object.values(r.marks)};
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"}));
    a.download = `sd-review-${r.reviewer.replace(/[^a-z0-9]+/gi, "_")}-${out.downloaded_at.slice(0, 10)}.json`; a.click(); };
  document.getElementById("clearReview").onclick = () => { if (confirm("Delete all your marks in this browser?")) { R.clear(); refresh(); } };
  addEventListener("review-changed", count); count();

  /* Graph / Table tabs */
  const main = document.querySelector("main");
  const tabs = document.createElement("div"); tabs.id = "tabs";
  tabs.innerHTML = `<button id="tabGraph" class="on">Graph</button><button id="tabTable">Table</button>`;
  const tv = document.createElement("div"); tv.id = "tableView";
  main.appendChild(tabs); main.appendChild(tv);
  const css = document.createElement("style");
  css.textContent = `#tabs{position:absolute;left:12px;top:10px;display:flex;gap:4px;z-index:5}
    #tableView{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg);padding:44px 12px 12px;z-index:4}
    #tableView.on{display:block}
    .tbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:11.5px}
    .tbar input[type=search]{width:220px} .tbar select{width:auto;padding:4px 6px;font-size:11px}
    .tbl{width:100%;border-collapse:collapse;font-size:11.5px}
    .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
    .tbl th{position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none;z-index:1}
    .tbl tr:hover td{background:var(--panel2);cursor:pointer} .tbl td.wrap{white-space:normal;max-width:420px}`;
  document.head.appendChild(css);
  const show = t => { tv.classList.toggle("on", t === "table"); document.getElementById("tabGraph").classList.toggle("on", t === "graph"); document.getElementById("tabTable").classList.toggle("on", t === "table"); if (t === "table") buildTable(); };
  document.getElementById("tabGraph").onclick = () => show("graph");
  document.getElementById("tabTable").onclick = () => show("table");

  const COLS = [["kind", "Kind"], ["name", "Name"], ["type", "Type"], ["country", "Country"], ["level", "Level"], ["status", "Status"],
                ["verification", "Project verdict"], ["mark", "Your mark"], ["note", "Your note"], ["cusp", "CUSP gate"], ["origin", "Origin"],
                ["job", "Job"], ["source", "Found via"], ["quote", "Quote"], ["url", "URL"]];
  const FILTERABLE = new Set(["kind", "country", "level", "status", "verification", "mark", "cusp", "origin", "job"]);
  const tstate = {q: "", filters: {}, sort: "name", dir: 1};
  function rows() {
    const marks = R.get().marks, g = SNAP.graph, byId = Object.fromEntries(g.nodes.map(n => [n.id, n]));
    const srcOf = n => { const e = g.edges.find(e => (e.source === n.id || e.target === n.id) && e.type !== "part_of"); if (!e) return ""; const o = byId[e.source === n.id ? e.target : e.source]; return o ? o.name : ""; };
    const out = g.nodes.map(n => { const m = marks["node|" + n.id]; return {
      _id: n.id, _kind: "node", kind: n.kind, name: n.name, type: n.subkind || "", country: n.country || "", level: n.relevance, status: n.status,
      verification: n.verification.status, mark: m ? m.status : "", note: m ? (m.note || "") : "", cusp: n.cusp ? n.cusp.gate : "",
      origin: n.cusp ? "CUSP list" : n.baseline && n.baseline.set === "sweep" ? "agent + non-state sweep" : n.via === "seed" ? "seed" : "agent (new)",
      job: n.job || "", source: n.cusp && n.cusp.parent ? "unit of " + n.cusp.parent : srcOf(n), quote: (n.quote_en || n.quote || ""), url: n.url || ""}; });
    for (const c of g.candidates || []) { const m = marks["candidate|" + c.id]; const s = byId[c.source_node]; out.push({
      _id: c.source_node, _kind: "candidate", kind: "candidate", name: c.name, type: (c.relation && c.relation.type) || "", country: c.country_hint || "", level: "L0",
      status: c.kind === "recheck" ? "waiting (recheck)" : "waiting", verification: "", mark: m ? "check next" : "", note: "", cusp: "", origin: "harvest", job: c.job || "",
      source: s ? s.name : c.source_node, quote: c.quote || "", url: c.url || ""}); }
    return out;
  }
  function buildTable() {
    const all = rows(), q = tstate.q.toLowerCase();
    const vis = all.filter(r => Object.entries(tstate.filters).every(([c, v]) => !v || String(r[c] ?? "") === v) && (!q || Object.values(r).join(" ").toLowerCase().includes(q)))
                   .sort((a, b) => { const x = a[tstate.sort] ?? "", y = b[tstate.sort] ?? ""; return (x > y ? 1 : x < y ? -1 : 0) * tstate.dir; });
    const sel = c => { const vals = [...new Set(all.map(r => String(r[c] ?? "")))].sort(); return `<select data-f="${c}"><option value="">${esc(COLS.find(k => k[0] === c)[1])}: all</option>${vals.map(v => `<option value="${esc(v)}" ${tstate.filters[c] === v ? "selected" : ""}>${esc(v || "(empty)")}</option>`).join("")}</select>`; };
    tv.innerHTML = `<div class="tbar"><input type="search" id="tq" placeholder="Search all columns…" value="${esc(tstate.q)}">
        ${[...FILTERABLE].map(sel).join("")}<button id="tclear">Clear filters</button><button id="tcsv">Download CSV</button><span class="sub">${vis.length} of ${all.length} rows</span></div>
      <table class="tbl"><thead><tr>${COLS.map(([c, l]) => `<th data-s="${c}">${esc(l)}${tstate.sort === c ? (tstate.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
      <tbody>${vis.map(r => `<tr data-id="${esc(r._id)}">${COLS.map(([c]) => `<td class="${c === "quote" ? "wrap" : ""}" title="${esc(r[c])}">${c === "url" && r[c] ? `<a href="${esc(r[c])}" target="_blank" rel="noopener">${esc(r[c].replace(/^https?:\/\/(www\.)?/, "").slice(0, 40))}</a>` : esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    tv.querySelector("#tq").addEventListener("input", e => { tstate.q = e.target.value; buildTable(); tv.querySelector("#tq").focus(); });
    tv.querySelectorAll("[data-f]").forEach(s => s.onchange = () => { tstate.filters[s.dataset.f] = s.value; buildTable(); });
    tv.querySelector("#tclear").onclick = () => { tstate.filters = {}; tstate.q = ""; buildTable(); };
    tv.querySelectorAll("th[data-s]").forEach(h => h.onclick = () => { if (tstate.sort === h.dataset.s) tstate.dir *= -1; else { tstate.sort = h.dataset.s; tstate.dir = 1; } buildTable(); });
    tv.querySelectorAll("tbody tr").forEach(tr => tr.onclick = e => { if (e.target.tagName === "A") return; const n = G.byId[tr.dataset.id]; if (n) { selected = n; showDetail(n); draw(); } });
    tv.querySelector("#tcsv").onclick = () => {
      const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = [COLS.map(c => cell(c[1])).join(","), ...vis.map(r => COLS.map(([c]) => cell(r[c])).join(","))].join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], {type: "text/csv;charset=utf-8"})); a.download = "science-diplomacy-actors.csv"; a.click(); };
  }
  addEventListener("review-changed", () => { if (tv.classList.contains("on")) buildTable(); });
})();
</script>
</body>
